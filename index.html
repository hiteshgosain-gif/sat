ion, though she agrees many zoos need better habitats.", "stem": "How would the conservationist most likely respond to Text 1?", "choices": ["By agreeing that all zoos should close", "By arguing that zoos can play an important conservation role, even if improvements are needed", "By claiming zoos do not entertain", "By saying condors are not endangered"], "ans": 1, "exp": "She cites conservation success and concedes needed improvements. B."}, {"id": "r211", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: A technology writer predicts that AI tutors will soon replace human teachers. Text 2: An education researcher found students using AI tutors improved on practice drills, but gains were largest when a teacher also reviewed their work and discussed mistakes.", "stem": "Based on Text 2, how would the researcher most likely view the prediction in Text 1?", "choices": ["As supported, since AI tutors improved drills", "As overstated, since the best results came from combining AI with teachers", "As irrelevant, since drills don't matter", "As proven, since teachers are unnecessary"], "ans": 1, "exp": "The data favors AI + teacher, not replacement."}, {"id": "r212", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "medium", "type": "mc", "passage": "Text 1: A chef argues that local ingredients taste better because they're fresher. Text 2: A food scientist found that in blind taste tests, freshness mattered more than distance traveled; some imported produce, flash-frozen at harvest, scored as high as local produce.", "stem": "How would the food scientist most likely respond to the chef?", "choices": ["Freshness, not locality itself, is what improves taste.", "Local food always tastes worse.", "Frozen food is never fresh.", "Taste cannot be tested."], "ans": 0, "exp": "The key variable is freshness. A."}, {"id": "r213", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: A historian credits the Industrial Revolution's start in Britain mainly to its abundant coal. Text 2: Another historian agrees that coal mattered but argues Britain's high wages also pushed inventors to develop labor-saving machines.", "stem": "Which choice best describes the relationship between the texts?", "choices": ["Text 2 accepts Text 1's factor but adds another cause.", "Text 2 rejects coal as a factor.", "Both texts ignore coal.", "Text 1 discusses wages only."], "ans": 0, "exp": "'Agrees... but also' → adds a cause."}, {"id": "r214", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "The professor's lecture was so ______ that students who had never studied astronomy could follow every step.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["accessible", "esoteric", "rushed", "disorganized"], "ans": 0, "exp": "Easy for beginners = accessible."}, {"id": "r215", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The company's ______ response to the data breach—waiting three weeks to notify customers—drew sharp criticism from regulators.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["dilatory", "prompt", "transparent", "generous"], "ans": 0, "exp": "Waiting three weeks = dilatory (slow, delaying)."}, {"id": "r216", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "The author describes the old train station's cracked tiles, broken clock, and empty benches before revealing that a local group plans to turn it into a public library.", "stem": "What is the main purpose of the description of the station?", "choices": ["To establish its run-down condition before introducing a plan to revive it", "To argue that trains are outdated", "To describe how clocks break", "To criticize the local group"], "ans": 0, "exp": "Decay described first, then revival plan."}, {"id": "r217", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Critics called the film's ending ______, since it resolved every conflict neatly in the final two minutes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["contrived", "ambiguous", "haunting", "understated"], "ans": 0, "exp": "An unrealistically neat resolution is contrived."}, {"id": "r218", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The new vaccine was highly effective in clinical trials. ______, distributing it to rural areas proved difficult because it required ultra-cold storage.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["However", "Therefore", "Likewise", "For example"], "ans": 0, "exp": "Effective vs. distribution difficulty: contrast."}, {"id": "r219", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Coral can recover from bleaching if water temperatures return to normal quickly. ______, prolonged heat waves often kill the coral entirely.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["By contrast", "Thus", "Additionally", "For instance"], "ans": 0, "exp": "Quick recovery vs. prolonged heat → contrast."}, {"id": "r220", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "The library extended its hours. ______, it added a homework help desk staffed by volunteers.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Furthermore", "However", "Instead", "Otherwise"], "ans": 0, "exp": "Adding another improvement."}, {"id": "r221", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The town council approved the park in 2019. Construction, ______, did not begin until 2023 because of funding delays.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["however", "therefore", "for example", "similarly"], "ans": 0, "exp": "Approved but delayed: contrast."}, {"id": "r222", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Lightning heats the surrounding air to about 50,000°F. ______, the air expands so rapidly that it creates the shock wave we hear as thunder.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["As a result", "Even so", "In contrast", "For instance"], "ans": 0, "exp": "Heating causes expansion → result."}, {"id": "r223", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Some plants, such as cacti, store water in thick stems. ______, they can survive months without rain.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Consequently", "However", "Similarly", "Previously"], "ans": 0, "exp": "Storing water allows survival → cause/effect."}, {"id": "r224", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Many early critics dismissed jazz as a passing fad. ______, it became one of the most influential musical forms of the twentieth century.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["In fact", "Likewise", "Specifically", "For example"], "ans": 0, "exp": "'In fact' contradicts/corrects the earlier dismissal emphatically."}, {"id": "r225", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Scientists predicted the comet would be dim. ______, it blazed brightly enough to be seen in daylight.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Contrary to these predictions", "As expected", "In addition", "For this reason"], "ans": 0, "exp": "Outcome opposite to prediction."}, {"id": "r226", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • The Rio Grande forms part of the U.S.–Mexico border. • It is about 1,900 miles long. • In some dry years, parts of the river stop flowing before reaching the Gulf. • Heavy irrigation draws much of its water.", "stem": "The student wants to explain why parts of the river sometimes stop flowing. Which choice best accomplishes this goal?", "choices": ["The Rio Grande is about 1,900 miles long.", "Because heavy irrigation draws much of its water, parts of the Rio Grande sometimes stop flowing in dry years.", "The Rio Grande forms part of the border.", "The Rio Grande flows to the Gulf."], "ans": 1, "exp": "B gives the cause and the effect."}, {"id": "r227", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Ada Lovelace worked with Charles Babbage on his Analytical Engine. • She wrote an algorithm for the machine in 1843. • Many consider it the first computer program. • The machine was never built.", "stem": "The student wants to emphasize the significance of Lovelace's work despite a limitation. Which choice best accomplishes this goal?", "choices": ["Ada Lovelace worked with Charles Babbage.", "Although the Analytical Engine was never built, Ada Lovelace's 1843 algorithm for it is often considered the first computer program.", "The Analytical Engine was a machine.", "Lovelace wrote in 1843."], "ans": 1, "exp": "B includes significance and limitation."}, {"id": "r228", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • Austin is the capital of Texas. • Houston is the most populous city in Texas. • San Antonio is home to the Alamo.", "stem": "The student wants to identify the most populous Texas city. Which choice best accomplishes this goal?", "choices": ["Austin is the capital of Texas.", "Houston is the most populous city in Texas.", "San Antonio is home to the Alamo.", "Texas has many large cities."], "ans": 1, "exp": "Direct match."}, {"id": "r229", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Sloths move very slowly, about 0.15 mph. • Their slow metabolism lets them survive on leaves, which provide little energy. • Algae grows on their fur, helping camouflage them.", "stem": "The student wants to explain how a sloth's slowness relates to its diet. Which choice best accomplishes this goal?", "choices": ["Sloths move about 0.15 mph.", "Sloths' slow metabolism—and slow movement—let them survive on low-energy leaves.", "Algae grows on sloth fur.", "Sloths are camouflaged."], "ans": 1, "exp": "B connects slowness/metabolism to diet."}, {"id": "r230", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Study A found students who exercised before class scored higher on attention tests. • Study B found no effect in a larger group. • Study B used older students.", "stem": "The student wants to present the studies' conflicting results and a possible reason for the difference. Which choice best accomplishes this goal?", "choices": ["Study A found exercise helped attention.", "While Study A found that exercise before class improved attention, the larger Study B found no effect—possibly because it involved older students.", "Study B used older students.", "Exercise is healthy."], "ans": 1, "exp": "B includes conflict and a possible reason."}, {"id": "r231", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • The Mars rover Perseverance landed in 2021. • It carried a small helicopter named Ingenuity. • Ingenuity made the first powered flight on another planet.", "stem": "The student wants to highlight Ingenuity's achievement. Which choice best accomplishes this goal?", "choices": ["Perseverance landed in 2021.", "Ingenuity, a small helicopter carried by Perseverance, made the first powered flight on another planet.", "Ingenuity was small.", "Perseverance is a rover."], "ans": 1, "exp": "B states the achievement."}, {"id": "r232", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Venice, Italy, is built on 118 small islands. • Rising seas cause frequent flooding. • In 2020, Venice began using MOSE, a system of movable barriers. • The barriers rise from the seafloor during high tides.", "stem": "The student wants to describe how Venice is addressing flooding. Which choice best accomplishes this goal?", "choices": ["Venice is built on 118 islands.", "Venice floods often.", "To fight flooding, Venice began using MOSE in 2020, a system of barriers that rise from the seafloor during high tides.", "Venice is in Italy."], "ans": 2, "exp": "C describes the solution and how it works."}, {"id": "r233", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Both frogs and toads are amphibians. • Frogs usually have smooth, moist skin. • Toads usually have dry, bumpy skin. • Toads often live farther from water.", "stem": "The student wants to emphasize a difference between frogs and toads. Which choice best accomplishes this goal?", "choices": ["Frogs and toads are amphibians.", "Frogs usually have smooth, moist skin, whereas toads usually have dry, bumpy skin.", "Toads live on land.", "Frogs are green."], "ans": 1, "exp": "'Whereas' highlights a difference."}, {"id": "r234", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Honey never truly spoils. ______, edible honey has been found in ancient Egyptian tombs.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["In fact", "However", "Instead", "Otherwise"], "ans": 0, "exp": "Supporting evidence that intensifies the claim: 'In fact.'"}, {"id": "r235", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The budget cuts reduced the number of librarians. ______, volunteers stepped in to keep the reading program running.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Even so", "As a result of the program", "Similarly", "Specifically"], "ans": 0, "exp": "Despite cuts, the program continued: concession → 'Even so.'"}, {"id": "r236", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • Pecans are the state nut of Texas. • Texas produces millions of pounds of pecans each year. • Pecan pie is a popular Thanksgiving dessert.", "stem": "The student wants to show that pecans are economically important in Texas. Which choice best accomplishes this goal?", "choices": ["Pecan pie is popular at Thanksgiving.", "Texas produces millions of pounds of pecans each year.", "Pecans are nuts.", "Pecans are the state nut."], "ans": 1, "exp": "Production figure shows economic importance."}, {"id": "r237", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Most mammals can produce their own vitamin C. Humans, ______, must get it from food.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["for example", "by contrast", "therefore", "similarly"], "ans": 1, "exp": "Humans are an exception to what most mammals can do: contrast → 'by contrast.'"}, {"id": "r238", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The museum's new wing features three ______ ancient pottery, Renaissance paintings, and modern sculpture.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["collections:", "collections;", "collections,", "collections"], "ans": 0, "exp": "Colon after a complete clause introduces a list."}, {"id": "r239", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "In 1953, Edmund Hillary and Tenzing ______ became the first climbers confirmed to reach Everest's summit.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["Norgay", "Norgay,", "Norgay;", "Norgay—"], "ans": 0, "exp": "Subject and verb shouldn't be separated by a single comma: no punctuation."}, {"id": "r240", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "After weeks of ______ the students finally presented their project to the school board.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["preparation,", "preparation;", "preparation:", "preparation."], "ans": 0, "exp": "Introductory phrase → comma."}, {"id": "r241", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The recipe calls for an unusual ______ a pinch of black pepper in the chocolate cake.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["ingredient:", "ingredient;", "ingredient, and", "ingredient"], "ans": 0, "exp": "Colon introduces the explanation of 'an unusual ingredient.'"}, {"id": "r242", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "Jupiter's moon ______ which is covered in ice, may hide a liquid ocean.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["Europa,", "Europa", "Europa;", "Europa:"], "ans": 0, "exp": "Nonessential clause after the name needs commas on both sides."}, {"id": "r243", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The bridge took six years to ______ it was finally completed in 1937.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["build;", "build,", "build", "build, it"], "ans": 0, "exp": "Two independent clauses: semicolon."}, {"id": "r244", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "The cafeteria offers several ______ tacos, pasta, and salads.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["options:", "options;", "options, such", "options"], "ans": 0, "exp": "Colon after a complete clause before a list."}, {"id": "r245", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The documentary—filmed over five years in the ______ follows a family of snow leopards.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["Himalayas—", "Himalayas,", "Himalayas;", "Himalayas"], "ans": 0, "exp": "The interrupting phrase opened with a dash must close with a dash."}, {"id": "r246", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "Some animals hibernate in ______ others, like the Arctic fox, stay active all season.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["winter; however,", "winter, however,", "winter however", "winter; however"], "ans": 0, "exp": "'; however,' between independent clauses."}, {"id": "r247", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "My favorite author ______ writes mystery novels set in Texas.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["Ana Martinez", "Ana Martinez,", "Ana Martinez;", "Ana, Martinez"], "ans": 0, "exp": "'Ana Martinez' is essential (identifies which author); no commas."}, {"id": "r248", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "A collection of letters written by soldiers during the Civil War ______ on display at the state archive.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["is", "are", "were", "have been"], "ans": 0, "exp": "Subject 'collection' is singular."}, {"id": "r249", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Either the twins or their older brother ______ going to drive.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["is", "are", "were", "have"], "ans": 0, "exp": "Agrees with nearer subject 'brother' (singular)."}, {"id": "r250", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "Every one of the paintings ______ been restored.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["has", "have", "are", "were"], "ans": 0, "exp": "'Every one' is singular: has."}, {"id": "r251", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Hoping to finish before dark, ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["the hikers walked faster.", "the trail seemed longer.", "darkness approached quickly.", "the sun set behind the hills."], "ans": 0, "exp": "The hikers are the ones hoping; they must follow the modifier."}, {"id": "r252", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "The committee will review the proposals, select the strongest ones, and ______ the results next month.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["announce", "announcing", "announced", "to announce"], "ans": 0, "exp": "Parallel: review, select, and announce."}, {"id": "r253", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "The orchestra, along with its two guest soloists, ______ performing tonight.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["is", "are", "were", "have been"], "ans": 0, "exp": "'Along with its two guest soloists' is a side phrase; the subject is 'orchestra' (singular), and 'tonight' fits present tense: 'is.'"}, {"id": "r254", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "By the time the concert started, the band ______ for three hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["had rehearsed", "rehearses", "will reh ll the mean far more than the median.", "Standard deviation measures spread. Adding the same constant to every value doesn't change it."], "formulas": ["Sum = mean × count", "New value = new total − old total"], "example": "5 scores average 80, so the total is 400. With a 6th score the average is 82, so the total is 492. The 6th score is 92.", "traps": ["Forgetting to sort the data before finding the median.", "With an even count, the median is the average of the 2 middle values."], "desmos": "Enter list L = [ … ] and use mean(L), median(L), stdev(L).", "links": ["ka_math", "yt_scalar_desmos"]}, {"id": "prob", "sec": "math", "dom": "Problem-Solving & Data Analysis", "title": "Probability & two-way tables", "concepts": ["P = favorable/total.", "Conditional probability ('given…' or 'of those who…'): the denominator is just that group.", "P(A or B) = P(A) + P(B) − P(A and B)."], "formulas": ["P(A | B) = count(A and B)/count(B)"], "example": "Out of 50 seniors, 20 take AP Bio and 8 of those also take AP Chem. P(Chem | Bio) = 8/20 = 0.4.", "traps": ["Using the grand total when the question restricts the group."], "desmos": "Use it as a calculator for the fraction, e.g. 8/20.", "links": ["ka_math"]}, {"id": "data2", "sec": "math", "dom": "Problem-Solving & Data Analysis", "title": "Two-variable data, models & inference", "concepts": ["In a best-fit line the slope is the predicted change per unit, and the intercept is the predicted value at x = 0.", "Margin of error gives a plausible range. Random sampling lets you generalize to the population.", "Random assignment is what lets you claim cause and effect."], "formulas": ["Plausible range = estimate ± margin of error"], "example": "With y = 3.2x + 15 for hours studied (x) and score (y), each extra hour predicts about 3.2 more points.", "traps": ["Claiming causation from an observational study.", "Generalizing to a population that wasn't sampled."], "desmos": "Use a table plus y₁ ~ mx₁ + b for linear regression. Use y₁ ~ a·b elevant are traps."], "formulas": ["A claim with 2 parts needs evidence for both parts."], "example": "Claim: scores rose overall but not every year. The right choice must show both an overall rise and at least one dip.", "traps": ["Picking a quote that matches the topic but not the claim.", "Reading the wrong row or column of a table."], "desmos": "", "links": ["ka_rw", "cb_rw"]}, {"id": "inf", "sec": "rw", "dom": "Information and Ideas", "title": "Inferences", "concepts": ["The answer has to follow from the text alone. It's the most limited conclusion the text supports.", "Look for the logical chain: premise → premise → conclusion."], "formulas": ["Supported = what MUST be true, not what COULD be true"], "example": "Text: speed didn't change but crashes dropped. The inference is that something other than speed explains the drop.", "traps": ["Choices that go beyond the text or assume causation."], "desmos": "", "links": ["ka_rw"]}, {"id": "wic", "sec": "rw", "dom": "Craft and Structure", "title": "Words in context", "concepts": ["Cover the choices and predict your own word from the clues.", "Clue signals: a colon or semicolon (restates), 'although' or 'rather than' (contrast), 'because' (cause)."], "formulas": ["Prediction → choose the closest choice → check its tone (positive/negative)"], "example": "'Rather than ___ the theory, she acknowledged its strengths' → the contrast with acknowledging points to 'dismiss.'", "traps": ["Choosing a familiar word that means the opposite of what the clue requires.", "Choosing a word with the right topic but the wrong strength (too extreme)."], "desmos": "", "links": ["ka_wic", "ka_rw"]}, {"id": "ts", "sec": "rw", "dom": "Craft and Structure", "title": "Text structure & purpose", "concepts": ["Label what each sentence does: claim, example, counterpoint, qualification, conclusion.", "'Purpose' asks why the author wrote it: to explain, argue, describe, or contrast."], "formulas": ["Function of a sentence = its relationship to the function runPractice(pool,mode,el){let i=0,c=0;if(!pool.length){el.innerHTML='<div class="card">No questions match.</div>';return}

function test(){app.innerHTML=`<div class="card"><h2>Timed mini-test</h2><p>Real digital SAT modules: R&W has 2 modules of 27 questions in 32 minutes each; Math has 2 modules of 22 questions in 35 minutes each. The real test is adaptive (module 2 gets harder if you do well on module 1). This mini-test mimics one module.</p>

function pickTest(sec,n){const pool=QS.filter(q=>q.sec===sec);const per=Math.ceil(n/4);let out=[];for(const d of DOMS[sec])out=out.concat(shuffle(pool.filter(q=>q.dom===d)).slice(0,per));out=shuffle(out).slice(0,n);

 const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');

  <div class="qnav">${qs.map((_,k)=>`<button data-j="${k}" class="${resp[k]!=null&&resp[k]!==''?'done':''} ${k===i?'cur':''}">${k+1}</button>`).join('')}</div></div>
  <div class="card">${qHTML(q,i)}<div class="row" style="margin-top:10px"><button class="btn" id="prev" ${i?'':'disabled'}>← Back</button><button class="btn" id="next" ${i<qs.length-1?'':'disabled'}>Next →</button><button class="btn p" id="sub" style="margin-left:auto">Submit test</button></div></div>`;
  if(q.type==='mc'){app.querySelectorAll('.ch').forEach(b=>{if(+b.dataset.k===resp[i])b.classList.add('sel');b.onclick=()=>{resp[i]=+b.dataset.k;draw()}})}else{const inp=$('#spr');inp.value=resp[i]??'';inp.oninput=()=>{resp[i]=inp.value;const nb=app.querySelector(`.qnav [data-j="${i}"]`);nb.classList.toggle('done',inp.value!=='')}}
  app.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{i=+b.dataset.j;draw()});$('#prev').onclick=()=>{i--;draw()};$('#next').onclick=()=>{i++;draw()};$('#sub').onclick=()=>{const u=resp.filter(r=>r==null||r==='').length;if(!u||confirm(u+' unanswered. Submit anyway?'))finish()}};
 const finish=()=>{clearInterval(window._tm);let c=0;qs.forEach((q,k)=>{if(record(q,resp[k],'test'))c++});S.tests.push({t:Date.now(),sec,n:qs.length,c,used:Math.round((Date.now()-start)/1000)});save();
  app.innerHTML=`<div class="card"><h2>Result: ${c}/${qs.length} (${Math.round(100*c/qs.length)}%)</h2><p class="mu">Missed questions were added to Mistake Review.</p><button class="btn p" onclick="view('dash')">Dashboard</button> <button class="btn" onclick="view('review')">Review mistakes</button></div>`+

function modScore(route,c1,c2,n){const p1=c1/n,p2=c2/n;let s;if(route==='h')s=200+600*Math.pow((p1+1.25*p2)/2.25,1.15);else s=200+440*((p1+p2*0.85)/1.85);return Math.max(200,Math.min(800,Math.round(s/10)*10))}
function full(){app.innerHTML=`<div class="card"><h2>Full-length practice test</h2>
<p>This follows the digital SAT layout: <b>Reading & Writing</b> is 2 modules × 27 questions × 32 min, then a <b>10-minute break</b>, then <b>Math</b>, 2 modules × 22 questions × 35 min. Total time is about 2 h 24 min.</p>
<p><b>Adaptive:</b> if you get about 60% or more right in module 1, module 2 is the harder version. A top score is only possible on the harder route, just like the real test.</p>
<div class="row">${FULL.map((_,i)=>`<button class="btn p" data-ft="${i}">Practice Test ${i+1}</button>`).join('')}</div>
<p class="mu">Tests 1–4 are pre-built from separate questions (module 1 and the harder module 2 don't overlap across tests). Scores are rough estimates, not official. For a real benchmark, take the official adaptive tests in <a href="https://bluebook.collegeboard.org/" target="_blank" rel="noopener">Bluebook</a>. Have Desmos ready for Math.</p></div>`;
 app.querySelectorAll('[data-ft]').forEach(b=>b.onclick=()=>{if(confirm('Start Practice Test '+(+b.dataset.ft+1)+'? It takes about 2.5 hours. The timer runs per module.'))runFull(+b.dataset.ft)})}
function runFull(ti){const T=FULL[ti],res={rw:{},math:{}},start=Date.now();let all=[];
 const steps=[['rw','m1'],['rw','m2'],['break'],['math','m1'],['math','m2']];let si=0;
 const next=()=>{if(si>=steps.length)return done();const st=steps[si++];
  if(st[0]==='break'){let left=600;app.innerHTML=`<div class="card" style="text-align:center"><h2>Break: 10 minutes</h2><p class="timer big" id="brk">10:00</p><p>Stand up, drink water, and look away from the screen. Math is next.</p><button class="btn p" id="skip">Start Math now</button></div>`;
   window._tm=setInterval(()=>{left--;const e=$('#brk');if(e)e.textContent=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');if(left<=0){clearInterval(window._tm);next()}},1000);$('#skip').onclick=()=>{clearInterval(window._tm);next()};return}
  const [sec,m]=st;let ids;if(m==='m1')ids=T[sec].m1;else{res[sec].route=res[sec].c1/T[sec].m1.length>=0.6?'h':'e';ids=res[sec].route==='h'?T[sec].m2h:T[sec].m2e}
  const qs=ids.map(id=>byId[id]);const label=`${SEC[sec]} · Module ${m==='m1'?1:2}${m==='m2'?(res[sec].route==='h'?' (harder)':' (standard)'):''}`;
  moduleRun(qs,sec==='rw'?32:35,label,(resp)=>{let c=0;qs.forEach((q,k)=>{if(record(q,resp[k],'full'))c++;all.push([q,resp[k]])});if(m==='m1')res[sec].c1=c;else res[sec].c2=c;
   app.innerHTML=`<div class="card"><h3>${label} complete</h3><p>Moving on…</p><button class="btn p" id="cont">Continue</button></div>`;$('#cont').onclick=next})};
 const done=()=>{const n=T.rw.m1.length,mn=T.math.m1.length;const rw=modScore(res.rw.route,res.rw.c1,res.rw.c2,n),ma=modScore(res.math.route,res.math.c1,res.math.c2,mn);const c=res.rw.c1+res.rw.c2+res.math.c1+res.math.c2;
  S.tests.push({t:Date.now(),sec:'full',name:ti+1,n:2*(n+mn),c,rw,math:ma,routes:res.rw.route+res.math.route,used:Math.round((Date.now()-start)/1000)});save();
  app.innerHTML=`<div class="card"><h2>Practice Test ${ti+1} results</h2><div class="grid"><div class="card"><div class="mu">Estimated total*</div><div class="big">${rw+ma}</div></div><div class="card"><div class="mu">R&W*</div><div class="big">${rw}</div><div class="mu">M1 ${res.rw.c1}/${n}, M2 ${res.rw.c2}/${n} (${res.rw.route==='h'?'harder':'standard'})</div></div><div class="card"><div class="mu">Math*</div><div class="big">${ma}</div><div class="mu">M1 ${res.math.c1}/${mn}, M2 ${res.math.c2}/${mn} (${res.math.route==='h'?'harder':'standard'})</div></div></div><p class="mu">*Rough estimate based on this app's own items and a simple formula, not College Board scoring.</p><button class="btn p" onclick="view('dash')">Dashboard</button> <button class="btn" onclick="view('review')">Review mistakes</button></div>`+
  all.map(([q,r],k)=>{const ok=isCorrect(q,r);const ua=r==null||r===''?'(blank)':q.type==='mc'?'ABCD'[r]:r;const ca=q.type==='mc'?'ABCD'[q.ans]:q.ans;return `<div class="card"><b style="color:var(${ok?'--ok':'--bad'})">${ok?'✓':'✗'} Q${k+1}</b> <span class="mu">your answer: ${esc(ua)} · correct: ${esc(ca)}</span>${qHTML(q)}<div class="exp">${esc(q.exp)}</div></div>`}).join('')};

function moduleRun(qs,min,label,cb){const resp=Array(qs.length).fill(null);let i=0,left=min*60;const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');clearInterval(window._tm);
 const draw=()=>{const q=qs[i];app.innerHTML=`<div class="card"><div class="row" style="justify-content:space-between"><b>${label}</b><span class="timer" id="tmr">⏱ ${fmt(left)}</span></div><div class="qnav">${qs.map((_,k)=>`<button data-j="${k}" class="${resp[k]!=null&&resp[k]!==''?'done':''} ${k===i?'cur':''}">${k+1}</button>`).join('')}</div></div>
 <div class="card">${qHTML(q,i)}<div class="row" style="margin-top:10px"><button class="btn" id="prev" ${i?'':'disabled'}>← Back</button><button class="btn" id="next" ${i<qs.length-1?'':'disabled'}>Next →</button><button class="btn p" id="sub" style="margin-left:auto">Submit module</button></div></div>`;
  if(q.type==='mc')app.querySelectorAll('.ch').forEach(b=>{if(+b.dataset.k===resp[i])b.classList.add('sel');b.onclick=()=>{resp[i]=+b.dataset.k;draw()}});else{const inp=$('#spr');inp.value=resp[i]??'';inp.oninput=()=>{resp[i]=inp.value}}
  app.querySelectorAll('.qnav button').forEach(b=>b.onclick=()=>{i=+b.dataset.j;draw()});$('#prev').onclick=()=>{i--;draw()};$('#next').onclick=()=>{i++;draw()};
  $('#sub').onclick=()=>{const u=resp.filter(r=>r==null||r==='').length;if(!u||confirm(u+' unanswered. Submit module anyway?'))fin()}};
 const fin=()=>{clearInterval(window._tm);cb(resp)};
 window._tm=setInterval(()=>{left--;const t=$('#tmr');if(t){t.textContent='⏱ '+fmt(left);if(left<=300)t.style.color='var(--bad)'}if(left<=0){alert('Time is up for this module.');fin()}},1000);draw()}
// ---------- Encyclopedia ----------
let encCur=null;
function enc(){const groups={};ENC.forEach(e=>{const g=(e.sec==='math'?'Math · ':e.sec==='rw'?'R&W · ':'')+e.dom;(groups[g]=groups[g]||[]).push(e)});
 app.innerHTML=`<div class="card"><h2>📚 SAT Skills Encyclopedia</h2><p class="mu">These are original study notes for every tested skill. The <b>Watch & Read</b> links open free lessons, videos, and official College Board resources in a new tab (internet required).</p><input type="text" id="es" placeholder="Search skills (e.g. circles, semicolon, percent)…" style="width:100%"></div>
 <div class="encw"><div class="card side" id="side">${Object.entries(groups).map(([g,es])=>`<h4>${esc(g)}</h4>`+es.map(e=>`<a href="#" data-e="${e.id}">${esc(e.title)}</a>`).join('')).join('')}</div><div id="ebody"></div></div>`;
 const show=id=>{const e=ENC.find(x=>x.id===id)||ENC[0];encCur=e.id;app.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',a.dataset.e===e.id));
  const li=a=>a.length?'<ul>'+a.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':'';
  const links=e.links.map(k=>RES[k]).filter(Boolean);
  $('#ebody').innerHTML=`<div class="card"><div class="mu">${e.sec==='math'?'Math':e.sec==='rw'?'Reading & Writing':'General'} · ${esc(e.dom)}</div><h2>${esc(e.title)}</h2>
  <h3>Key concepts</h3>${li(e.concepts)}<h3>Formulas & rules</h3>${li(e.formulas)}<h3>Worked example</h3><div class="ex">${esc(e.example)}</div>
  <h3>Common traps</h3>${li(e.traps)}${e.desmos?`<h3>Desmos tip</h3><p>${esc(e.desmos)}</p>`:''}
  <h3>Watch & Read</h3><ul class="res">${links.map(r=>`<li><a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a> <span class="mu">— ${esc(r.site)}</span></li>`).join('')}</ul>
  ${e.sec!=='all'?`<button class="btn p" id="pr">Practice this domain →</button>`:''}</div>`;
  const pb=$('#pr');if(pb)pb.onclick=()=>{view('practice');$('#pd').value=e.sec+'|'+e.dom;$('#go').click()}};
 app.querySelectorAll('#side a').forEach(a=>a.onclick=ev=>{ev.preventDefault();show(a.dataset.e)});
 $('#es').oninput=ev=>{const s=ev.target.value.toLowerCase();app.querySelectorAll('#side a').forEach(a=>{const e=ENC.find(x=>x.id===a.dataset.e);const hay=(e.title+' '+e.dom+' '+e.concepts.join(' ')+' '+e.formulas.join(' ')+' '+e.traps.join(' ')).toLowerCase();a.style.display=hay.includes(s)?'':'none'})};
 show(encCur||ENC[0].id)}
view('dash');
</script></body></html>
