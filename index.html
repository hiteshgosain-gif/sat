lue of c does the system y = 3x + 4 and 6x − 2y = c have infinitely many solutions?", "exp": "Rewrite the first: 3x − y = −4, then double it: 6x − 2y = −8. Identical lines need c = −8.", "type": "mc", "choices": ["-4", "8", "4", "-8"], "ans": 3}, {"id": "m216", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "For what value of c does the system y = 5x + 4 and 10x − 2y = c have infinitely many solutions?", "exp": "Rewrite the first: 5x − y = −4, then double it: 10x − 2y = −8. Identical lines need c = −8.", "type": "mc", "choices": ["-8", "8", "4", "-4"], "ans": 0}, {"id": "m217", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "If f(x) = 2x + 3 and g(x) = x², what is g(f(2))?", "exp": "First f(2) = 2(2) + 3 = 7. Then g(7) = 49.", "type": "mc", "choices": ["14", "49", "11", "15"], "ans": 1}, {"id": "m218", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "If f(x) = 3x − 1 and g(x) = x², what is g(f(2))?", "exp": "First f(2) = 3(2) − 1 = 5. Then g(5) = 25.", "type": "mc", "choices": ["10", "25", "11", "35"], "ans": 1}, {"id": "m219", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "If f(x) = -1x + 4 and g(x) = x², what is g(f(2))?", "exp": "First f(2) = -1(2) + 4 = 2. Then g(2) = 4.", "type": "mc", "choices": ["6", "4", "5", "0"], "ans": 1}, {"id": "m220", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "If f(x) = 4x + 2 and g(x) = x², what is g(f(2))?", "exp": "First f(2) = 4(2) + 2 = 10. Then g(10) = 100.", "type": "mc", "choices": ["100", "18", "20", "21"], "ans": 0}, {"id": "m221", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "If 2^(x + 1) = 32, what is x?", "exp": "32 = 2^5, so x + 1 = 5 and x = 4.", "type": "mc", "choices": ["5", "4", "6", "16"], "ans": 1}, {"id": "m222", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "If 3^(x + 1) = 81, what is x?", "exp": "81 = 3^4, so x + 1 = 4 and x = 3.", "type": "mc", "choices": ["27", "4", "5", "3"], "ans": 3}, {"id": "m223", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "If 5^(x + 1) = 125, what is x?", "exp": "125 = 5^3, so x + 1 = 3 and x = 2.", "type": "mc", "choices": ["3", "4", "25", "2"], "ans": 3}, {"id": "m224", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "If 2^(x + 1) = 128, what is x?", "exp": "128 = 2^7, so x + 1 = 7 and x = 6.", "type": "mc", "choices": ["7", "64", "8", "6"], "ans": 3}, {"id": "m225", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The polynomial p(x) = x² + 2x + k has (x − 3) as a factor. What is k?", "exp": "If (x − 3) is a factor, p(3) = 0: 9 + 6 + k = 0, so k = -15.", "type": "mc", "choices": ["15", "-15", "6", "9"], "ans": 1}, {"id": "m226", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The polynomial p(x) = x² + 5x + k has (x + 2) as a factor. What is k?", "exp": "If (x + 2) is a factor, p(-2) = 0: 4 − 10 + k = 0, so k = 6.", "type": "mc", "choices": ["-6", "6", "-10", "4"], "ans": 1}, {"id": "m227", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The polynomial p(x) = x² − 3x + k has (x − 4) as a factor. What is k?", "exp": "If (x − 4) is a factor, p(4) = 0: 16 − 12 + k = 0, so k = -4.", "type": "mc", "choices": ["16", "-4", "-12", "4"], "ans": 1}, {"id": "m228", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "$1000 is invested at 4% interest compounded annually. What is the balance after 2 years, to the nearest cent?", "exp": "Balance = 1000(1.04)² = 1000 × 1.0816 = $1081.60.", "type": "mc", "choices": ["1121.6", "1040", "1081.6", "1080"], "ans": 2}, {"id": "m229", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "$2500 is invested at 6% interest compounded annually. What is the balance after 2 years, to the nearest cent?", "exp": "Balance = 2500(1.06)² = 2500 × 1.1236 = $2809.00.", "type": "mc", "choices": ["2809", "2650", "2800", "2959"], "ans": 0}, {"id": "m230", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "$800 is invested at 5% interest compounded annually. What is the balance after 2 years, to the nearest cent?", "exp": "Balance = 800(1.05)² = 800 × 1.1025 = $882.00.", "type": "mc", "choices": ["840", "880", "882", "922"], "ans": 2}, {"id": "m231", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The graph of y = (x − 3)² − 4 has a vertex at (h, k). What is h + k?", "exp": "In vertex form a(x − h)² + k, the vertex is (3, -4). h + k = -1.", "type": "mc", "choices": ["0", "-7", "-1", "7"], "ans": 2}, {"id": "m232", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The graph of y = −(x + 2)² + 9 has a vertex at (h, k). What is h + k?", "exp": "In vertex form a(x − h)² + k, the vertex is (-2, 9). h + k = 7.", "type": "mc", "choices": ["7", "-11", "8", "11"], "ans": 0}, {"id": "m233", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The graph of y = 2(x − 1)² − 8 has a vertex at (h, k). What is h + k?", "exp": "In vertex form a(x − h)² + k, the vertex is (1, -8). h + k = -7.", "type": "mc", "choices": ["-7", "9", "-9", "-6"], "ans": 0}, {"id": "m234", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "hard", "stem": "Which expression is equivalent to 3/x + 4/(x + 1), for x ≠ 0, −1?", "exp": "Common denominator x(x + 1): [3(x + 1) + 4x]/(x² + x) = (7x + 3)/(x² + x).", "type": "mc", "choices": ["(7x + 4)/(x² + x)", "7/(2x + 1)", "(7x + 3)/(x² + x)", "12/(x² + x)"], "ans": 2}, {"id": "m235", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "hard", "stem": "Which expression is equivalent to 2/x + 5/(x + 1), for x ≠ 0, −1?", "exp": "Common denominator x(x + 1): [2(x + 1) + 5x]/(x² + x) = (7x + 2)/(x² + x).", "type": "mc", "choices": ["(7x + 5)/(x² + x)", "(7x + 2)/(x² + x)", "7/(2x + 1)", "10/(x² + x)"], "ans": 1}, {"id": "m236", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "hard", "stem": "Which expression is equivalent to 5/x + 6/(x + 1), for x ≠ 0, −1?", "exp": "Common denominator x(x + 1): [5(x + 1) + 6x]/(x² + x) = (11x + 5)/(x² + x).", "type": "mc", "choices": ["11/(2x + 1)", "30/(x² + x)", "(11x + 5)/(x² + x)", "(11x + 6)/(x² + x)"], "ans": 2}, {"id": "m237", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "Which expression is equivalent to x^(2/2)?", "exp": "x^(m/n) = ⁿ√(xᵐ), so x^(2/2) = √(x^2).", "type": "mc", "choices": ["2√x", "(√x)/2", "√(x^2)", "x^2/2"], "ans": 2}, {"id": "m238", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "Which expression is equivalent to x^(3/2)?", "exp": "x^(m/n) = ⁿ√(xᵐ), so x^(3/2) = √(x^3).", "type": "mc", "choices": ["√(x^3)", "x^3/2", "(√x)/3", "3√x"], "ans": 0}, {"id": "m239", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "Which expression is equivalent to x^(5/2)?", "exp": "x^(m/n) = ⁿ√(xᵐ), so x^(5/2) = √(x^5).", "type": "mc", "choices": ["x^5/2", "√(x^5)", "(√x)/5", "5√x"], "ans": 1}, {"id": "m240", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the product of the solutions to x² − 5x + 4 = 0?", "exp": "For x² + bx + c = 0, the product of roots is c = 4. (Roots: 1 and 4.)", "type": "mc", "choices": ["-4", "6", "5", "4"], "ans": 3}, {"id": "m241", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the product of the solutions to x² + 1x − 6 = 0?", "exp": "For x² + bx + c = 0, the product of roots is c = -6. (Roots: -3 and 2.)", "type": "mc", "choices": ["-1", "-6", "-5", "6"], "ans": 1}, {"id": "m242", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the product of the solutions to x² + 3x − 10 = 0?", "exp": "For x² + bx + c = 0, the product of roots is c = -10. (Roots: 2 and -5.)", "type": "mc", "choices": ["-9", "-3", "10", "-10"], "ans": 3}, {"id": "m243", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "How many solutions does the equation x/(x − 3) = 3/(x − 3) have?", "exp": "Multiplying by (x − 3) gives x = 3, but x = 3 makes the denominator zero, so it's excluded. There are no solutions.", "type": "mc", "choices": ["0", "Infinitely many", "2", "1"], "ans": 0}, {"id": "m244", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "f(x) = 3ˣ and g(x) = 3x + 5. For which value of x is f(x) − g(x) first positive among the integers 1, 2, 3, 4?", "exp": "f(1) − g(1) = 3 − 8 < 0; f(2) − g(2) = 9 − 11 < 0; f(3) − g(3) = 27 − 14 > 0. So x = 3. (Exponentials eventually outgrow linear functions.)", "type": "mc", "choices": ["1", "3", "4", "2"], "ans": 1}, {"id": "m245", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Unit conversion", "diff": "medium", "stem": "The density of aluminum is 2.7 grams per cubic centimeter. What is the mass, in grams, of 40 cubic centimeters of aluminum?", "exp": "Mass = density × volume = 2.7 × 40 = 108 g.", "type": "mc", "choices": ["42.7", "1080", "400/27", "108"], "ans": 3}, {"id": "m246", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Unit conversion", "diff": "medium", "stem": "The density of iron is 7.9 grams per cubic centimeter. What is the mass, in grams, of 15 cubic centimeters of iron?", "exp": "Mass = density × volume = 7.9 × 15 = 118.5 g.", "type": "mc", "choices": ["150/79", "22.9", "118.5", "1185"], "ans": 2}, {"id": "m247", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Unit conversion", "diff": "medium", "stem": "The density of ice is 0.92 grams per cubic centimeter. What is the mass, in grams, of 250 cubic centimeters of ice?", "exp": "Mass = density × volume = 0.92 × 250 = 230 g.", "type": "mc", "choices": ["250.92", "2300", "6250/23", "230"], "ans": 3}, {"id": "m248", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Unit conversion", "diff": "hard", "stem": "A rug covers 18 square feet. How many square yards is that? (1 yard = 3 feet)", "exp": "1 square yard = 3 × 3 = 9 square feet. 18 ÷ 9 = 2. Trap: dividing by 3.", "type": "mc", "choices": ["54", "6", "162", "2"], "ans": 3}, {"id": "m249", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Unit conversion", "diff": "hard", "stem": "A rug covers 27 square feet. How many square yards is that? (1 yard = 3 feet)", "exp": "1 square yard = 3 × 3 = 9 square feet. 27 ÷ 9 = 3. Trap: dividing by 3.", "type": "mc", "choices": ["9", "3", "81", "243"], "ans": 1}, {"id": "m250", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Unit conversion", "diff": "hard", "stem": "A rug covers 45 square feet. How many square yards is that? (1 yard = 3 feet)", "exp": "1 square yard = 3 × 3 = 9 square feet. 45 ÷ 9 = 5. Trap: dividing by 3.", "type": "mc", "choices": ["135", "5", "15", "405"], "ans": 1}, {"id": "m251", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "The ratio of boys to girls in a club is 3:5. There are 24 boys. How many students are in the club?", "exp": "Each 'part' = 24/3 = 8. Total parts = 8, so 8 × 8 = 64.", "type": "mc", "choices": ["43", "64", "40", "29"], "ans": 1}, {"id": "m252", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "The ratio of boys to girls in a club is 2:7. There are 18 boys. How many students are in the club?", "exp": "Each 'part' = 18/2 = 9. Total parts = 9, so 9 × 9 = 81.", "type": "mc", "choices": ["65", "25", "63", "81"], "ans": 3}, {"id": "m253", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "The ratio of boys to girls in a club is 4:9. There are 52 boys. How many students are in the club?", "exp": "Each 'part' = 52/4 = 13. Total parts = 13, so 13 × 13 = 169.", "type": "mc", "choices": ["117", "61", "169", "121"], "ans": 2}, {"id": "m254", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "A stock rises 30% one week and falls 20% the next. What is the overall percent change? (Negative means a decrease.)", "exp": "Multiply factors: 1.3 × 0.8 = 1.04. Change = (1.04 − 1) × 100 = 4%.", "type": "mc", "choices": ["10", "50", "-10", "4"], "ans": 3}, {"id": "m255", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "A stock rises 10% one week and falls 10% the next. What is the overall percent change? (Negative means a decrease.)", "exp": "Multiply factors: 1.1 × 0.9 = 0.99. Change = (0.99 − 1) × 100 = -1%.", "type": "mc", "choices": ["0", "1", "-1", "20"], "ans": 2}, {"id": "m256", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "A stock rises 50% one week and falls 40% the next. What is the overall percent change? (Negative means a decrease.)", "exp": "Multiply factors: 1.5 × 0.6 = 0.9. Change = (0.9 − 1) × 100 = -10%.", "type": "mc", "choices": ["-10", "-9", "10", "90"], "ans": 0}, {"id": "m257", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "A frequency table shows the number of siblings for students in a class — 0 siblings: 3 students; 1 siblings: 7 students; 2 siblings: 6 students; 3 siblings: 4 students. What is the median number of siblings?", "exp": "There are 20 students. In order, the median is the average of values 10 and 11: 1.5. Count cumulatively through the table.", "type": "mc", "choices": ["4", "7", "1.55", "1.5"], "ans": 3}, {"id": "m258", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "A frequency table shows the number of siblings for students in a class — 1 siblings: 2 students; 2 siblings: 5 students; 3 siblings: 8 students; 4 siblings: 5 students. What is the median number of siblings?", "exp": "There are 20 students. In order, the median is the average of values 10 and 11: 3. Count cumulatively through the table.", "type": "mc", "choices": ["3", "4", "8", "2.8"], "ans": 0}, {"id": "m259", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "A frequency table shows the number of siblings for students in a class — 0 siblings: 5 students; 1 siblings: 5 students; 2 siblings: 4 students; 5 siblings: 1 students. What is the median number of siblings?", "exp": "There are 15 students. In order, the median is the middle value: 1. Count cumulatively through the table.", "type": "mc", "choices": ["1.2", "1", "5", "4"], "ans": 1}, {"id": "m260", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "Every value in a data set is increased by 7. Which statement is true?", "exp": "Adding a constant shifts every value equally: center measures shift by 7, but the distances between values (spread) stay the same.", "type": "mc", "choices": ["The mean increases by 7 and the standard deviation is unchanged.", "Both the mean and standard deviation increase by 7.", "Neither changes.", "The mean is unchanged and the standard deviation increases by 7."], "ans": 0}, {"id": "m261", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "medium", "stem": "Data set A: 10, 20, 30, 40, 50. Data set B: 28, 29, 30, 31, 32. Which statement is true?", "exp": "Both means are 30. A's values are much farther from 30, so A has the larger spread (standard deviation).", "type": "mc", "choices": ["They have the same mean, but A has a larger standard deviation.", "A has a larger mean.", "They have the same mean, but B has a larger standard deviation.", "They have the same standard deviation."], "ans": 0}, {"id": "m262", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Inference from samples", "diff": "hard", "stem": "A random sample of 500 Texas teens found that 64% use a certain app, with a margin of error of 3%. Which is the most appropriate conclusion?", "exp": "A random sample supports a conclusion about the population it came from, within estimate ± margin.", "type": "mc", "choices": ["Using the app causes teens to be in Texas.", "Exactly 64% of all U.S. teens use the app.", "Between 61% and 67% of all U.S. adults use the app.", "Between 61% and 67% of all Texas teens plausibly use the app."], "ans": 3}, {"id": "m263", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Inference from samples", "diff": "hard", "stem": "A random sample of 1200 Texas teens found that 64% use a certain app, with a margin of error of 2%. Which is the most appropriate conclusion?", "exp": "A random sample supports a conclusion about the population it came from, within estimate ± margin.", "type": "mc", "choices": ["Using the app causes teens to be in Texas.", "Between 62% and 66% of all U.S. adults use the app.", "Exactly 64% of all U.S. teens use the app.", "Between 62% and 66% of all Texas teens plausibly use the app."], "ans": 3}, {"id": "m264", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Inference from samples", "diff": "hard", "stem": "Researchers randomly assigned 200 volunteers to drink either green tea or water daily. The tea group had lower average blood pressure after 3 months. Which conclusion is best supported?", "exp": "Random assignment supports a cause-and-effect conclusion, but because volunteers weren't a random sample of everyone, generalize only to similar people.", "type": "mc", "choices": ["Green tea lowers blood pressure for all people.", "Green tea likely caused lower blood pressure among people like these volunteers.", "Water raises blood pressure.", "There is no relationship."], "ans": 1}, {"id": "m265", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Two-variable data", "diff": "medium", "stem": "The points (1, 3), (2, 5), (3, 7), (4, 9) lie on a line. If the pattern continues, what is y when x = 10?", "exp": "Slope = 2 per unit of x; y-intercept = 1. y = 2(10) + 1 = 21.", "type": "mc", "choices": ["21", "19", "23", "20"], "ans": 0}, {"id": "m266", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Two-variable data", "diff": "medium", "stem": "The points (0, 100), (5, 90), (10, 80), (15, 70) lie on a line. If the pattern continues, what is y when x = 25?", "exp": "Slope = -2 per unit of x; y-intercept = 100. y = -2(25) + 100 = 50.", "type": "mc", "choices": ["52", "48", "-50", "50"], "ans": 3}, {"id": "m267", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Two-variable data", "diff": "medium", "stem": "The points (2, 1), (4, 4), (6, 7), (8, 10) lie on a line. If the pattern continues, what is y when x = 12?", "exp": "Slope = 1.5 per unit of x; y-intercept = -2. y = 1.5(12) − 2 = 16.", "type": "mc", "choices": ["14.5", "16", "18", "17.5"], "ans": 1}, {"id": "m268", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "medium", "stem": "A spinner has 10 equal sections: 3 red, 5 blue, and 2 green. What is the probability of NOT landing on blue?", "exp": "Not blue = 3 + 2 = 5 sections. P = 5/10 = 0.5.", "type": "mc", "choices": ["0.3", "0.2", "1.5", "0.5"], "ans": 3}, {"id": "m269", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "medium", "stem": "A spinner has 20 equal sections: 6 red, 4 blue, and 10 green. What is the probability of NOT landing on blue?", "exp": "Not blue = 6 + 10 = 16 sections. P = 16/20 = 0.8.", "type": "mc", "choices": ["0.2", "0.3", "0.5", "0.8"], "ans": 3}, {"id": "m270", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "What is the sum of the interior angles of a polygon with 5 sides, in degrees?", "exp": "Sum = (n − 2) × 180 = (5 − 2) × 180 = 540.", "type": "mc", "choices": ["540", "900", "360", "720"], "ans": 0}, {"id": "m271", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "What is the sum of the interior angles of a polygon with 6 sides, in degrees?", "exp": "Sum = (n − 2) × 180 = (6 − 2) × 180 = 720.", "type": "mc", "choices": ["900", "360", "1080", "720"], "ans": 3}, {"id": "m272", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "What is the sum of the interior angles of a polygon with 8 sides, in degrees?", "exp": "Sum = (n − 2) × 180 = (8 − 2) × 180 = 1080.", "type": "mc", "choices": ["1080", "360", "1440", "1260"], "ans": 0}, {"id": "m273", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "What is the sum of the interior angles of a polygon with 10 sides, in degrees?", "exp": "Sum = (n − 2) × 180 = (10 − 2) × 180 = 1440.", "type": "mc", "choices": ["1620", "1800", "1440", "360"], "ans": 2}, {"id": "m274", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "hard", "stem": "Two sides of a triangle have lengths 5 and 9. Which could be the length of the third side?", "exp": "Triangle inequality: the third side must be between 4 and 14 (exclusive).", "type": "mc", "choices": ["4", "16", "5", "14"], "ans": 2}, {"id": "m275", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "hard", "stem": "Two sides of a triangle have lengths 3 and 10. Which could be the length of the third side?", "exp": "Triangle inequality: the third side must be between 7 and 13 (exclusive).", "type": "mc", "choices": ["7", "13", "15", "8"], "ans": 3}, {"id": "m276", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "hard", "stem": "Two sides of a triangle have lengths 7 and 7. Which could be the length of the third side?", "exp": "Triangle inequality: the third side must be between 0 and 14 (exclusive).", "type": "mc", "choices": ["14", "19", "1", "16"], "ans": 2}, {"id": "m277", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "medium", "stem": "A cone has radius 3 and height 4. Its volume is kπ. What is k?", "exp": "V = (1/3)πr²h = (1/3)π(9)(4) = 12π.", "type": "mc", "choices": ["4", "36", "24", "12"], "ans": 3}, {"id": "m278", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "medium", "stem": "A cone has radius 6 and height 5. Its volume is kπ. What is k?", "exp": "V = (1/3)πr²h = (1/3)π(36)(5) = 60π.", "type": "mc", "choices": ["60", "10", "180", "70"], "ans": 0}, {"id": "m279", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "medium", "stem": "A cone has radius 2 and height 9. Its volume is kπ. What is k?", "exp": "V = (1/3)πr²h = (1/3)π(4)(9) = 12π.", "type": "mc", "choices": ["36", "13", "12", "6"], "ans": 2}, {"id": "m280", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "A circle has circumference 10π. What is its area, in terms of π?", "exp": "C = 2πr → r = 5. Area = πr² = 25π.", "type": "mc", "choices": ["35", "25", "10", "100"], "ans": 1}, {"id": "m281", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "A circle has circumference 18π. What is its area, in terms of π?", "exp": "C = 2πr → r = 9. Area = πr² = 81π.", "type": "mc", "choices": ["81", "91", "324", "18"], "ans": 0}, {"id": "m282", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "A circle has circumference 24π. What is its area, in terms of π?", "exp": "C = 2πr → r = 12. Area = πr² = 144π.", "type": "mc", "choices": ["576", "154", "24", "144"], "ans": 3}, {"id": "m283", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An angle measures 30°. What is its measure in radians, as a multiple of π?", "exp": "Multiply by π/180: 30/180 = 1/6, so 1/6π radians.", "type": "mc", "choices": ["1/3", "1/6", "1/12", "6"], "ans": 1}, {"id": "m284", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An angle measures 45°. What is its measure in radians, as a multiple of π?", "exp": "Multiply by π/180: 45/180 = 0.25, so 0.25π radians.", "type": "mc", "choices": ["0.125", "0.25", "0.5", "4"], "ans": 1}, {"id": "m285", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An angle measures 135°. What is its measure in radians, as a multiple of π?", "exp": "Multiply by π/180: 135/180 = 0.75, so 0.75π radians.", "type": "mc", "choices": ["0.75", "4/3", "1.5", "0.375"], "ans": 0}, {"id": "m286", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An angle measures 210°. What is its measure in radians, as a multiple of π?", "exp": "Multiply by π/180: 210/180 = 7/6, so 7/6π radians.", "type": "mc", "choices": ["7/6", "7/12", "7/3", "6/7"], "ans": 0}, {"id": "m287", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "hard", "stem": "What is the distance between (1, 2) and (7, 10)?", "exp": "√[(7 − 1)² + (10 − 2)²] = √(36 + 64) = √100 = 10. It's a hidden right triangle.", "type": "mc", "choices": ["12", "14", "10", "100"], "ans": 2}, {"id": "m288", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "hard", "stem": "What is the distance between (-3, 4) and (5, -2)?", "exp": "√[(5 + 3)² + (-2 − 4)²] = √(64 + 36) = √100 = 10. It's a hidden right triangle.", "type": "mc", "choices": ["10", "12", "14", "100"], "ans": 0}, {"id": "m289", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "hard", "stem": "What is the distance between (0, 0) and (9, 12)?", "exp": "√[(9 − 0)² + (12 − 0)²] = √(81 + 144) = √225 = 15. It's a hidden right triangle.", "type": "mc", "choices": ["15", "21", "225", "17"], "ans": 0}, {"id": "m290", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "A 6-foot pole casts a 4-foot shadow. At the same time, a tree casts a 10-foot shadow. How tall is the tree, in feet?", "exp": "Similar triangles: 6/4 = t/10, so t = 6×10/4 = 15.", "type": "mc", "choices": ["12", "2.5", "15", "20/3"], "ans": 2}, {"id": "m291", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "A 5-foot pole casts a 3-foot shadow. At the same time, a tree casts a 12-foot shadow. How tall is the tree, in feet?", "exp": "Similar triangles: 5/3 = t/12, so t = 5×12/3 = 20.", "type": "mc", "choices": ["14", "20", "4", "7.2"], "ans": 1}, {"id": "m292", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "A 8-foot pole casts a 5-foot shadow. At the same time, a tree casts a 15-foot shadow. How tall is the tree, in feet?", "exp": "Similar triangles: 8/5 = t/15, so t = 8×15/5 = 24.", "type": "mc", "choices": ["24", "9.375", "3", "18"], "ans": 0}, {"id": "m293", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In right triangle ABC with right angle C, angle A = 25°. Which is equal to sin A?", "exp": "The acute angles are complementary (A + B = 90°), and sin A = cos(90° − A) = cos 65°.", "type": "mc", "choices": ["sin 65°", "tan 65°", "cos 25°", "cos 65°"], "ans": 3}, {"id": "m294", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In right triangle ABC with right angle C, angle A = 58°. Which is equal to sin A?", "exp": "The acute angles are complementary (A + B = 90°), and sin A = cos(90° − A) = cos 32°.", "type": "mc", "choices": ["tan 32°", "cos 58°", "sin 32°", "cos 32°"], "ans": 3}, {"id": "m295", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In right triangle ABC with right angle C, angle A = 71°. Which is equal to sin A?", "exp": "The acute angles are complementary (A + B = 90°), and sin A = cos(90° − A) = cos 19°.", "type": "mc", "choices": ["sin 19°", "tan 19°", "cos 19°", "cos 71°"], "ans": 2}, {"id": "r1", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "medium", "type": "mc", "passage": "Ecologist Mariana Ruiz studied prairie restorations in central Texas. She found that plots seeded with a diverse mix of 30 native species recovered from drought faster than plots seeded with just 5 species, even when the 5-species plots started with denser plant cover.", "stem": "Which choice best states the main idea of the text?", "choices": ["Dense plant cover is the most important factor in drought recovery.", "Ruiz's research suggests that species diversity helps restored prairies recover from drought.", "Texas prairies cannot recover from drought without human help.", "Five-species plots are cheaper to plant than thirty-species plots."], "ans": 1, "exp": "The text contrasts diverse plots with low-diversity plots and says diverse ones recovered faster even though the others had denser cover. So the point is diversity aids recovery. A contradicts the text; C and D aren't discussed."}, {"id": "r2", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "hard", "type": "mc", "passage": "Many readers assume the narrator of Kofi Mensah's novel is unreliable because he forgets names and dates. But Mensah gives the narrator a precise memory for conversations, which other characters later confirm. The forgetfulness, critics argue, signals grief rather than dishonesty.", "stem": "Which choice best states the main idea of the text?", "choices": ["The narrator's memory problems make his account untrustworthy.", "Critics argue the narrator's lapses reflect grief, and his account is otherwise confirmed as accurate.", "Mensah intended the narrator to be dishonest about conversations.", "Other characters in the novel are less reliable than the narrator."], "ans": 1, "exp": "The text sets up a common assumption (unreliable) and then rebuts it with evidence (confirmed conversations) and an alternate reading (grief). B captures both. A is the view being rejected."}, {"id": "r3", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "easy", "type": "mc", "passage": "The town of Prosper, Texas, grew from about 2,000 residents in 2000 to more than 30,000 by the early 2020s. To keep up, the school district opened several new campuses within a single decade.", "stem": "According to the text, why did the school district open new campuses?", "choices": ["To replace older campuses that had closed", "To respond to rapid population growth", "To reduce class sizes in high school only", "To attract residents from other towns"], "ans": 1, "exp": "The text links the new campuses directly to growth ('To keep up'). No other reason is stated."}, {"id": "r4", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "A student claims that octopuses can recognize individual humans. The student cites a study in which researchers wore identical uniforms.", "stem": "Which finding from the study, if true, would most directly support the student's claim?", "choices": ["Octopuses squirted water at one researcher who had previously poked them, but not at another who had fed them, even when both wore identical uniforms.", "Octopuses ate more food when the lab lights were dim.", "Octopuses changed color when a new tank was introduced.", "Researchers wearing uniforms found octopuses easier to handle."], "ans": 0, "exp": "To show recognition of individuals, octopuses must react differently to different people who look alike. Choice A shows exactly that. The others don't involve distinguishing humans."}, {"id": "r5", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "medium", "type": "mc", "passage": "Some historians argue that the spread of affordable bicycles in the 1890s expanded independence for women in the United States.", "stem": "Which quotation from a historical source would best support the historians' argument?", "choices": ["\"The price of a bicycle fell by more than half between 1893 and 1897.\"", "\"Bicycle factories employed thousands of workers in Ohio.\"", "\"With her wheel, a woman may now travel to town alone, without waiting on father or husband to hitch the carriage.\"", "\"Many roads were too rough for comfortable cycling.\""], "ans": 2, "exp": "The claim is about women's independence. Only C connects bicycles to women traveling on their own. A addresses affordability but not independence."}, {"id": "r6", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "A researcher recorded average daily screen time for students in grades 9–12: 9th grade, 5.1 hours; 10th, 5.6; 11th, 6.4; 12th, 6.2. The researcher claims screen time generally rises across high school but does not rise every single year.", "stem": "Which choice uses data from the text to support the researcher's claim?", "choices": ["Ninth graders averaged 5.1 hours, the lowest of any grade.", "Screen time rose from 5.1 to 6.4 hours from 9th to 11th grade, then dipped slightly to 6.2 in 12th grade.", "Twelfth graders averaged 6.2 hours.", "Tenth graders averaged 0.5 hours more than ninth graders."], "ans": 1, "exp": "The claim has two parts: an overall rise and at least one non-rise. B shows the rise (5.1→6.4) and the dip (6.4→6.2). The others show only one part."}, {"id": "r7", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "medium", "type": "mc", "passage": "In a survey of a school's clubs, Robotics had 42 members in 2023 and 63 in 2024; Debate had 50 members in 2023 and 55 in 2024.", "stem": "Based on the data, which statement is accurate?", "choices": ["Debate grew by a larger percentage than Robotics.", "Robotics grew by 50%, while Debate grew by 10%.", "Both clubs grew by the same number of members.", "Debate had more members than Robotics in 2024."], "ans": 1, "exp": "Robotics: (63-42)/42 = 21/42 = 50%. Debate: 5/50 = 10%. B is correct; D is false (55 < 63)."}, {"id": "r8", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Bees from hives near cities often show more varied pollen in their stomachs than bees from hives near large single-crop farms. Urban gardens contain many plant species that bloom at different times, while a single-crop farm may bloom for only a few weeks each year. Therefore, ______", "stem": "Which choice most logically completes the text?", "choices": ["urban bees likely have access to food sources across more of the year than bees near single-crop farms.", "single-crop farms do not need bees for pollination.", "urban bees produce less honey than rural bees.", "bees prefer cities to farms."], "ans": 0, "exp": "Varied species blooming at different times → food over a longer period. A follows. B, C, and D go beyond what the text supports."}, {"id": "r9", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "medium", "type": "mc", "passage": "When the library extended its weekend hours, attendance on Saturdays rose sharply, but Sunday attendance barely changed. Most of the new Saturday visitors were students with weekday jobs. This suggests that ______", "stem": "Which choice most logically completes the text?", "choices": ["students prefer reading on Sundays.", "the extended hours mainly helped people whose weekday schedules were busy.", "the library should close on Sundays.", "weekday attendance decreased."], "ans": 1, "exp": "New visitors were students who work weekdays, so the extra hours served people with busy weekday schedules. The other choices aren't supported."}, {"id": "r10", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Archaeologists found grinding stones with traces of wild grain at a site dated to 23,000 years ago, more than 10,000 years before the earliest known farming in the region. Because the grain was wild, the finding does not show farming; however, it does suggest that ______", "stem": "Which choice most logically completes the text?", "choices": ["people in the region were processing grains long before they began cultivating them.", "farming began 23,000 years ago.", "grinding stones were invented after farming.", "wild grains were not edible."], "ans": 0, "exp": "The text rules out farming but shows grain processing well before farming. A is the precise inference; B contradicts the text."}, {"id": "r11", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "medium", "type": "mc", "passage": "In her poem, Ana Castillo describes a grandmother's kitchen through smells—cumin, burnt tortillas, wet wool coats drying by the stove—rather than through what the kitchen looks like.", "stem": "Based on the text, what is a notable feature of the poem?", "choices": ["It focuses on the kitchen's appearance.", "It relies on scent to depict a setting.", "It is written from the grandmother's point of view.", "It criticizes the grandmother's cooking."], "ans": 1, "exp": "The text says the poet uses smells 'rather than' looks. That's B."}, {"id": "r12", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "A literary critic argues that in the novel The River Hour, the character Lena values loyalty over personal ambition.", "stem": "Which quotation from the novel would best support the critic's claim?", "choices": ["\"Lena had always dreamed of seeing Paris.\"", "\"When the scholarship meant leaving her brother alone with the farm, Lena tore up the letter without opening it.\"", "\"Lena studied late into the night, determined to be first in her class.\"", "\"The farm was quiet in the winter months.\""], "ans": 1, "exp": "Loyalty over ambition requires giving up an opportunity for someone. B shows her rejecting a scholarship to stay with her brother. C shows ambition only."}, {"id": "r13", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "medium", "type": "mc", "passage": "A city planted trees along one avenue but not along a parallel avenue with similar traffic. Two summers later, sidewalk temperatures on the tree-lined avenue averaged 7°F lower. Shops on both avenues reported similar sales.", "stem": "Which conclusion is best supported by the text?", "choices": ["The trees caused shop sales to increase.", "The trees were associated with cooler sidewalks but not with a difference in sales.", "Traffic was lighter on the tree-lined avenue.", "Hot sidewalks reduce sales."], "ans": 1, "exp": "Temperatures differed but sales did not. B states both facts without overreaching. C contradicts 'similar traffic.'"}, {"id": "r14", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "A table shows rainfall (in inches) in a Texas county: April 2.1, May 4.8, June 3.9, July 1.2. A student claims May was the wettest month and that rainfall in July was less than half of June's.", "stem": "Do the data support both parts of the student's claim?", "choices": ["Yes: May (4.8) is the highest, and July's 1.2 is less than half of June's 3.9 (1.95).", "No: April was the wettest month.", "No: July's rainfall is more than half of June's.", "Yes, but only because June was the second wettest month."], "ans": 0, "exp": "4.8 is the max. Half of 3.9 is 1.95, and 1.2 < 1.95. Both parts hold. D gives the wrong reason."}, {"id": "r15", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "hard", "type": "mc", "passage": "Engineers once believed that taller wind turbines would always generate more power. Newer studies show that when turbines are grouped closely, taller ones can create large wakes of slow air that reduce output from turbines behind them. Spacing, not just height, matters.", "stem": "Which choice best describes the main point of the text?", "choices": ["Wind turbines should be as tall as possible.", "Turbine performance depends on how turbines are arranged as well as their height.", "Wind farms are no longer efficient.", "Short turbines produce no wakes."], "ans": 1, "exp": "The text corrects an older belief and ends with 'Spacing, not just height, matters.' B restates it."}, {"id": "r16", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "The coach's feedback was always ______: she named exactly which step of the play went wrong and how to fix it.", "stem": "Which choice completes the text with the most logical and precise word?", "choices": ["vague", "specific", "harsh", "delayed"], "ans": 1, "exp": "The colon introduces a description of feedback that names exact steps—that's 'specific.' 'Vague' is the opposite."}, {"id": "r17", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Although the senator's speech was praised for its eloquence, critics noted that it was largely ______, offering stirring language but few concrete proposals.", "stem": "Which choice completes the text with the most logical and precise word?", "choices": ["substantive", "rhetorical", "technical", "concise"], "ans": 1, "exp": "'Stirring language but few concrete proposals' describes speech that is rhetorical (style over substance). 'Substantive' means the opposite."}, {"id": "r18", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The new evidence did not overturn the theory, but it did ______ it, requiring scientists to add an exception for very cold environments.", "stem": "Which choice completes the text with the most logical and precise word?", "choices": ["confirm", "qualify", "abandon", "celebrate"], "ans": 1, "exp": "To 'qualify' a claim is to limit it with an exception—exactly what the text describes. 'Abandon' is too strong; 'confirm' ignores the exception."}, {"id": "r19", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "In the passage, the author describes the city's response to the flood as \"measured\": officials took time to gather information before announcing evacuation zones.", "stem": "As used in the text, what does \"measured\" most nearly mean?", "choices": ["calculated in units", "careful and deliberate", "slow and lazy", "unfair"], "ans": 1, "exp": "The explanation after the colon (taking time to gather information) shows 'measured' means careful and deliberate."}, {"id": "r20", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Mendoza's early paintings were ______; she reworked the same canvases for months, and only a handful left her studio during her first decade as an artist.", "stem": "Which choice completes the text with the most logical and precise word?", "choices": ["prolific", "scarce", "colorful", "famous"], "ans": 1, "exp": "Few paintings left her studio, so they were scarce. 'Prolific' (producing a lot) is the opposite."}, {"id": "r21", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "Sea otters are often called a keystone species. When otters disappear from a kelp forest, sea urchins multiply and devour the kelp. When otters return, urchin numbers fall and the kelp regrows.", "stem": "Which choice best describes the function of the second and third sentences?", "choices": ["They contradict the claim in the first sentence.", "They provide an example that illustrates the claim in the first sentence.", "They introduce a new species unrelated to the first sentence.", "They summarize a debate among scientists."], "ans": 1, "exp": "The first sentence makes a claim (keystone species); the next two show the effect of otters on the ecosystem, illustrating it."}, {"id": "r22", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "For decades, historians described the Silk Road as a single route. Recent research on caravan records reveals instead a shifting web of local paths that traders combined depending on season and politics. This view better explains why some goods appear in distant markets at unexpected times.", "stem": "Which choice best describes the overall structure of the text?", "choices": ["It presents a traditional view, introduces a revised view, and gives a reason the revision is persuasive.", "It describes a route and then lists the goods traded along it.", "It argues that caravan records are unreliable.", "It compares two historians' personal lives."], "ans": 0, "exp": "Old view (single route) → new view (web) → why it's better (explains timing). A matches all three moves."}, {"id": "r23", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "The following text is from a short story. Marcus checked the clock again. Seven minutes. He straightened the papers on his desk for the third time, then stood, then sat again.", "stem": "What is the main purpose of the text?", "choices": ["To describe Marcus's office in detail", "To convey Marcus's nervous anticipation", "To explain why Marcus is late", "To show that Marcus is disorganized"], "ans": 1, "exp": "Repeated clock-checking and restless actions show nervous waiting. Straightening papers shows anxiety, not disorganization."}, {"id": "r24", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "Some economists argue that a four-day workweek lowers productivity. Yet trials in several countries found that output stayed the same or rose while burnout fell. Critics respond that these trials were mostly in office jobs, where results may not transfer to manufacturing.", "stem": "What is the function of the final sentence in the text?", "choices": ["It presents a limitation that critics see in the trial evidence.", "It restates the economists' original argument.", "It provides additional support for the trials.", "It concludes that the four-day week is harmful."], "ans": 0, "exp": "The last sentence notes a scope limitation (office jobs only) raised by critics. It doesn't repeat the first claim or declare harm."}, {"id": "r25", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: Researcher A argues that students learn best from rereading notes, since familiarity with the material builds confidence. Text 2: Researcher B found that students who quizzed themselves remembered 40% more a week later than those who reread, even though rereaders felt more confident.", "stem": "Based on the texts, how would Researcher B most likely respond to Researcher A?", "choices": ["By agreeing that confidence is the best measure of learning", "By pointing out that feeling confident does not necessarily mean remembering more", "By arguing that rereading and quizzing are equally effective", "By claiming students should not take notes"], "ans": 1, "exp": "B's data shows rereaders felt more confident yet remembered less. So B would say confidence ≠ learning."}, {"id": "r26", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: Many urban planners favor building more highway lanes to reduce traffic. Text 2: Studies of 'induced demand' show that new lanes often fill with additional drivers within a few years, returning congestion to earlier levels.", "stem": "How would the author of Text 2 most likely respond to the planners in Text 1?", "choices": ["Highway lanes reduce traffic permanently.", "Adding lanes may provide only temporary relief because more people start driving.", "Cities should build more highways immediately.", "Traffic is not a real problem."], "ans": 1, "exp": "Induced demand means added capacity draws new drivers, so relief is temporary. B summarizes that."}, {"id": "r27", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "The documentary's tone was ______; it presented both supporters and critics of the dam without signaling which side the filmmakers favored.", "stem": "Which choice completes the text with the most logical and precise word?", "choices": ["partisan", "evenhanded", "sarcastic", "mournful"], "ans": 1, "exp": "Presenting both sides without favoring one is evenhanded. 'Partisan' is the opposite."}, {"id": "r28", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "easy", "type": "mc", "passage": "Hummingbirds can hover in place by moving their wings in a figure-eight pattern. This motion produces lift on both the forward and backward strokes, unlike most birds, which produce lift mainly on the downstroke.", "stem": "What is the main purpose of the text?", "choices": ["To explain how hummingbirds are able to hover", "To argue that hummingbirds are the fastest birds", "To describe hummingbird diets", "To compare hummingbirds to insects"], "ans": 0, "exp": "The text explains the mechanism (figure-eight, lift on both strokes) behind hovering."}, {"id": "r29", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "medium", "type": "mc", "passage": "Text 1: A critic praises a new museum for its bold glass design. Text 2: An engineer notes the same glass walls let in so much heat that the museum's cooling costs are triple the original estimate.", "stem": "Which choice best describes how the two texts relate?", "choices": ["Text 2 raises a practical concern about a feature that Text 1 praises.", "Text 2 agrees that the design is bold and adds more praise.", "Both texts focus on the museum's art collection.", "Text 1 criticizes the museum's cooling costs."], "ans": 0, "exp": "Text 1 praises the glass; Text 2 points out a cost problem with that same glass."}, {"id": "r30", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Rather than ______ the board's decision, the student council chose to work within it, proposing small changes that could be approved quickly.", "stem": "Which choice completes the text with the most logical and precise word?", "choices": ["endorse", "contest", "ignore", "celebrate"], "ans": 1, "exp": "'Rather than' signals contrast with 'work within it.' The contrasting action is to contest (challenge) the decision."}, {"id": "r31", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "easy", "type": "mc", "passage": "Volunteers removed 2 tons of trash from the creek in one weekend. ______, water testing the following month showed improved oxygen levels.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["However", "Afterward", "For example", "In contrast"], "ans": 1, "exp": "The second event follows the first in time and isn't a contrast or example. 'Afterward' fits."}, {"id": "r32", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Early cell phones weighed more than 2 pounds. ______, today's smartphones typically weigh less than half a pound.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Similarly", "By contrast", "Therefore", "For instance"], "ans": 1, "exp": "The sentences contrast heavy early phones with light modern ones."}, {"id": "r33", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The team's first prototype failed every durability test. ______, the engineers learned which joints were weakest, information that shaped the successful second design.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Nevertheless", "Consequently", "Likewise", "In other words"], "ans": 0, "exp": "Despite failure, something useful came from it—a concession/contrast. 'Nevertheless' fits. 'Consequently' misses the contrast between failing and still gaining something valuable."}, {"id": "r34", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Most deserts receive less than 10 inches of rain per year. Antarctica, ______, qualifies as a desert despite being covered in ice.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["therefore", "for this reason", "surprisingly", "similarly"], "ans": 2, "exp": "Antarctica being a desert while covered in ice is unexpected, so 'surprisingly' fits. 'Therefore' doesn't follow from the first sentence alone."}, {"id": "r35", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "The museum offered free admission on Tuesdays. ______, it partnered with local schools to provide free bus trips.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["In addition", "Instead", "Nonetheless", "As a result"], "ans": 0, "exp": "The second sentence adds another similar effort. 'In addition' fits."}, {"id": "r36", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Critics expected the low-budget film to vanish quickly. ______, it played in theaters for six months and earned twenty times its cost.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Predictably", "Instead", "Similarly", "Specifically"], "ans": 1, "exp": "Reality was the opposite of expectations. 'Instead' signals that replacement."}, {"id": "r37", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Solar panels produce the most electricity at midday. Household demand, ______, often peaks in the early evening.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["however", "for example", "thus", "likewise"], "ans": 0, "exp": "Midday production contrasts with evening demand: 'however.'"}, {"id": "r38", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "While researching a topic, a student took these notes: • The Texas horned lizard is the state reptile. • Its population has declined in much of Texas. • A major cause is the loss of harvester ants, its main food. • Pesticides and invasive fire ants reduce harvester ant numbers.", "stem": "The student wants to explain a cause of the lizard's decline. Which choice most effectively uses relevant information to accomplish this goal?", "choices": ["The Texas horned lizard is the state reptile of Texas.", "The Texas horned lizard has declined partly because pesticides and invasive fire ants have reduced harvester ants, its main food.", "Harvester ants live in Texas.", "Fire ants are invasive in Texas."], "ans": 1, "exp": "The goal is a cause of decline. B links the decline to the food loss and its causes. A, C, D don't state a cause of decline."}, {"id": "r39", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Mae Jemison was the first African American woman in space (1992). • She trained as a physician. • She served in the Peace Corps in Sierra Leone and Liberia. • She later founded a company focused on technology in daily life.", "stem": "The student wants to emphasize the variety of Jemison's careers. Which choice most effectively accomplishes this goal?", "choices": ["Mae Jemison went to space in 1992.", "Mae Jemison, a physician and Peace Corps volunteer, became an astronaut and later founded a technology company.", "Mae Jemison served in Sierra Leone and Liberia.", "Mae Jemison was the first African American woman in space."], "ans": 1, "exp": "'Variety of careers' needs multiple roles. B lists four. The others mention one."}, {"id": "r40", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • The Great Barrier Reef is about 1,400 miles long. • It is visible from space. • It is made of nearly 3,000 individual reefs.", "stem": "The student wants to emphasize the reef's size. Which choice most effectively accomplishes this goal?", "choices": ["The Great Barrier Reef is located off Australia.", "Stretching about 1,400 miles, the Great Barrier Reef is so large it can be seen from space.", "The reef has many fish.", "Coral reefs are threatened by warming water."], "ans": 1, "exp": "B uses the length and visibility from space to emphasize size."}, {"id": "r41", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Study 1: students who slept 8+ hours scored 12% higher on memory tests. • Study 2: teens' natural sleep cycles shift later during adolescence. • Some districts moved high school start times later. • Those districts reported better attendance.", "stem": "The student wants to present a reason districts might start school later, supported by evidence. Which choice most effectively accomplishes this goal?", "choices": ["Some districts have changed their start times.", "Because teens' sleep cycles shift later and more sleep is linked to better memory, some districts have moved start times later—and they report better attendance.", "Study 1 measured memory.", "Teens like to sleep late."], "ans": 1, "exp": "B gives a reason (biology + sleep benefits) and evidence (attendance). The others lack reasoning or evidence."}, {"id": "r42", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • Bluebonnets are the state flower of Texas. • They bloom in March and April. • Their seeds have a hard coat and can stay dormant for years.", "stem": "The student wants to tell readers when to see bluebonnets in bloom. Which choice most effectively accomplishes this goal?", "choices": ["Bluebonnet seeds can stay dormant for years.", "Bluebonnets are Texas's state flower.", "To see bluebonnets in bloom, visit Texas in March or April.", "Bluebonnets have hard seed coats."], "ans": 2, "exp": "Only C answers 'when' using the bloom months."}, {"id": "r43", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Two programming languages: Python and C. • Python is often easier for beginners to read. • C programs often run faster. • Both are widely used.", "stem": "The student wants to contrast the two languages. Which choice most effectively accomplishes this goal?", "choices": ["Python and C are both widely used.", "Python is easy to read.", "While Python is often easier for beginners to read, C programs often run faster.", "C is a programming language."], "ans": 2, "exp": "Contrast requires a difference between the two; C uses 'While' to contrast readability and speed."}, {"id": "r44", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The study found that students who took handwritten notes remembered more concepts. ______, they wrote fewer total words than students who typed.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Interestingly", "Therefore", "For instance", "In summary"], "ans": 0, "exp": "Writing fewer words yet remembering more is an unexpected detail; 'Interestingly' fits. 'Therefore' implies a cause that isn't stated."}, {"id": "r45", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • The Alamo is in San Antonio. • The 1836 battle lasted 13 days. • Today it is a museum visited by about 1.6 million people per year.", "stem": "The student wants to highlight the Alamo's present-day popularity. Which choice most effectively accomplishes this goal?", "choices": ["The Alamo's battle lasted 13 days.", "The Alamo is located in San Antonio.", "Today, about 1.6 million people a year visit the Alamo, now a museum.", "The battle happened in 1836."], "ans": 2, "exp": "Present-day popularity = visitor numbers today."}, {"id": "r46", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "The robotics team spent months on its design ______ the robot won first place at the regional competition.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["design, the", "design; the", "design the", "design, and, the"], "ans": 1, "exp": "Two independent clauses need a semicolon (or comma + conjunction). A is a comma splice; C is a run-on; D has a misplaced comma."}, {"id": "r47", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "Three cities hosted the tournament ______ Austin, Texas; Denver, Colorado; and Portland, Oregon.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["tournament,", "tournament:", "tournament;", "tournament"], "ans": 1, "exp": "A colon introduces a list after a complete clause. The list items contain commas, so they're separated by semicolons."}, {"id": "r48", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The scientist ______ discovered the comet had been searching that region of sky for a decade.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["who,", "who", "—who", "who;"], "ans": 1, "exp": "'Who discovered the comet' is an essential (restrictive) clause, so no punctuation is used."}, {"id": "r49", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "Maya Angelou's memoir, I Know Why the Caged Bird Sings ______ was published in 1969.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["Sings,", "Sings", "Sings;", "Sings:"], "ans": 0, "exp": "The title is a nonessential appositive set off by commas; the opening comma needs a matching closing comma."}, {"id": "r50", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The volcano had been dormant for centuries ______ geologists were surprised when it began releasing gas in 2021.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["centuries, therefore,", "centuries; therefore,", "centuries therefore", "centuries, therefore"], "ans": 1, "exp": "'Therefore' is a conjunctive adverb joining two independent clauses: use a semicolon before and a comma after."}, {"id": "r51", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "Unlike most spiders ______ jumping spiders have excellent vision and hunt by sight.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["spiders,", "spiders;", "spiders:", "spiders."], "ans": 0, "exp": "An introductory phrase is followed by a comma before the main clause."}, {"id": "r52", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The coach gave the team one piece of advice before the final ______ trust your training.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["game,", "game:", "game", "game, and"], "ans": 1, "exp": "A colon after an independent clause can introduce an explanation or the 'piece of advice' itself."}, {"id": "r53", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "The collection of rare coins ______ displayed in a locked case at the front of the museum.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["are", "is", "were", "have been"], "ans": 1, "exp": "The subject is 'collection' (singular), not 'coins.' Use 'is.'"}, {"id": "r54", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Neither the players nor the coach ______ the new schedule.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["like", "likes", "are liking", "have liked"], "ans": 1, "exp": "With 'neither...nor,' the verb agrees with the nearer subject, 'coach' (singular): 'likes.'"}, {"id": "r55", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Each of the orchestra's sections must tune ______ instruments before the concert.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["their", "its", "it's", "they're"], "ans": 1, "exp": "'Each' is singular, so the possessive pronoun is 'its.' 'It's' means 'it is.'"}, {"id": "r56", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "By the time the rescue team arrived, the hikers ______ for nearly two days.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["wait", "have waited", "had been waiting", "will wait"], "ans": 2, "exp": "An action ongoing before another past event uses past perfect progressive: 'had been waiting.'"}, {"id": "r57", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Walking along the beach at sunset, ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["the waves seemed calmer to Priya.", "Priya noticed the waves were calmer.", "the calm waves were noticed by Priya.", "calmness filled the waves."], "ans": 1, "exp": "The opening modifier describes who is walking, so the subject right after the comma must be Priya. Otherwise it's a dangling modifier."}, {"id": "r58", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "The two ______ projects were displayed side by side at the science fair.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["student's", "students'", "students", "students's"], "ans": 1, "exp": "Plural possessive of 'students' is 'students'.'"}, {"id": "r59", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "The list of items that hikers must carry into the canyon ______ water, a map, and a first-aid kit.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["include", "includes", "are including", "have included"], "ans": 1, "exp": "The subject is 'list' (singular); 'of items that hikers must carry into the canyon' is a modifier in between. Singular verb: 'includes.'"}, {"id": "r60", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "Last summer, Diego ______ a coding camp and built his first app.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["attends", "attended", "will attend", "has attended"], "ans": 1, "exp": "'Last summer' and the past-tense 'built' require simple past: 'attended.'"}, {"id": "r61", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "The judges praised the essay for its originality, its clear organization, and ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["how persuasive it was.", "its persuasive evidence.", "it persuaded them.", "being persuasive."], "ans": 1, "exp": "Parallel structure: 'its originality, its clear organization, and its persuasive evidence.'"}, {"id": "r62", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "medium", "type": "mc", "passage": "Marine biologist Keiko Arai tagged 40 sea turtles and found that most returned to feed in the same seagrass beds year after year, even after storms damaged those beds. Arai suggests that turtles rely on long-term memory of feeding sites more than on current food availability.", "stem": "Which choice best states the main idea of the text?", "choices": ["Storms permanently destroy seagrass beds.", "Sea turtles may return to familiar feeding sites even when conditions there have worsened.", "Sea turtles prefer feeding in deep water.", "Tagging turtles changes their behavior."], "ans": 1, "exp": "Turtles returned despite damage, and Arai links this to memory over current food. B captures that; the others are unsupported."}, {"id": "r63", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "hard", "type": "mc", "passage": "The 1918 influenza pandemic is often remembered for its death toll, but historian Ruth Okafor focuses on how small towns organized volunteer nursing networks. In her account, neighbors with no medical training kept clinics running when doctors fell ill, an effort that rarely appears in official records.", "stem": "Which choice best states the main idea of the text?", "choices": ["Okafor argues the death toll of 1918 has been exaggerated.", "Okafor highlights an overlooked community response to the 1918 pandemic.", "Doctors in 1918 refused to treat small towns.", "Official records from 1918 are entirely unreliable."], "ans": 1, "exp": "The text contrasts the usual focus with Okafor's focus on volunteer networks missing from official records. B. D overgeneralizes ('entirely')."}, {"id": "r64", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "medium", "type": "mc", "passage": "The following text is adapted from a 1913 novel. The prairie stretched in every direction, flat and gold, and Alexandra felt, for the first time, that the land was not her enemy. It seemed to bend toward her, waiting.", "stem": "Which choice best describes what happens in the text?", "choices": ["Alexandra decides to leave the prairie.", "Alexandra's attitude toward the land shifts to a more hopeful one.", "Alexandra describes a storm crossing the prairie.", "Alexandra argues with a neighbor about farming."], "ans": 1, "exp": "'For the first time... not her enemy' signals a change toward a positive feeling."}, {"id": "r65", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "hard", "type": "mc", "passage": "Engineers designing Mars rovers once prioritized speed. After the Spirit rover became stuck in soft soil in 2009, designers placed greater weight on wheel design and terrain sensing, accepting slower travel in exchange for reliability.", "stem": "Which choice best states the main idea of the text?", "choices": ["Spirit was the fastest rover ever built.", "A rover failure led engineers to favor reliability over speed.", "Mars soil is too soft for rovers.", "Speed is no longer measured on rovers."], "ans": 1, "exp": "Cause (Spirit stuck) → change in priority (reliability over speed). B."}, {"id": "r66", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "A student claims that in the poem 'Harvest Night,' the speaker feels both pride and exhaustion after the work is done.", "stem": "Which quotation from the poem most effectively illustrates the claim?", "choices": ["\"The moon hangs low above the barn.\"", "\"My arms are lead, my back a bent nail— / yet look: the silos full, and full by my hand.\"", "\"The crickets sing their endless tune.\"", "\"Tomorrow there will be more fields.\""], "ans": 1, "exp": "The claim has two parts. 'Arms are lead' = exhaustion; 'full by my hand' = pride. Only B has both."}, {"id": "r67", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "medium", "type": "mc", "passage": "Researchers hypothesize that city pigeons choose nesting sites based on proximity to food rather than shelter from weather.", "stem": "Which finding, if true, would most directly support the hypothesis?", "choices": ["Pigeons nested mostly near food markets, even in exposed spots, while sheltered sites far from food stayed empty.", "Pigeons were more active in summer.", "Pigeons nested in sheltered spots near food.", "Pigeons avoided areas with many cats."], "ans": 0, "exp": "To separate food from shelter, you need a case where they conflict. A shows pigeons choosing food over shelter. C can't distinguish the two."}, {"id": "r68", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "Some scholars argue that the success of Motown Records in the 1960s depended as much on its in-house songwriting teams as on its famous singers.", "stem": "Which finding would most strongly support the scholars' argument?", "choices": ["Motown singers often performed on television.", "Songs written by Motown's in-house teams became hits for several different singers, while singers who left Motown rarely matched their earlier success.", "Motown was based in Detroit.", "Many Motown singers began in church choirs."], "ans": 1, "exp": "B shows the songwriting drove hits across singers, and singers alone did worse — supporting the 'as much as' claim."}, {"id": "r69", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "medium", "type": "mc", "passage": "A historian claims that the transcontinental railroad dramatically reduced travel time across the United States.", "stem": "Which evidence would best support the claim?", "choices": ["Railroad workers were often immigrants.", "Before 1869, crossing the country took about six months by wagon; afterward, the trip took about a week by train.", "The railroad was completed in Utah.", "Train tickets were expensive."], "ans": 1, "exp": "Only B compares travel times before and after."}, {"id": "r70", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "In a study, a scientist argues that a species of desert beetle collects water from fog using bumps on its back.", "stem": "Which observation would most weaken the scientist's argument?", "choices": ["Beetles with their bumps experimentally smoothed collected just as much water as untreated beetles.", "The beetles live in a foggy desert.", "Water droplets were seen on the beetles' backs.", "The beetles are active at dawn."], "ans": 0, "exp": "If removing bumps doesn't change water collection, the bumps likely aren't the mechanism. A weakens it; C supports it."}, {"id": "r71", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "A table shows the share of a city's electricity from solar: 2019, 4%; 2020, 6%; 2021, 9%; 2022, 13%; 2023, 18%. An analyst claims the yearly increase itself grew every year.", "stem": "Which choice uses data from the table to support the claim?", "choices": ["Solar reached 18% in 2023.", "The yearly increases were 2, 3, 4, and 5 percentage points.", "Solar more than quadrupled from 2019 to 2023.", "Solar was 9% in 2021."], "ans": 1, "exp": "The claim is about the increases growing. B lists them: 2, 3, 4, 5 — each larger. C is true but about total growth."}, {"id": "r72", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "medium", "type": "mc", "passage": "A survey reports how 9th graders get to school: bus 45%, car 35%, walk/bike 15%, other 5%. A student claims that more than three-quarters of students use a motor vehicle.", "stem": "Does the data support the claim?", "choices": ["Yes, because bus and car together total 80%.", "No, because only 45% ride the bus.", "Yes, because 15% walk or bike.", "No, because 'other' is unknown."], "ans": 0, "exp": "Bus + car = 80% > 75%. A."}, {"id": "r73", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "In an experiment, plants were grown under three light colors. Average height after 4 weeks: red light, 18 cm; blue light, 14 cm; white light, 22 cm. The researcher concludes that a mix of wavelengths produced more growth than either single color.", "stem": "Which choice best supports the conclusion using the data?", "choices": ["Red light plants grew 18 cm.", "White light, which contains many wavelengths, produced plants 4 cm taller than red and 8 cm taller than blue.", "Blue light plants were the shortest.", "All plants grew more than 10 cm."], "ans": 1, "exp": "The conclusion compares mixed (white) to single colors. B makes both comparisons with numbers."}, {"id": "r74", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "medium", "type": "mc", "passage": "A graph described in text: Library visits per month were 900 in January, 1,100 in February, 1,050 in March, and 1,400 in April, when a new teen space opened.", "stem": "Which statement is best supported by the data?", "choices": ["Visits increased every month.", "The largest monthly increase occurred in the month the teen space opened.", "Visits declined overall from January to April.", "March had the most visits."], "ans": 1, "exp": "Changes: +200, -50, +350. The biggest jump (+350) was April. A is false (M
