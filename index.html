<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SAT Prep – Road to 1600</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--tx:#1d2433;--mu:#667085;--ac:#3b5bfd;--ok:#12a150;--bad:#e5484d;--bd:#e3e7ef}
body.dark{--bg:#0f1420;--card:#182033;--tx:#e8ecf5;--mu:#98a2b3;--bd:#2a3550;--ac:#7b93ff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
.wrap{max-width:900px;margin:auto;padding:12px 16px}
nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}nav b{margin-right:auto;font-size:1.1em}
button,select,input{font:inherit}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.on{outline:2px solid var(--ac)}.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.big{font-size:1.8em;font-weight:700}.mu{color:var(--mu);font-size:.9em}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);cursor:pointer}
.ch.sel{border-color:var(--ac);background:rgba(59,91,253,.08)}.ch.ok{border-color:var(--ok);background:rgba(18,161,80,.12)}.ch.bad{border-color:var(--bad);background:rgba(229,72,77,.12)}
.passage{background:rgba(127,127,127,.08);padding:12px;border-radius:10px;margin-bottom:10px}
.tag{display:inline-block;font-size:.75em;padding:2px 8px;border-radius:99px;background:rgba(127,127,127,.15);margin-right:4px}
.bar{height:10px;background:rgba(127,127,127,.2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.exp{border-left:4px solid var(--ac);padding:8px 12px;margin-top:10px;background:rgba(127,127,127,.06)}
.timer{font-weight:700;font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left;font-size:.92em}
input[type=text]{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);width:160px}
.qnav button{width:34px;height:34px;margin:2px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.qnav .done{background:rgba(59,91,253,.2)}.qnav .cur{outline:2px solid var(--ac)}
svg{width:100%;height:160px}
.encw{display:grid;grid-template-columns:260px 1fr;gap:14px}@media(max-width:720px){.encw{grid-template-columns:1fr}}
.side{max-height:75vh;overflow:auto;position:sticky;top:70px}.side a{display:block;padding:5px 8px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:.92em}.side a:hover,.side a.on{background:rgba(59,91,253,.12)}
.side h4{margin:10px 0 4px;font-size:.8em;color:var(--mu);text-transform:uppercase}.res a{color:var(--ac)}.res li{margin:4px 0}
.ex{background:rgba(18,161,80,.08);border-left:4px solid var(--ok);padding:8px 12px;border-radius:6px}
</style></head><body>
<header><div class="wrap"><nav><b>🎯 Road to 1600</b>
<button class="btn" data-v="dash">Dashboard</button><button class="btn" data-v="practice">Practice</button><button class="btn" data-v="test">Timed Test</button><button class="btn" data-v="full">Full Test</button><button class="btn" data-v="review">Mistakes</button><button class="btn" data-v="enc">Encyclopedia</button><button class="btn" data-v="plan">Study Plan</button><button class="btn" id="theme" title="Dark/light">🌓</button></nav></div></header>
<main class="wrap" id="app"></main>
<script>
const QS=[{"id": "m1", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "easy", "stem": "If 3x - 7 = 11, what is the value of x?", "exp": "Add 7 to both sides: 3x = 18. Divide by 3: x = 6.", "type": "mc", "choices": ["4", "6", "5", "-6"], "ans": 1}, {"id": "m2", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "If 5(2x - 3) = 4x + 9, what is the value of x?", "exp": "Distribute: 10x - 15 = 4x + 9. Subtract 4x: 6x - 15 = 9. Add 15: 6x = 24, so x = 4.", "type": "spr", "ans": "4", "alt": "4"}, {"id": "m3", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "For what value of k does the equation 4(x + k) = 4x + 12 have infinitely many solutions?", "exp": "Expand: 4x + 4k = 4x + 12. The x-terms match, so the equation is true for every x exactly when 4k = 12, so k = 3.", "type": "mc", "choices": ["0", "3", "4", "12"], "ans": 1}, {"id": "m4", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "The equation a(x - 2) = 6x + 5 has no solution. What is the value of a?", "exp": "Expand: ax - 2a = 6x + 5. No solution happens when the x-coefficients match (a = 6) but the constants differ: -12 ≠ 5. So a = 6.", "type": "mc", "choices": ["-6", "2", "5", "6"], "ans": 3}, {"id": "m5", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "easy", "stem": "A gym charges a $40 sign-up fee plus $25 per month. Which function gives the total cost C, in dollars, for m months?", "exp": "The $25 is charged every month (rate, multiplies m) and the $40 is a one-time fee (constant). C = 25m + 40.", "type": "mc", "choices": ["C = 40m + 25", "C = 25m + 40", "C = 65m", "C = 25m - 40"], "ans": 1}, {"id": "m6", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A line passes through the points (2, 5) and (6, 17). What is the y-intercept of the line?", "exp": "Slope = (17 - 5)/(6 - 2) = 12/4 = 3. Use y = 3x + b with (2, 5): 5 = 6 + b, so b = -1.", "type": "spr", "ans": "-1", "alt": "-1"}, {"id": "m7", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "The function f is linear, f(1) = 8, and f(4) = -1. What is f(10)?", "exp": "Slope = (-1 - 8)/(4 - 1) = -3. f(10) = f(4) + (-3)(10 - 4) = -1 - 18 = -19.", "type": "mc", "choices": ["-19", "-22", "-25", "-28"], "ans": 0}, {"id": "m8", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "Line k is perpendicular to the line 2x - 5y = 10 and passes through (4, 1). What is the y-intercept of line k?", "exp": "Rewrite 2x - 5y = 10 as y = (2/5)x - 2, slope 2/5. The perpendicular slope is -5/2. Then 1 = (-5/2)(4) + b = -10 + b, so b = 11.", "type": "mc", "choices": ["11", "-9", "3", "-2.5"], "ans": 0}, {"id": "m9", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "easy", "stem": "If x + y = 10 and x - y = 4, what is the value of x?", "exp": "Add the equations: 2x = 14, so x = 7.", "type": "mc", "choices": ["3", "6", "7", "14"], "ans": 2}, {"id": "m10", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "medium", "stem": "2x + 3y = 21 and x - y = 3. What is the value of y?", "exp": "From the second equation x = y + 3. Substitute: 2(y + 3) + 3y = 21, so 5y + 6 = 21, 5y = 15, y = 3.", "type": "spr", "ans": "3", "alt": "3"}, {"id": "m11", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "The system 3x + ky = 7 and 6x + 8y = 5 has no solution. What is the value of k?", "exp": "No solution means parallel lines: coefficients are proportional but constants are not. 6/3 = 2, so 8/k = 2 gives k = 4. Check constants: 5/7 ≠ 2, so the lines are distinct parallel lines.", "type": "mc", "choices": ["2", "4", "8", "16"], "ans": 1}, {"id": "m12", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "At a school store, 3 pens and 2 notebooks cost $13, and 5 pens and 4 notebooks cost $24. What is the cost, in dollars, of one notebook?", "exp": "Let p = pen price, n = notebook price. Double the first equation: 6p + 4n = 26. Subtract the second (5p + 4n = 24): p = 2. Substitute: 3(2) + 2n = 13, so 2n = 7 and n = 3.5.", "type": "spr", "ans": "3.5", "alt": "3.5"}, {"id": "m13", "sec": "math", "dom": "Algebra", "skill": "Linear inequalities", "diff": "medium", "stem": "A delivery van can carry at most 1,200 pounds. The driver weighs 180 pounds and each box weighs 34 pounds. What is the greatest number of boxes the van can carry with the driver?", "exp": "180 + 34b ≤ 1200, so 34b ≤ 1020, b ≤ 30. The greatest whole number is 30.", "type": "mc", "choices": ["29", "30", "35", "36"], "ans": 1}, {"id": "m14", "sec": "math", "dom": "Algebra", "skill": "Linear inequalities", "diff": "hard", "stem": "Which point (x, y) is a solution to both y > 2x - 3 and y < -x + 6?", "exp": "Test (2, 3): 3 > 2(2) - 3 = 1 ✓ and 3 < -2 + 6 = 4 ✓. (4, 6) fails the second (6 < 2 is false); (0, -4) fails the first; (3, 4) fails the second (4 < 3 false).", "type": "mc", "choices": ["(4, 6)", "(0, -4)", "(2, 3)", "(3, 4)"], "ans": 2}, {"id": "m15", "sec": "math", "dom": "Algebra", "skill": "Linear equations in two variables", "diff": "medium", "stem": "The graph of 4x + 3y = 24 crosses the x-axis at (a, 0). What is a?", "exp": "On the x-axis y = 0, so 4a = 24 and a = 6.", "type": "spr", "ans": "6", "alt": "6"}, {"id": "m16", "sec": "math", "dom": "Algebra", "skill": "Linear equations in two variables", "diff": "hard", "stem": "A tank holds 500 liters and drains at a constant rate. After 8 minutes it holds 340 liters. How many minutes after draining starts will the tank be empty?", "exp": "Rate = (500 - 340)/8 = 20 L/min. Time to empty = 500/20 = 25 minutes.", "type": "mc", "choices": ["20", "25", "28", "32"], "ans": 1}, {"id": "m17", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "easy", "stem": "Which expression is equivalent to (x + 4)(x - 4)?", "exp": "Difference of squares: (a + b)(a - b) = a² - b², so x² - 16.", "type": "mc", "choices": ["x² - 16", "x² + 16", "x² - 8x - 16", "x² - 8"], "ans": 0}, {"id": "m18", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "Which expression is equivalent to (2x³y²)³ / (4x²y)?", "exp": "(2x³y²)³ = 8x⁹y⁶. Divide by 4x²y: 8/4 = 2, x⁹⁻² = x⁷, y⁶⁻¹ = y⁵.", "type": "mc", "choices": ["2x⁷y⁵", "8x⁷y⁵", "2x⁶y⁵", "x⁷y⁵/2"], "ans": 0}, {"id": "m19", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "hard", "stem": "If x² + 10x + c = (x + 5)², what is the value of c?", "exp": "(x + 5)² = x² + 10x + 25, so c = 25.", "type": "spr", "ans": "25", "alt": "25"}, {"id": "m20", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "hard", "stem": "If (ax + 2)(2x - b) = 6x² - 5x - 6 for all x, where a and b are constants, what is a + b?", "exp": "Expand: (ax + 2)(2x - b) = 2ax² + (4 - ab)x - 2b. Match x²: 2a = 6, so a = 3. Match constants: -2b = -6, so b = 3. Check the x-term: 4 - ab = 4 - 9 = -5 ✓. So a + b = 6.", "type": "mc", "choices": ["3", "5", "6", "9"], "ans": 2}, {"id": "m21", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "easy", "stem": "What are the solutions to x² - 5x + 6 = 0?", "exp": "Factor: (x - 2)(x - 3) = 0, so x = 2 or x = 3.", "type": "mc", "choices": ["x = 2 and x = 3", "x = -2 and x = -3", "x = 1 and x = 6", "x = -1 and x = 6"], "ans": 0}, {"id": "m22", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the positive solution to 2x² - 7x - 15 = 0?", "exp": "Factor: (2x + 3)(x - 5) = 0, so x = -3/2 or x = 5. The positive solution is 5.", "type": "spr", "ans": "5", "alt": "5"}, {"id": "m23", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "For what value of c does x² - 6x + c = 0 have exactly one real solution?", "exp": "Exactly one real solution when the discriminant is 0: (-6)² - 4(1)(c) = 36 - 4c = 0, so c = 9.", "type": "mc", "choices": ["-9", "0", "6", "9"], "ans": 3}, {"id": "m24", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "If √(x + 7) = x - 5, what is the value of x?", "exp": "Square: x + 7 = x² - 10x + 25, so x² - 11x + 18 = 0, (x - 2)(x - 9) = 0. Check: x = 2 gives √9 = 3 but 2 - 5 = -3 (extraneous). x = 9 gives √16 = 4 = 9 - 5 ✓. Answer 9.", "type": "spr", "ans": "9", "alt": "9"}, {"id": "m25", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "easy", "stem": "If f(x) = x² - 3x, what is f(-2)?", "exp": "f(-2) = (-2)² - 3(-2) = 4 + 6 = 10.", "type": "mc", "choices": ["-2", "2", "10", "-10"], "ans": 2}, {"id": "m26", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "The function f(x) = 2(x - 3)² + 5 is graphed in the xy-plane. What is the minimum value of f?", "exp": "Vertex form a(x - h)² + k has vertex (h, k) = (3, 5). Since a = 2 > 0 the parabola opens up, so the minimum value is 5.", "type": "mc", "choices": ["2", "3", "5", "-3"], "ans": 2}, {"id": "m27", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "A population of bacteria doubles every 3 hours. It starts at 500. How many bacteria are there after 12 hours?", "exp": "12 hours is 12/3 = 4 doublings: 500 · 2⁴ = 500 · 16 = 8,000.", "type": "spr", "ans": "8000", "alt": "8000"}, {"id": "m28", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "A car's value is modeled by V(t) = 24,000(0.85)ᵗ, where t is years since purchase. Which statement is true?", "exp": "A growth factor of 0.85 means each year the value is 85% of the previous year, i.e., a 15% decrease per year.", "type": "mc", "choices": ["The value decreases by $850 each year.", "The value decreases by 15% each year.", "The value decreases by 85% each year.", "The value is $24,000 after 1 year."], "ans": 1}, {"id": "m29", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The function g(x) = x² - 8x + k has a minimum value of 3. What is k?", "exp": "Vertex at x = 8/2 = 4. g(4) = 16 - 32 + k = k - 16 = 3, so k = 19.", "type": "spr", "ans": "19", "alt": "19"}, {"id": "m30", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The graph of y = (x - 2)(x + 4) intersects the line y = 7 at two points. What is the sum of their x-coordinates?", "exp": "Set (x - 2)(x + 4) = 7: x² + 2x - 8 = 7, x² + 2x - 15 = 0. The sum of roots = -b/a = -2. (Roots are 3 and -5.)", "type": "mc", "choices": ["-2", "2", "-4", "7"], "ans": 0}, {"id": "m31", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "hard", "stem": "Which expression is equivalent to 1/(x - 2) - 1/(x + 2), for x ≠ ±2?", "exp": "Common denominator (x - 2)(x + 2) = x² - 4: [(x + 2) - (x - 2)]/(x² - 4) = 4/(x² - 4).", "type": "mc", "choices": ["4/(x² - 4)", "-4/(x² - 4)", "2x/(x² - 4)", "0"], "ans": 0}, {"id": "m32", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "How many real solutions does x⁴ - 13x² + 36 = 0 have?", "exp": "Let u = x²: u² - 13u + 36 = 0, (u - 4)(u - 9) = 0, so x² = 4 or 9, giving x = ±2, ±3: four real solutions.", "type": "mc", "choices": ["0", "2", "3", "4"], "ans": 3}, {"id": "m33", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "easy", "stem": "A recipe uses 3 cups of flour for every 2 cups of sugar. How many cups of flour are needed for 8 cups of sugar?", "exp": "3/2 = f/8, so f = 8 · 3/2 = 12.", "type": "mc", "choices": ["10", "12", "16", "24"], "ans": 1}, {"id": "m34", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "A runner covers 5 kilometers in 22 minutes. At this rate, how many minutes would it take to run 12 kilometers? (Round to the nearest tenth.)", "exp": "Rate = 22/5 = 4.4 min per km. 12 · 4.4 = 52.8 minutes.", "type": "spr", "ans": "52.8", "alt": "52.8"}, {"id": "m35", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Unit conversion", "diff": "hard", "stem": "A pipe leaks 15 milliliters per minute. How many liters leak in one full day? (1 liter = 1,000 mL)", "exp": "15 mL/min × 60 min/h × 24 h = 21,600 mL = 21.6 L.", "type": "mc", "choices": ["0.36", "2.16", "21.6", "216"], "ans": 2}, {"id": "m36", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "easy", "stem": "A $60 jacket is on sale for 25% off. What is the sale price?", "exp": "25% of 60 is 15. 60 - 15 = $45.", "type": "mc", "choices": ["$15", "$35", "$45", "$48"], "ans": 2}, {"id": "m37", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "medium", "stem": "A price increased from $80 to $92. By what percent did the price increase?", "exp": "Change = 12. Percent increase = 12/80 = 0.15 = 15%.", "type": "spr", "ans": "15", "alt": "15"}, {"id": "m38", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "A store raises a price by 20%, then later lowers the new price by 20%. The final price is what percent of the original?", "exp": "Multiply the factors: 1.20 × 0.80 = 0.96, so the final price is 96% of the original.", "type": "mc", "choices": ["96%", "100%", "104%", "80%"], "ans": 0}, {"id": "m39", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "medium", "stem": "The data set 4, 7, 7, 9, 13 has one value added: 30. Which statement is true?", "exp": "Original mean = 40/5 = 8, median = 7. New mean = 70/6 ≈ 11.67 (up ≈3.67). New median = (7 + 9)/2 = 8 (up 1). An outlier pulls the mean much more than the median.", "type": "mc", "choices": ["The mean increases more than the median.", "The median increases more than the mean.", "Both increase by the same amount.", "Neither changes."], "ans": 0}, {"id": "m40", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "The mean of 5 test scores is 84. After a sixth test, the mean of all 6 scores is 86. What was the sixth score?", "exp": "Sum of 5 = 5 × 84 = 420. Sum of 6 = 6 × 86 = 516. Sixth score = 516 - 420 = 96.", "type": "spr", "ans": "96", "alt": "96"}, {"id": "m41", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Two-variable data", "diff": "medium", "stem": "A line of best fit for a scatterplot is y = 2.5x + 40, where x is hours studied and y is test score. What does 2.5 represent?", "exp": "In a linear model the slope is the predicted change in y per 1-unit change in x: 2.5 points per hour.", "type": "mc", "choices": ["The predicted score with no studying", "The predicted increase in score for each additional hour studied", "The total hours studied", "The maximum possible score"], "ans": 1}, {"id": "m42", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "easy", "stem": "A bag has 4 red, 5 blue, and 6 green marbles. One marble is chosen at random. What is the probability it is blue?", "exp": "Total = 15. P(blue) = 5/15 = 1/3.", "type": "mc", "choices": ["0.2", "1/3", "5/6", "5/11"], "ans": 1}, {"id": "m43", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "hard", "stem": "In a survey of 200 students, 120 play a sport, 70 are in a club, and 40 do both. If one student is chosen at random, what is the probability the student does neither? (Enter as a decimal.)", "exp": "Sport or club = 120 + 70 - 40 = 150. Neither = 200 - 150 = 50. 50/200 = 0.25.", "type": "spr", "ans": "0.25", "alt": "0.25"}, {"id": "m44", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "hard", "stem": "A table shows that of 80 juniors, 30 take Chemistry, and 12 of those 30 also take Physics. If a junior taking Chemistry is chosen at random, what is the probability they also take Physics?", "exp": "This is conditional on taking Chemistry, so the denominator is 30: 12/30 = 0.4.", "type": "mc", "choices": ["0.15", "0.375", "0.4", "0.6"], "ans": 2}, {"id": "m45", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Inference from samples", "diff": "hard", "stem": "A random sample of 400 voters found 52% support a measure, with a margin of error of 4%. Which conclusion is best supported?", "exp": "Margin of error gives a plausible range for the population value: 52% ± 4% = 48% to 56%. Since that range includes values below 50%, passing is not certain.", "type": "mc", "choices": ["Exactly 52% of all voters support the measure.", "It is plausible that between 48% and 56% of all voters support it.", "The measure will definitely pass.", "Fewer than 48% of voters support it."], "ans": 1}, {"id": "m46", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Two-variable data", "diff": "hard", "stem": "An exponential model of a town's population is P = 8,000(1.03)ᵗ. A linear model is L = 8,000 + 240t. For t = 1, which is true?", "exp": "P(1) = 8,000 × 1.03 = 8,240. L(1) = 8,000 + 240 = 8,240. They are equal at t = 1 (the exponential grows faster afterward).", "type": "mc", "choices": ["P > L", "P < L", "P = L", "Cannot be determined"], "ans": 2}, {"id": "m47", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "easy", "stem": "A rectangle has length 12 and width 5. What is the length of its diagonal?", "exp": "Pythagorean theorem: √(12² + 5²) = √169 = 13.", "type": "mc", "choices": ["13", "17", "√119", "60"], "ans": 0}, {"id": "m48", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "medium", "stem": "A cylinder has radius 3 and volume 72π. What is its height?", "exp": "V = πr²h: 72π = π · 9 · h, so h = 8.", "type": "spr", "ans": "8", "alt": "8"}, {"id": "m49", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "hard", "stem": "A cube has a surface area of 150 square inches. What is its volume, in cubic inches?", "exp": "6s² = 150, so s² = 25, s = 5. Volume = 5³ = 125.", "type": "mc", "choices": ["25", "100", "125", "216"], "ans": 2}, {"id": "m50", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "hard", "stem": "A sphere has volume 36π. What is its radius?", "exp": "(4/3)πr³ = 36π, so r³ = 27 and r = 3.", "type": "spr", "ans": "3", "alt": "3"}, {"id": "m51", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "Two angles of a triangle measure 48° and 67°. What is the third angle?", "exp": "Angles sum to 180°: 180 - 48 - 67 = 65°.", "type": "mc", "choices": ["55°", "65°", "75°", "115°"], "ans": 1}, {"id": "m52", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "Two parallel lines are cut by a transversal. One angle measures (3x + 10)° and its alternate interior angle measures (5x - 30)°. What is x?", "exp": "Alternate interior angles are equal: 3x + 10 = 5x - 30, so 40 = 2x, x = 20.", "type": "mc", "choices": ["10", "20", "25", "40"], "ans": 1}, {"id": "m53", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "hard", "stem": "Triangles ABC and DEF are similar, with AB = 6 corresponding to DE = 15. If the area of ABC is 20, what is the area of DEF?", "exp": "Scale factor = 15/6 = 2.5. Areas scale by the square: 20 × 2.5² = 20 × 6.25 = 125.", "type": "spr", "ans": "125", "alt": "125"}, {"id": "m54", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "In right triangle ABC with right angle C, sin A = 3/5. What is cos A?", "exp": "Use a 3-4-5 triangle: opposite 3, hypotenuse 5, so adjacent = 4. cos A = 4/5.", "type": "mc", "choices": ["0.75", "0.8", "5/3", "4/3"], "ans": 1}, {"id": "m55", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In a right triangle, sin(x°) = cos(40°). What is x?", "exp": "sin θ = cos(90° - θ). So x = 90 - 40 = 50.", "type": "mc", "choices": ["40", "50", "90", "140"], "ans": 1}, {"id": "m56", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "A 30-60-90 triangle has a hypotenuse of 14. What is the length of the side opposite the 30° angle?", "exp": "In a 30-60-90 triangle the side opposite 30° is half the hypotenuse: 14/2 = 7.", "type": "spr", "ans": "7", "alt": "7"}, {"id": "m57", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "The equation of a circle is (x - 2)² + (y + 5)² = 49. What are its center and radius?", "exp": "Standard form (x - h)² + (y - k)² = r²: center (2, -5), r = √49 = 7.", "type": "mc", "choices": ["(2, -5), 7", "(-2, 5), 7", "(2, -5), 49", "(-2, 5), 49"], "ans": 0}, {"id": "m58", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "hard", "stem": "The circle x² + y² - 6x + 8y = 0 has what radius?", "exp": "Complete the square: (x² - 6x + 9) + (y² + 8y + 16) = 25, so (x - 3)² + (y + 4)² = 25, radius 5.", "type": "spr", "ans": "5", "alt": "5"}, {"id": "m59", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "hard", "stem": "A circle has radius 9. What is the length of an arc with central angle 2π/3 radians?", "exp": "Arc length = rθ = 9 · 2π/3 = 6π.", "type": "mc", "choices": ["3π", "6π", "9π", "18π"], "ans": 1}, {"id": "m60", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "hard", "stem": "In a circle with radius 10, a central angle of 72° forms a sector. What is the area of the sector divided by π?", "exp": "Sector area = (72/360) · π · 10² = (1/5) · 100π = 20π. Divided by π: 20.", "type": "spr", "ans": "20", "alt": "20"}, {"id": "m61", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "What value of x satisfies 7(x + 4) = 3x + 24?", "exp": "Distribute: 7x + 28 = 3x + 24. Move x-terms: 4x = 24 - 28 = -4. So x = -1.", "type": "spr", "ans": "-1", "alt": "-1"}, {"id": "m62", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "What value of x satisfies 9(x - 5) = 4x + 30?", "exp": "Distribute: 9x - 45 = 4x + 30. Move x-terms: 5x = 30 + 45 = 75. So x = 15.", "type": "spr", "ans": "15", "alt": "15"}, {"id": "m63", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "What value of x satisfies 6(x + 11) = -2x - 13?", "exp": "Distribute: 6x + 66 = -2x - 13. Move x-terms: 8x = -13 - 66 = -79. So x = -79/8.", "type": "spr", "ans": "-9.875", "alt": "-79/8"}, {"id": "m64", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "What value of x satisfies 8(x - 3) = 5x + 22?", "exp": "Distribute: 8x - 24 = 5x + 22. Move x-terms: 3x = 22 + 24 = 46. So x = 46/3. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["-46/3", "23/3", "46/3", "92/3"], "ans": 2}, {"id": "m65", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A company charges a $35 flat fee plus $12 per hour of tutoring. A customer's total bill was $155. How many hours of tutoring did the customer pay for?", "exp": "Set up 35 + 12n = 155. Subtract 35: 12n = 120. Divide: n = 10.", "type": "mc", "choices": ["95/6", "12", "155/12", "10"], "ans": 3}, {"id": "m66", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A company charges a $20 flat fee plus $18 per class. A customer's total bill was $182. How many classes did the customer pay for?", "exp": "Set up 20 + 18n = 182. Subtract 20: 18n = 162. Divide: n = 9.", "type": "mc", "choices": ["9", "91/9", "101/9", "11"], "ans": 0}, {"id": "m67", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A company charges a $40 flat fee plus $7.5 per day of bike rental. A customer's total bill was $115. How many days of bike rental did the customer pay for?", "exp": "Set up 40 + 7.5n = 115. Subtract 40: 7.5n = 75. Divide: n = 10.", "type": "mc", "choices": ["46/3", "62/3", "10", "12"], "ans": 2}, {"id": "m68", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A company charges a $26 flat fee plus $14 per hour of kayak rental. A customer's total bill was $138. How many hours of kayak rental did the customer pay for?", "exp": "Set up 26 + 14n = 138. Subtract 26: 14n = 112. Divide: n = 8.", "type": "mc", "choices": ["10", "69/7", "82/7", "8"], "ans": 3}, {"id": "m69", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "Line ℓ passes through (-1, 7) and (3, -5). If line ℓ also passes through (k, -26), what is k?", "exp": "Slope m = (-5 - (7))/(3 - (-1)) = -3. y-intercept: b = 7 - (-3)(-1) = 4. Solve -26 = (-3)k + 4: k = 10. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["5", "10", "20", "-10"], "ans": 1}, {"id": "m70", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "Line ℓ passes through (2, -4) and (8, 8). If line ℓ also passes through (k, 12), what is k?", "exp": "Slope m = (8 - (-4))/(8 - (2)) = 2. y-intercept: b = -4 - (2)(2) = -8. Solve 12 = (2)k - 8: k = 10.", "type": "spr", "ans": "10", "alt": "10"}, {"id": "m71", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "Line ℓ passes through (-3, -2) and (5, 2). If line ℓ also passes through (k, 9/2), what is k?", "exp": "Slope m = (2 - (-2))/(5 - (-3)) = 1/2. y-intercept: b = -2 - (1/2)(-3) = -1/2. Solve 9/2 = (1/2)k - 1/2: k = 10. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["5", "-10", "10", "20"], "ans": 2}, {"id": "m72", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "Line ℓ passes through (0, 9) and (6, 0). If line ℓ also passes through (k, -6), what is k?", "exp": "Slope m = (0 - (9))/(6 - (0)) = -3/2. y-intercept: b = 9 - (-3/2)(0) = 9. Solve -6 = (-3/2)k + 9: k = 10.", "type": "spr", "ans": "10", "alt": "10"}, {"id": "m73", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "3x + 2y = 16 and 1x - 1y = 2. What is the value of x + y?", "exp": "Solve the system (elimination or substitution): x = 4, y = 2. Check in both equations. Then x + y = 6. (Desmos tip: graph both lines and read the intersection.)", "type": "spr", "ans": "6", "alt": "6"}, {"id": "m74", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "5x - 2y = 1 and 3x + 4y = 11. What is the value of x - y?", "exp": "Solve the system (elimination or substitution): x = 1, y = 2. Check in both equations. Then x - y = -1. (Desmos tip: graph both lines and read the intersection.)", "type": "spr", "ans": "-1", "alt": "-1"}, {"id": "m75", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "2x + 5y = -1 and 4x - 3y = 11. What is the value of 2x + y?", "exp": "Solve the system (elimination or substitution): x = 2, y = -1. Check in both equations. Then 2x + y = 3. (Desmos tip: graph both lines and read the intersection.)", "type": "spr", "ans": "3", "alt": "3"}, {"id": "m76", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "7x + 3y = 29 and 2x - 1y = 0. What is the value of xy?", "exp": "Solve the system (elimination or substitution): x = 29/13, y = 58/13. Check in both equations. Then xy = 1682/169. (Desmos tip: graph both lines and read the intersection.)", "type": "spr", "ans": "1682/169", "alt": "1682/169"}, {"id": "m77", "sec": "math", "dom": "Algebra", "skill": "Linear inequalities", "diff": "medium", "stem": "An elevator has a maximum load of 2000 pounds. An operator weighing 350 pounds rides with crates that weigh 45 pounds each. What is the maximum number of crates that can be loaded?", "exp": "350 + 45n ≤ 2000 → n ≤ 110/3 ≈ 36.67. Round DOWN to stay under the limit: 36.", "type": "mc", "choices": ["36", "35", "37", "44"], "ans": 0}, {"id": "m78", "sec": "math", "dom": "Algebra", "skill": "Linear inequalities", "diff": "medium", "stem": "An elevator has a maximum load of 1500 pounds. An operator weighing 210 pounds rides with bags of cement that weigh 38 pounds each. What is the maximum number of bags of cement that can be loaded?", "exp": "210 + 38n ≤ 1500 → n ≤ 645/19 ≈ 33.95. Round DOWN to stay under the limit: 33.", "type": "mc", "choices": ["34", "39", "32", "33"], "ans": 3}, {"id": "m79", "sec": "math", "dom": "Algebra", "skill": "Linear inequalities", "diff": "medium", "stem": "An elevator has a maximum load of 950 pounds. An operator weighing 165 pounds rides with boxes of books that weigh 27 pounds each. What is the maximum number of boxes of books that can be loaded?", "exp": "165 + 27n ≤ 950 → n ≤ 785/27 ≈ 29.07. Round DOWN to stay under the limit: 29.", "type": "mc", "choices": ["29", "28", "30", "35"], "ans": 0}, {"id": "m80", "sec": "math", "dom": "Algebra", "skill": "Linear inequalities", "diff": "medium", "stem": "An elevator has a maximum load of 3000 pounds. An operator weighing 480 pounds rides with water barrels that weigh 62 pounds each. What is the maximum number of water barrels that can be loaded?", "exp": "480 + 62n ≤ 3000 → n ≤ 1260/31 ≈ 40.65. Round DOWN to stay under the limit: 40.", "type": "mc", "choices": ["40", "39", "41", "48"], "ans": 0}, {"id": "m81", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "In the equation 3(2x - 1) + ax = 9 + 9x - 3, a is a constant. If the equation has no solution, what is a?", "exp": "Left: 6x - 3 + ax = (6 + a)x - 3. Right: 9x + (9 - 3). No solution needs equal x-coefficients and unequal constants: 6 + a = 9 → a = 3, and -3 ≠ 6 ✓ (since 9 ≠ 0).", "type": "mc", "choices": ["9", "-3", "0", "3"], "ans": 3}, {"id": "m82", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "In the equation 5(2x - 1) + ax = -15 + 13x - 5, a is a constant. If the equation has no solution, what is a?", "exp": "Left: 10x - 5 + ax = (10 + a)x - 5. Right: 13x + (-15 - 5). No solution needs equal x-coefficients and unequal constants: 10 + a = 13 → a = 3, and -5 ≠ -20 ✓ (since -15 ≠ 0).", "type": "mc", "choices": ["13", "-3", "3", "0"], "ans": 2}, {"id": "m83", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "In the equation -2(2x - 1) + ax = 8 - 1x + 2, a is a constant. If the equation has no solution, what is a?", "exp": "Left: -4x + 2 + ax = (-4 + a)x + 2. Right: -1x + (8 + 2). No solution needs equal x-coefficients and unequal constants: -4 + a = -1 → a = 3, and --2 ≠ 10 ✓ (since 8 ≠ 0).", "type": "mc", "choices": ["-3", "0", "-1", "3"], "ans": 3}, {"id": "m84", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "In the equation 4(2x - 1) + ax = 6 + 11x - 4, a is a constant. If the equation has no solution, what is a?", "exp": "Left: 8x - 4 + ax = (8 + a)x - 4. Right: 11x + (6 - 4). No solution needs equal x-coefficients and unequal constants: 8 + a = 11 → a = 3, and -4 ≠ 2 ✓ (since 6 ≠ 0).", "type": "mc", "choices": ["0", "3", "-3", "11"], "ans": 1}, {"id": "m85", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the sum of the solutions to x² + 3x - 28 = 0?", "exp": "For x² + bx + c = 0, the sum of solutions is -b = -3. (Factored: (x - (4))(x - (-7)) = 0, roots 4 and -7.)", "type": "mc", "choices": ["-28", "-27", "3", "-3"], "ans": 3}, {"id": "m86", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the sum of the solutions to x² - 5x - 24 = 0?", "exp": "For x² + bx + c = 0, the sum of solutions is -b = 5. (Factored: (x - (-3))(x - (8)) = 0, roots -3 and 8.)", "type": "mc", "choices": ["-5", "-24", "5", "-23"], "ans": 2}, {"id": "m87", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the sum of the solutions to x² - 11x + 30 = 0?", "exp": "For x² + bx + c = 0, the sum of solutions is -b = 11. (Factored: (x - (6))(x - (5)) = 0, roots 6 and 5.)", "type": "mc", "choices": ["31", "-11", "30", "11"], "ans": 3}, {"id": "m88", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "medium", "stem": "What is the sum of the solutions to x² + 11x + 18 = 0?", "exp": "For x² + bx + c = 0, the sum of solutions is -b = -11. (Factored: (x - (-9))(x - (-2)) = 0, roots -9 and -2.)", "type": "mc", "choices": ["19", "11", "18", "-11"], "ans": 3}, {"id": "m89", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The function f(x) = 3(x - (-2))² + (-12). What is the positive difference between the two x-intercepts of the graph of f?", "exp": "Set f(x) = 0: (x - (-2))² = 4, so x = -2 ± 2. The intercepts are -4 and 0; difference = 4.", "type": "spr", "ans": "4", "alt": "4"}, {"id": "m90", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The function f(x) = -2(x - (4))² + (18). What is the positive difference between the two x-intercepts of the graph of f?", "exp": "Set f(x) = 0: (x - (4))² = 9, so x = 4 ± 3. The intercepts are 1 and 7; difference = 6.", "type": "spr", "ans": "6", "alt": "6"}, {"id": "m91", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The function f(x) = 1(x - (5))² + (-9). What is the positive difference between the two x-intercepts of the graph of f?", "exp": "Set f(x) = 0: (x - (5))² = 9, so x = 5 ± 3. The intercepts are 2 and 8; difference = 6.", "type": "spr", "ans": "6", "alt": "6"}, {"id": "m92", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "The function f(x) = 2(x - (-1))² + (-8). What is the positive difference between the two x-intercepts of the graph of f?", "exp": "Set f(x) = 0: (x - (-1))² = 4, so x = -1 ± 2. The intercepts are -3 and 1; difference = 4.", "type": "spr", "ans": "4", "alt": "4"}, {"id": "m93", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "A quantity is modeled by Q(t) = 1200(1.05)ᵗ, measured in dollars. What is Q(3)? (Round to the nearest hundredth if needed.)", "exp": "Q(3) = 1200 × 1.05^3 = 1200 × 1.15763 = 1389.15.", "type": "spr", "ans": "1389.15", "alt": "1389.15"}, {"id": "m94", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "A quantity is modeled by Q(t) = 5000(0.8)ᵗ, measured in dollars. What is Q(2)? (Round to the nearest hundredth if needed.)", "exp": "Q(2) = 5000 × 0.8^2 = 5000 × 0.64 = 3200.", "type": "spr", "ans": "3200", "alt": "3200"}, {"id": "m95", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "A quantity is modeled by Q(t) = 640(1.5)ᵗ, measured in rabbits. What is Q(4)? (Round to the nearest hundredth if needed.)", "exp": "Q(4) = 640 × 1.5^4 = 640 × 5.0625 = 3240.", "type": "spr", "ans": "3240", "alt": "3240"}, {"id": "m96", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "medium", "stem": "A quantity is modeled by Q(t) = 2500(0.9)ᵗ, measured in grams. What is Q(3)? (Round to the nearest hundredth if needed.)", "exp": "Q(3) = 2500 × 0.9^3 = 2500 × 0.729 = 1822.5. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["3645", "-1822.5", "911.25", "1822.5"], "ans": 3}, {"id": "m97", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "A bacteria colony tripled every 5 hours. Which function models the population after t hours, starting from 200?", "exp": "Each 5-hour period multiplies by 3, and t/5 counts the periods: P(t) = 200(3)^(t/5).", "type": "mc", "choices": ["P(t) = 200(3)^(t/5)", "P(t) = 200(3)^(5t)", "P(t) = 3(200)^(t/5)", "P(t) = 200 + 3t/5"], "ans": 0}, {"id": "m98", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear functions", "diff": "hard", "stem": "A bacteria colony quadrupled every 5 hours. Which function models the population after t hours, starting from 200?", "exp": "Each 5-hour period multiplies by 4, and t/5 counts the periods: P(t) = 200(4)^(t/5).", "type": "mc", "choices": ["P(t) = 200(4)^(5t)", "P(t) = 200(4)^(t/5)", "P(t) = 200 + 4t/5", "P(t) = 4(200)^(t/5)"], "ans": 1}, {"id": "m99", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "(3x + 5)² is written as px² + qx + r. What is q?", "exp": "(ax + b)² = a²x² + 2abx + b². Here q = 2(3)(5) = 30. Common trap: forgetting the middle term (it's not just 9x² + 25).", "type": "spr", "ans": "30", "alt": "30"}, {"id": "m100", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "(2x + 7)² is written as px² + qx + r. What is q?", "exp": "(ax + b)² = a²x² + 2abx + b². Here q = 2(2)(7) = 28. Common trap: forgetting the middle term (it's not just 4x² + 49).", "type": "spr", "ans": "28", "alt": "28"}, {"id": "m101", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "(4x + 1)² is written as px² + qx + r. What is q?", "exp": "(ax + b)² = a²x² + 2abx + b². Here q = 2(4)(1) = 8. Common trap: forgetting the middle term (it's not just 16x² + 1).", "type": "spr", "ans": "8", "alt": "8"}, {"id": "m102", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "medium", "stem": "(5x + 3)² is written as px² + qx + r. What is q?", "exp": "(ax + b)² = a²x² + 2abx + b². Here q = 2(5)(3) = 30. Common trap: forgetting the middle term (it's not just 25x² + 9). (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["-30", "30", "15", "60"], "ans": 1}, {"id": "m103", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "If x > 0 and 2x² = 18, what is the value of x?", "exp": "Divide by 2: x² = 9. Since x > 0, x = 3.", "type": "mc", "choices": ["-3", "6", "3", "9"], "ans": 2}, {"id": "m104", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "If x > 0 and 5x² = 5, what is the value of x?", "exp": "Divide by 5: x² = 1. Since x > 0, x = 1.", "type": "mc", "choices": ["-1", "1", "2", "5"], "ans": 1}, {"id": "m105", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "If x > 0 and 3x² = 48, what is the value of x?", "exp": "Divide by 3: x² = 16. Since x > 0, x = 4.", "type": "mc", "choices": ["4", "16", "-4", "12"], "ans": 0}, {"id": "m106", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "If x > 0 and 7x² = 28, what is the value of x?", "exp": "Divide by 7: x² = 4. Since x > 0, x = 2.", "type": "mc", "choices": ["14", "-2", "4", "2"], "ans": 3}, {"id": "m107", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "How many real solutions does x² - 4x + 0 = 0 have?", "exp": "Discriminant b² - 4ac = 16 - 4(0) = 16. Positive → 2 real solutions, zero → 1, negative → 0. So 2.", "type": "mc", "choices": ["1", "0", "2", "Infinitely many"], "ans": 2}, {"id": "m108", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "How many real solutions does x² - 4x + 4 = 0 have?", "exp": "Discriminant b² - 4ac = 16 - 4(4) = 0. Positive → 2 real solutions, zero → 1, negative → 0. So 1.", "type": "mc", "choices": ["2", "1", "0", "Infinitely many"], "ans": 1}, {"id": "m109", "sec": "math", "dom": "Advanced Math", "skill": "Nonlinear equations", "diff": "hard", "stem": "How many real solutions does x² - 4x + 9 = 0 have?", "exp": "Discriminant b² - 4ac = 16 - 4(9) = -20. Positive → 2 real solutions, zero → 1, negative → 0. So 0.", "type": "mc", "choices": ["Infinitely many", "0", "1", "2"], "ans": 1}, {"id": "m110", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "medium", "stem": "A value changed from 250 to 310. What was the percent change? (Enter a negative number for a decrease.)", "exp": "Percent change = (new - old)/old × 100 = (310 - 250)/250 × 100 = 24%.", "type": "spr", "ans": "24", "alt": "24"}, {"id": "m111", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "medium", "stem": "A value changed from 80 to 68. What was the percent change? (Enter a negative number for a decrease.)", "exp": "Percent change = (new - old)/old × 100 = (68 - 80)/80 × 100 = -15%.", "type": "spr", "ans": "-15", "alt": "-15"}, {"id": "m112", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "medium", "stem": "A value changed from 1200 to 1500. What was the percent change? (Enter a negative number for a decrease.)", "exp": "Percent change = (new - old)/old × 100 = (1500 - 1200)/1200 × 100 = 25%.", "type": "spr", "ans": "25", "alt": "25"}, {"id": "m113", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "medium", "stem": "A value changed from 45 to 36. What was the percent change? (Enter a negative number for a decrease.)", "exp": "Percent change = (new - old)/old × 100 = (36 - 45)/45 × 100 = -20%.", "type": "spr", "ans": "-20", "alt": "-20"}, {"id": "m114", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "After a 15% discount, a jacket costs $68. What was the original price, in dollars?", "exp": "Sale price = (1 - 0.15) × original, so original = 68/0.85 = 80. Trap: adding 15% to $68 gives the wrong answer.", "type": "mc", "choices": ["10.2", "80", "78.2", "83"], "ans": 1}, {"id": "m115", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "After a 30% discount, a jacket costs $84. What was the original price, in dollars?", "exp": "Sale price = (1 - 0.3) × original, so original = 84/0.7 = 120. Trap: adding 30% to $84 gives the wrong answer.", "type": "mc", "choices": ["114", "109.2", "120", "25.2"], "ans": 2}, {"id": "m116", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "After a 10% discount, a jacket costs $126. What was the original price, in dollars?", "exp": "Sale price = (1 - 0.1) × original, so original = 126/0.9 = 140. Trap: adding 10% to $126 gives the wrong answer.", "type": "mc", "choices": ["138.6", "140", "136", "12.6"], "ans": 1}, {"id": "m117", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Percentages", "diff": "hard", "stem": "After a 40% discount, a jacket costs $51. What was the original price, in dollars?", "exp": "Sale price = (1 - 0.4) × original, so original = 51/0.6 = 85. Trap: adding 40% to $51 gives the wrong answer.", "type": "mc", "choices": ["20.4", "71.4", "91", "85"], "ans": 3}, {"id": "m118", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "hard", "stem": "A survey table: Grade 9 — Online: 18, In-person: 22. Grade 10 — Online: 25, In-person: 15. One student is selected at random. What is the probability of selecting a 10th grader who prefers online classes? (Enter a fraction or decimal.)", "exp": "Out of all 80 students, 25 are 10th graders preferring online: 25/80. Read which group is the 'given' — that group's total is the denominator.", "type": "spr", "ans": "0.3125", "alt": "5/16"}, {"id": "m119", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "hard", "stem": "A survey table: Grade 9 — Online: 30, In-person: 10. Grade 10 — Online: 12, In-person: 28. One student is selected at random. What is the probability of selecting a student who prefers in-person classes, given they are in grade 10? (Enter a fraction or decimal.)", "exp": "Condition on grade 10 (40 students). In-person there: 28. P = 28/40. Read which group is the 'given' — that group's total is the denominator.", "type": "spr", "ans": "0.7", "alt": "7/10"}, {"id": "m120", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "hard", "stem": "A survey table: Grade 9 — Online: 14, In-person: 26. Grade 10 — Online: 20, In-person: 20. One student is selected at random. What is the probability of selecting a student who is in grade 9, given they prefer online? (Enter a fraction or decimal.)", "exp": "Condition on online (34 students). Grade 9 among them: 14. P = 14/34. Read which group is the 'given' — that group's total is the denominator.", "type": "spr", "ans": "7/17", "alt": "7/17"}, {"id": "m121", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Probability", "diff": "hard", "stem": "A survey table: Grade 9 — Online: 40, In-person: 35. Grade 10 — Online: 25, In-person: 50. One student is selected at random. What is the probability of selecting a student who prefers online, given they are in grade 9? (Enter a fraction or decimal.)", "exp": "Condition on grade 9 (75 students). Online among them: 40. P = 40/75. Read which group is the 'given' — that group's total is the denominator.", "type": "spr", "ans": "8/15", "alt": "8/15"}, {"id": "m122", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "medium", "stem": "Data set: 12, 15, 15, 18, 20, 22, 45. What is the median minus the mean? (Enter a fraction or decimal.)", "exp": "Mean = 147/7 = 21. Median: middle value = 18. Median - mean = -3.", "type": "spr", "ans": "-3", "alt": "-3"}, {"id": "m123", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "medium", "stem": "Data set: 3, 7, 7, 8, 10, 11, 12, 14. What is the median minus the mean? (Enter a fraction or decimal.)", "exp": "Mean = 72/8 = 9. Median: average of the two middle values = 9. Median - mean = 0.", "type": "spr", "ans": "0", "alt": "0"}, {"id": "m124", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "medium", "stem": "Data set: 60, 62, 65, 65, 65, 70, 71, 90. What is the median minus the mean?", "exp": "Mean = 548/8 = 137/2. Median: average of the two middle values = 65. Median - mean = -7/2. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["-7", "-1.75", "-3.5", "3.5"], "ans": 2}, {"id": "m125", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "medium", "stem": "Data set: 5, 5, 6, 9, 10, 10, 10, 15, 20. What is the median minus the mean? (Enter a fraction or decimal.)", "exp": "Mean = 90/9 = 10. Median: middle value = 10. Median - mean = 0.", "type": "spr", "ans": "0", "alt": "0"}, {"id": "m126", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "The average of 8 numbers is 72. When one number is added, the average of all 9 numbers becomes 75. What number was added?", "exp": "Old total = 8 × 72 = 576. New total = 9 × 75 = 675. Added number = 99.", "type": "spr", "ans": "99", "alt": "99"}, {"id": "m127", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "The average of 10 numbers is 15. When one number is added, the average of all 11 numbers becomes 16. What number was added?", "exp": "Old total = 10 × 15 = 150. New total = 11 × 16 = 176. Added number = 26. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["52", "-26", "13", "26"], "ans": 3}, {"id": "m128", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "The average of 4 numbers is 88. When one number is added, the average of all 5 numbers becomes 90. What number was added?", "exp": "Old total = 4 × 88 = 352. New total = 5 × 90 = 450. Added number = 98.", "type": "spr", "ans": "98", "alt": "98"}, {"id": "m129", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "hard", "stem": "The average of 6 numbers is 50. When one number is added, the average of all 7 numbers becomes 48. What number was added?", "exp": "Old total = 6 × 50 = 300. New total = 7 × 48 = 336. Added number = 36.", "type": "spr", "ans": "36", "alt": "36"}, {"id": "m130", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "A train travels at a constant 55 miles per hour for 2 hours 24 minutes. How many miles does it travel?", "exp": "Convert time to hours: 2 + 24/60 = 12/5 h. Distance = 55 × 12/5 = 132 miles.", "type": "spr", "ans": "132", "alt": "132"}, {"id": "m131", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "A train travels at a constant 72 miles per hour for 1 hour 45 minutes. How many miles does it travel?", "exp": "Convert time to hours: 1 + 45/60 = 7/4 h. Distance = 72 × 7/4 = 126 miles. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["-126", "126", "252", "63"], "ans": 1}, {"id": "m132", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "A train travels at a constant 48 miles per hour for 3 hours 10 minutes. How many miles does it travel?", "exp": "Convert time to hours: 3 + 10/60 = 19/6 h. Distance = 48 × 19/6 = 152 miles.", "type": "spr", "ans": "152", "alt": "152"}, {"id": "m133", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Ratios, rates, proportions", "diff": "medium", "stem": "A train travels at a constant 64 miles per hour for 45 minutes. How many miles does it travel?", "exp": "Convert time to hours: 0 + 45/60 = 3/4 h. Distance = 64 × 3/4 = 48 miles.", "type": "spr", "ans": "48", "alt": "48"}, {"id": "m134", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Two-variable data", "diff": "easy", "stem": "A model gives the Fahrenheit temperature F for Celsius temperature C (F = 1.8C + 32). What does the model predict when the input is 25?", "exp": "Substitute: 1.8(25) + 32 = 77.", "type": "spr", "ans": "77", "alt": "77"}, {"id": "m135", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "Two-variable data", "diff": "easy", "stem": "A model gives the predicted weight w (kg) of a puppy at age x weeks (w = 0.45x + 2). What does the model predict when the input is 40?", "exp": "Substitute: 0.45(40) + 2 = 20.", "type": "spr", "ans": "20", "alt": "20"}, {"id": "m136", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "A right triangle has legs 9 and 12. What is the length of the hypotenuse?", "exp": "c = √(9² + 12²) = √225 = 15.", "type": "spr", "ans": "15", "alt": "15"}, {"id": "m137", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "A right triangle has legs 7 and 24. What is the length of the hypotenuse?", "exp": "c = √(7² + 24²) = √625 = 25.", "type": "spr", "ans": "25", "alt": "25"}, {"id": "m138", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "A right triangle has legs 20 and 21. What is the length of the hypotenuse?", "exp": "c = √(20² + 21²) = √841 = 29.", "type": "spr", "ans": "29", "alt": "29"}, {"id": "m139", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "A right triangle has legs 8 and 15. What is the length of the hypotenuse?", "exp": "c = √(8² + 15²) = √289 = 17.", "type": "spr", "ans": "17", "alt": "17"}, {"id": "m140", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "A circle has radius 6. An arc has central angle 120°. The arc length is kπ. What is k?", "exp": "Arc length = (θ/360) × 2πr = (120/360)(2π·6) = 4π, so k = 4. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["-4", "8", "2", "4"], "ans": 3}, {"id": "m141", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "A circle has radius 12. An arc has central angle 45°. The arc length is kπ. What is k?", "exp": "Arc length = (θ/360) × 2πr = (45/360)(2π·12) = 3π, so k = 3.", "type": "spr", "ans": "3", "alt": "3"}, {"id": "m142", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "A circle has radius 15. An arc has central angle 60°. The arc length is kπ. What is k?", "exp": "Arc length = (θ/360) × 2πr = (60/360)(2π·15) = 5π, so k = 5. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["-5", "2.5", "5", "10"], "ans": 2}, {"id": "m143", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "medium", "stem": "A circle has radius 8. An arc has central angle 270°. The arc length is kπ. What is k?", "exp": "Arc length = (θ/360) × 2πr = (270/360)(2π·8) = 12π, so k = 12.", "type": "spr", "ans": "12", "alt": "12"}, {"id": "m144", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "hard", "stem": "The circle x² + y² - 8x + 2y - 19 = 0 has what radius?", "exp": "Complete the square: (x - (4))² + (y - (-1))² = 16 + 1 - (-19) = 36. Radius = √36 = 6.", "type": "spr", "ans": "6", "alt": "6"}, {"id": "m145", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "hard", "stem": "The circle x² + y² + 6x - 10y + 30 = 0 has what radius?", "exp": "Complete the square: (x - (-3))² + (y - (5))² = 9 + 25 - (30) = 4. Radius = √4 = 2.", "type": "spr", "ans": "2", "alt": "2"}, {"id": "m146", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "hard", "stem": "The circle x² + y² - 14x - 4y - 28 = 0 has what radius?", "exp": "Complete the square: (x - (7))² + (y - (2))² = 49 + 4 - (-28) = 81. Radius = √81 = 9.", "type": "spr", "ans": "9", "alt": "9"}, {"id": "m147", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "hard", "stem": "The circle x² + y² + 12x + 16y + 0 = 0 has what radius?", "exp": "Complete the square: (x - (-6))² + (y - (-8))² = 36 + 64 - (0) = 100. Radius = √100 = 10.", "type": "spr", "ans": "10", "alt": "10"}, {"id": "m148", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An isosceles right triangle has legs of length 5. Its hypotenuse is k√2. What is k?", "exp": "In a 45-45-90 triangle, hypotenuse = leg × √2 = 5√2, so k = 5.", "type": "spr", "ans": "5", "alt": "5"}, {"id": "m149", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An isosceles right triangle has legs of length 8. Its hypotenuse is k√2. What is k?", "exp": "In a 45-45-90 triangle, hypotenuse = leg × √2 = 8√2, so k = 8.", "type": "spr", "ans": "8", "alt": "8"}, {"id": "m150", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An isosceles right triangle has legs of length 11. Its hypotenuse is k√2. What is k?", "exp": "In a 45-45-90 triangle, hypotenuse = leg × √2 = 11√2, so k = 11.", "type": "spr", "ans": "11", "alt": "11"}, {"id": "m151", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "medium", "stem": "An isosceles right triangle has legs of length 3. Its hypotenuse is k√2. What is k?", "exp": "In a 45-45-90 triangle, hypotenuse = leg × √2 = 3√2, so k = 3. (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["6", "-3", "3", "1.5"], "ans": 2}, {"id": "m152", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In right triangle PQR, angle R is 90°, and tan P = 5/12. What is sin Q? (Enter a fraction.)", "exp": "tan P = opposite/adjacent = 5/12; hypotenuse = √(5² + 12²) = 13. Side opposite Q is the side adjacent to P, 12. sin Q = 12/13. (Also: sin Q = cos P since P + Q = 90°.)", "type": "spr", "ans": "12/13", "alt": "12/13"}, {"id": "m153", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In right triangle PQR, angle R is 90°, and tan P = 8/15. What is sin Q? (Enter a fraction.)", "exp": "tan P = opposite/adjacent = 8/15; hypotenuse = √(8² + 15²) = 17. Side opposite Q is the side adjacent to P, 15. sin Q = 15/17. (Also: sin Q = cos P since P + Q = 90°.)", "type": "spr", "ans": "15/17", "alt": "15/17"}, {"id": "m154", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In right triangle PQR, angle R is 90°, and tan P = 7/24. What is sin Q? (Enter a fraction.)", "exp": "tan P = opposite/adjacent = 7/24; hypotenuse = √(7² + 24²) = 25. Side opposite Q is the side adjacent to P, 24. sin Q = 24/25. (Also: sin Q = cos P since P + Q = 90°.)", "type": "spr", "ans": "0.96", "alt": "24/25"}, {"id": "m155", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Right triangles and trigonometry", "diff": "hard", "stem": "In right triangle PQR, angle R is 90°, and tan P = 9/40. What is sin Q?", "exp": "tan P = opposite/adjacent = 9/40; hypotenuse = √(9² + 40²) = 41. Side opposite Q is the side adjacent to P, 40. sin Q = 40/41. (Also: sin Q = cos P since P + Q = 90°.) (Converted to multiple choice; wrong choices reflect common slips such as doubling, halving, or sign errors.)", "type": "mc", "choices": ["80/41", "-40/41", "20/41", "40/41"], "ans": 3}, {"id": "m156", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "hard", "stem": "Cube A has edge length 4. Cube B has edge length 3 times as long. The volume of cube B is how many times the volume of cube A?", "exp": "Volume scales with the cube of the scale factor: 3³ = 27. (Check: (12)³/4³ = 1728/64 = 27.)", "type": "mc", "choices": ["9", "27", "3", "28"], "ans": 1}, {"id": "m157", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "hard", "stem": "Cube A has edge length 6. Cube B has edge length 2 times as long. The volume of cube B is how many times the volume of cube A?", "exp": "Volume scales with the cube of the scale factor: 2³ = 8. (Check: (12)³/6³ = 1728/216 = 8.)", "type": "mc", "choices": ["8", "2", "6", "4"], "ans": 0}, {"id": "m158", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "hard", "stem": "Cube A has edge length 5. Cube B has edge length 4 times as long. The volume of cube B is how many times the volume of cube A?", "exp": "Volume scales with the cube of the scale factor: 4³ = 64. (Check: (20)³/5³ = 8000/125 = 64.)", "type": "mc", "choices": ["64", "4", "16", "12"], "ans": 0}, {"id": "m159", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "hard", "stem": "Cube A has edge length 3. Cube B has edge length 5 times as long. The volume of cube B is how many times the volume of cube A?", "exp": "Volume scales with the cube of the scale factor: 5³ = 125. (Check: (15)³/3³ = 3375/27 = 125.)", "type": "mc", "choices": ["25", "5", "125", "15"], "ans": 2}, {"id": "m160", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "In a triangle, two interior angles measure 38° and 71°. What is the measure, in degrees, of the exterior angle adjacent to the third angle?", "exp": "The third angle = 180 - 38 - 71 = 71. Its exterior angle = 180 - 71 = 109 (equal to the sum of the two remote interior angles).", "type": "mc", "choices": ["38", "109", "142", "71"], "ans": 1}, {"id": "m161", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "In a triangle, two interior angles measure 52° and 64°. What is the measure, in degrees, of the exterior angle adjacent to the third angle?", "exp": "The third angle = 180 - 52 - 64 = 64. Its exterior angle = 180 - 64 = 116 (equal to the sum of the two remote interior angles).", "type": "mc", "choices": ["52", "128", "116", "64"], "ans": 2}, {"id": "m162", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "In a triangle, two interior angles measure 29° and 103°. What is the measure, in degrees, of the exterior angle adjacent to the third angle?", "exp": "The third angle = 180 - 29 - 103 = 48. Its exterior angle = 180 - 48 = 132 (equal to the sum of the two remote interior angles).", "type": "mc", "choices": ["151", "29", "48", "132"], "ans": 3}, {"id": "m163", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "medium", "stem": "In a triangle, two interior angles measure 45° and 45°. What is the measure, in degrees, of the exterior angle adjacent to the third angle?", "exp": "The third angle = 180 - 45 - 45 = 90. Its exterior angle = 180 - 90 = 90 (equal to the sum of the two remote interior angles).", "type": "mc", "choices": ["45", "90", "135", "91"], "ans": 1}, {"id": "m164", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "easy", "stem": "If x + 7 = 12, what is the value of x?", "exp": "Subtract 7 from both sides: x = 12 − 7 = 5.", "type": "mc", "choices": ["7", "-5", "12", "5"], "ans": 3}, {"id": "m165", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "easy", "stem": "If x + 12 = 21, what is the value of x?", "exp": "Subtract 12 from both sides: x = 21 − 12 = 9.", "type": "mc", "choices": ["9", "-9", "12", "21"], "ans": 0}, {"id": "m166", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "easy", "stem": "If x - 4 = 2, what is the value of x?", "exp": "Subtract -4 from both sides: x = 2 + 4 = 6.", "type": "mc", "choices": ["6", "2", "-4", "-6"], "ans": 0}, {"id": "m167", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "easy", "stem": "If x + 9 = 1, what is the value of x?", "exp": "Subtract 9 from both sides: x = 1 − 9 = -8.", "type": "mc", "choices": ["8", "9", "-8", "1"], "ans": 2}, {"id": "m168", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "easy", "stem": "If f(x) = 3x + 1, what is f(4)?", "exp": "Substitute: 3(4) + 1 = 12 + 1 = 13.", "type": "mc", "choices": ["8", "11", "12", "13"], "ans": 3}, {"id": "m169", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "easy", "stem": "If f(x) = 5x + 1, what is f(-2)?", "exp": "Substitute: 5(-2) + 1 = -10 + 1 = -9.", "type": "mc", "choices": s", "skill": "Percentages", "diff": "easy", "stem": "What is 20% of 45?", "exp": "20% = 0.2. 0.2 × 45 = 9.", "type": "mc", "choices": ["2.25", "25", "90", "9"], "ans": 3}, {"id": "m178", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "easy", "stem": "What is the mean of the data set 4, 8, 6, 10, 7?", "exp": "Sum = 35; count = 5; mean = 35/5 = 7.", "type": "mc", "choices": ["8", "6", "35", "7"], "ans": 3}, {"id": "m179", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "easy", "stem": "What is the mean of the data set 12, 15, 9, 20, 14?", "exp": "Sum = 70; count = 5; mean = 70/5 = 14.", "type": "mc", "choices": ["14", "70", "11", "15"], "ans": 0}, {"id": "m180", "sec": "math", "dom": "Problem-Solving & Data Analysis", "skill": "One-variable data", "diff": "easy", "stem": "What is the mean of the data set 3, 3, 5, 9, 10?", "exp": "Sum = 30; count = 5; mean = 30/5 = 6.", "type": "mc", "choices": ["6", "5", "30", "7"], "ans": 0}, {"id": "m181", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "easy", "stem": "A rectangle is 8 cm long and 5 cm wide. What is its perimeter, in centimeters?", "exp": "Perimeter = 2(l + w) = 2(8 + 5) = 26.", "type": "mc", "choices": ["40", "32", "13", "26"], "ans": 3}, {"id": "m182", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "easy", "stem": "A rectangle is 11 cm long and 4 cm wide. What is its perimeter, in centimeters?", "exp": "Perimeter = 2(l + w) = 2(11 + 4) = 30.", "type": "mc", "choices": ["40", "15", "30", "44"], "ans": 2}, {"id": "m183", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Area and volume", "diff": "easy", "stem": "A rectangle is 6 cm long and 6 cm wide. What is its perimeter, in centimeters?", "exp": "Perimeter = 2(l + w) = 2(6 + 6) = 24.", "type": "mc", "choices": ["12", "24", "36", "34"], "ans": 1}, {"id": "m184", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "easy", "stem": "A circle has radius 3. Its area is kπ. What is k?", "exp": "Area = πr² = π·3² = 9π, so k = 9.", "type": "mc", "choices": ["6", "3", "9", "36"], "ans": 2}, {"id": "m185", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "easy", "stem": "A circle has radius 5. Its area is kπ. What is k?", "exp": "Area = πr² = π·5² = 25π, so k = 25.", "type": "mc", "choices": ["25", "10", "5", "100"], "ans": 0}, {"id": "m186", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Circles", "diff": "easy", "stem": "A circle has radius 10. Its area is kπ. What is k?", "exp": "Area = πr² = π·10² = 100π, so k = 100.", "type": "mc", "choices": ["100", "20", "400", "10"], "ans": 0}, {"id": "m187", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "Two angles are supplementary. One measures 35°. What does the other measure?", "exp": "Supplementary angles add to 180°: 180 − 35 = 145.", "type": "mc", "choices": ["145", "55", "325", "35"], "ans": 0}, {"id": "m188", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "Two angles are supplementary. One measures 62°. What does the other measure?", "exp": "Supplementary angles add to 180°: 180 − 62 = 118.", "type": "mc", "choices": ["62", "118", "28", "298"], "ans": 1}, {"id": "m189", "sec": "math", "dom": "Geometry & Trigonometry", "skill": "Lines, angles, triangles", "diff": "easy", "stem": "Two angles are supplementary. One measures 90°. What does the other measure?", "exp": "Supplementary angles add to 180°: 180 − 90 = 90.", "type": "mc", "choices": ["100", "90", "180", "270"], "ans": 1}, {"id": "m190", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "easy", "stem": "What is the value of 2^5?", "exp": "2^5 means multiply 5 copies of 2: 32.", "type": "mc", "choices": ["16", "10", "25", "32"], "ans": 3}, {"id": "m191", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "easy", "stem": "What is the value of 3^3?", "exp": "3^3 means multiply 3 copies of 3: 27.", "type": "mc", "choices": ["28", "27", "9", "37"], "ans": 1}, {"id": "m192", "sec": "math", "dom": "Advanced Math", "skill": "Equivalent expressions", "diff": "easy", "stem": "What is the value of 5^3?", "exp": "5^3 means multiply 3 copies of 5: 125.", "type": "mc", "choices": ["125", "15", "243", "25"], "ans": 0}, {"id": "m193", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "If 3x − 2 = 22, what is the value of 3x + 5?", "exp": "No need to solve for x: 3x = 22 + 2 = 24. So 3x + 5 = 29.", "type": "mc", "choices": ["29", "8", "22", "13"], "ans": 0}, {"id": "m194", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "If 5x − 2 = 28, what is the value of 5x + 5?", "exp": "No need to solve for x: 5x = 28 + 2 = 30. So 5x + 5 = 35.", "type": "mc", "choices": ["6", "35", "28", "11"], "ans": 1}, {"id": "m195", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "If 4x − 2 = 42, what is the value of 4x + 5?", "exp": "No need to solve for x: 4x = 42 + 2 = 44. So 4x + 5 = 49.", "type": "mc", "choices": ["49", "16", "11", "42"], "ans": 0}, {"id": "m196", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "medium", "stem": "If 6x − 2 = 40, what is the value of 6x + 5?", "exp": "No need to solve for x: 6x = 40 + 2 = 42. So 6x + 5 = 47.", "type": "mc", "choices": ["12", "40", "7", "47"], "ans": 3}, {"id": "m197", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "A linear function h has values h(0) = 12 and h(3) = 27. What is h(0) + the slope of h?", "exp": "Slope = (27 − 12)/(3 − 0) = 5. h(0) = 12 − (5)(0) = 12. Sum = 17.", "type": "mc", "choices": ["5", "12", "17", "7"], "ans": 2}, {"id": "m198", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "A linear function h has values h(1) = 40 and h(4) = 25. What is h(0) + the slope of h?", "exp": "Slope = (25 − 40)/(4 − 1) = -5. h(0) = 40 − (-5)(1) = 45. Sum = 40.", "type": "mc", "choices": ["-5", "45", "40", "50"], "ans": 2}, {"id": "m199", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "hard", "stem": "A linear function h has values h(2) = 7 and h(6) = 23. What is h(0) + the slope of h?", "exp": "Slope = (23 − 7)/(6 − 2) = 4. h(0) = 7 − (4)(2) = -1. Sum = 3.", "type": "mc", "choices": ["4", "3", "-1", "-5"], "ans": 1}, {"id": "m200", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A phone plan costs $85 to start plus $12 for each additional gigabyte of data. Which expression gives the total cost for g gigabytes?", "exp": "The $85 is charged once; $12 is charged per gigabyte, so it multiplies g.", "type": "mc", "choices": ["85 + 12g", "85g − 12", "97g", "12 + 85g"], "ans": 0}, {"id": "m201", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A phone plan costs $150 to start plus $9 for each additional gigabyte of data. Which expression gives the total cost for g gigabytes?", "exp": "The $150 is charged once; $9 is charged per gigabyte, so it multiplies g.", "type": "mc", "choices": ["159g", "150 + 9g", "150g − 9", "9 + 150g"], "ans": 1}, {"id": "m202", "sec": "math", "dom": "Algebra", "skill": "Linear functions", "diff": "medium", "stem": "A phone plan costs $60 to start plus $4 for each additional gigabyte of data. Which expression gives the total cost for g gigabytes?", "exp": "The $60 is charged once; $4 is charged per gigabyte, so it multiplies g.", "type": "mc", "choices": ["64g", "4 + 60g", "60g − 4", "60 + 4g"], "ans": 3}, {"id": "m203", "sec": "math", "dom": "Algebra", "skill": "Linear equations in two variables", "diff": "medium", "stem": "Which point lies on the line 2x + 3y = 25?", "exp": "Test (2, 7): 2(2) + 3(7) = 4 + 21 = 25 ✓.", "type": "mc", "choices": ["(7, 2)", "(2, -7)", "(0, 7)", "(2, 7)"], "ans": 3}, {"id": "m204", "sec": "math", "dom": "Algebra", "skill": "Linear equations in two variables", "diff": "medium", "stem": "Which point lies on the line 4x − 1y = 3?", "exp": "Test (2, 5): 4(2) − 1(5) = 8 − 5 = 3 ✓.", "type": "mc", "choices": ["(2, -5)", "(0, 5)", "(2, 5)", "(5, 2)"], "ans": 2}, {"id": "m205", "sec": "math", "dom": "Algebra", "skill": "Linear equations in two variables", "diff": "medium", "stem": "Which point lies on the line 3x + 5y = -14?", "exp": "Test (2, -4): 3(2) + 5(-4) = 6 − 20 = -14 ✓.", "type": "mc", "choices": ["(2, -4)", "(-4, 2)", "(2, 4)", "(0, -4)"], "ans": 0}, {"id": "m206", "sec": "math", "dom": "Algebra", "skill": "Linear equations in two variables", "diff": "medium", "stem": "Which point lies on the line 1x − 6y = -52?", "exp": "Test (2, 9): 1(2) − 6(9) = 2 − 54 = -52 ✓.", "type": "mc", "choices": ["(0, 9)", "(2, -9)", "(2, 9)", "(9, 2)"], "ans": 2}, {"id": "m207", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "What is the sum of all solutions to |x − 5| = 13?", "exp": "x − 5 = 13 gives x = 18; x − 5 = −13 gives x = -8. Sum = 18 + (-8) = 10.", "type": "mc", "choices": ["18", "10", "-8", "26"], "ans": 1}, {"id": "m208", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "What is the sum of all solutions to |x − 2| = 9?", "exp": "x − 2 = 9 gives x = 11; x − 2 = −9 gives x = -7. Sum = 11 + (-7) = 4.", "type": "mc", "choices": ["-7", "4", "18", "11"], "ans": 1}, {"id": "m209", "sec": "math", "dom": "Algebra", "skill": "Linear equations in one variable", "diff": "hard", "stem": "What is the sum of all solutions to |x − 7| = 20?", "exp": "x − 7 = 20 gives x = 27; x − 7 = −20 gives x = -13. Sum = 27 + (-13) = 14.", "type": "mc", "choices": ["40", "27", "14", "-13"], "ans": 2}, {"id": "m210", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "3x + 5y = 42 and 4x + 2y = 28. What is the value of x?", "exp": "Solve by elimination: x = 4, y = 6. Check: 3(4) + 5(6) = 42 ✓.", "type": "mc", "choices": ["10", "-2", "4", "6"], "ans": 2}, {"id": "m211", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "medium", "stem": "A quiz has 9 questions worth either 3 or 5 points each, for a total of 31 points. How many 5-point questions are there?", "exp": "Let a + b = 9 and 3a + 5b = 31. Replace a with 9 − b: 27 + 2b = 31, so b = 2.", "type": "mc", "choices": ["6", "2", "7", "3"], "ans": 1}, {"id": "m212", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "medium", "stem": "A quiz has 16 questions worth either 2 or 6 points each, for a total of 62 points. How many 6-point questions are there?", "exp": "Let a + b = 16 and 2a + 6b = 62. Replace a with 16 − b: 32 + 4b = 62, so b = 7.5.", "type": "mc", "choices": ["9.5", "7.5", "10.5", "8.5"], "ans": 1}, {"id": "m213", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "medium", "stem": "A quiz has 12 questions worth either 3 or 5 points each, for a total of 47 points. How many 5-point questions are there?", "exp": "Let a + b = 12 and 3a + 5b = 47. Replace a with 12 − b: 36 + 2b = 47, so b = 5.5.", "type": "mc", "choices": ["7.5", "8.5", "6.5", "5.5"], "ans": 3}, {"id": "m214", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "For what value of c does the system y = 2x + 4 and 4x − 2y = c have infinitely many solutions?", "exp": "Rewrite the first: 2x − y = −4, then double it: 4x − 2y = −8. Identical lines need c = −8.", "type": "mc", "choices": ["4", "-4", "8", "-8"], "ans": 3}, {"id": "m215", "sec": "math", "dom": "Algebra", "skill": "Systems of linear equations", "diff": "hard", "stem": "For what va
