arch dipped)."}, {"id": "r75", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "A study tracked hours of sleep and average quiz score: 5 hours, 71; 6 hours, 76; 7 hours, 83; 8 hours, 88; 9 hours, 87. A student claims more sleep is always associated with higher scores in this study.", "stem": "Which choice best describes whether the data support the claim?", "choices": ["The data support it, since 8 hours beat 5 hours.", "The data do not fully support it, since scores dipped slightly from 8 to 9 hours.", "The data support it, since 9 hours had a high score.", "The data do not support it, since 5 hours had the lowest score."], "ans": 1, "exp": "'Always' fails because 87 < 88. B. D's reasoning actually agrees with a trend, not against it."}, {"id": "r76", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Ice cores from Greenland contain tiny bubbles of ancient air. Deeper layers formed earlier, and the gases trapped in each layer reflect the atmosphere at the time it formed. By comparing carbon dioxide in different layers, scientists can therefore ______", "stem": "Which choice most logically completes the text?", "choices": ["prevent future climate change.", "reconstruct how atmospheric carbon dioxide levels changed over time.", "measure the temperature of Greenland today.", "prove that ice cores are older than rocks."], "ans": 1, "exp": "Layers = time; gases = atmosphere then. So comparing layers shows change over time. B."}, {"id": "r77", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "medium", "type": "mc", "passage": "A bakery started labeling the calories on its pastries. Sales of its highest-calorie item dropped 20%, while sales of its fruit cups rose 25%. Total revenue stayed about the same. This suggests that ______", "stem": "Which choice most logically completes the text?", "choices": ["customers stopped visiting the bakery.", "some customers shifted their purchases toward lower-calorie options.", "fruit cups are more expensive than pastries.", "calorie labels are required by law."], "ans": 1, "exp": "One item fell while the lower-calorie option rose, with revenue steady—a shift in choices. B."}, {"id": "r78", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Two populations of the same lizard species live on neighboring islands. On Island A, which has many trees, the lizards have long legs suited to running on trunks. On Island B, which has mostly thin shrubs, the lizards have shorter legs suited to gripping narrow branches. These differences suggest that ______", "stem": "Which choice most logically completes the text?", "choices": ["the two populations are different species.", "each population's leg length may be adapted to the plants in its habitat.", "lizards on Island A are faster swimmers.", "leg length has no effect on survival."], "ans": 1, "exp": "Leg length matches habitat structure on each island, suggesting adaptation. A contradicts 'same species.'"}, {"id": "r79", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "medium", "type": "mc", "passage": "In the novel, Theo always eats lunch alone in the library. When a new student sits beside him and asks about his book, Theo answers in a single word and keeps reading. Later that night, though, he writes the student's name in his journal and underlines it twice. This suggests that Theo ______", "stem": "Which choice most logically completes the text?", "choices": ["was annoyed by the new student.", "was more interested in the new student than he showed.", "forgot the student's name.", "prefers studying in the cafeteria."], "ans": 1, "exp": "Outwardly brief, but the journal entry signals hidden interest. B."}, {"id": "r80", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "A city replaced a busy four-way stop with a roundabout. Crashes at the intersection fell by half, but the average speed of cars through it changed very little. Since crash rates were not reduced by slowing cars down, the roundabout's effect most likely came from ______", "stem": "Which choice most logically completes the text?", "choices": ["drivers avoiding the intersection entirely.", "changes in how drivers interact at the intersection, such as fewer head-on and right-angle conflicts.", "higher speed limits nearby.", "more traffic lights."], "ans": 1, "exp": "Speed didn't change, so the cause must be something else about the design—fewer conflict points. B."}, {"id": "r81", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Medieval scribes sometimes wrote notes in the margins of manuscripts, complaining about cold hands or bad ink. Because these notes were unrelated to the texts being copied, historians value them as evidence of ______", "stem": "Which choice most logically completes the text?", "choices": ["the content of the original books.", "the everyday working conditions of scribes.", "the price of books in the Middle Ages.", "how many manuscripts survived."], "ans": 1, "exp": "Notes about cold hands and ink reveal working conditions. B."}, {"id": "r82", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "easy", "type": "mc", "passage": "Prosper ISD students can join more than 50 clubs, from robotics to Spanish to mock trial. Counselors encourage freshmen to try at least one club in their first semester to make friends and explore interests.", "stem": "According to the text, why do counselors encourage freshmen to join a club?", "choices": ["To raise their grades", "To make friends and explore interests", "To earn scholarship money", "To meet a graduation requirement"], "ans": 1, "exp": "The text states the reason directly: to make friends and explore interests."}, {"id": "r83", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "A literary scholar argues that in the play The Harbor, the character Ines uses humor to hide her fear.", "stem": "Which quotation would best support the scholar's argument?", "choices": ["Ines: \"I've always loved the sea.\"", "Ines (laughing, gripping the rail until her knuckles whiten): \"Well, if we sink, at least I won't have to finish my taxes.\"", "Ines: \"The captain is very experienced.\"", "Ines: \"I'm terrified, and I won't pretend otherwise.\""], "ans": 1, "exp": "B pairs a joke with a physical sign of fear—humor masking fear. D shows open fear, not hiding it."}, {"id": "r84", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "medium", "type": "mc", "passage": "An online store found that customers who watched a product video were twice as likely to buy the product. However, the customers who chose to watch videos had also spent more time on the site before watching. Therefore, the store cannot yet conclude that ______", "stem": "Which choice most logically completes the text?", "choices": ["customers watch videos.", "the videos themselves caused the increase in purchases.", "some customers bought products.", "time on the site can be measured."], "ans": 1, "exp": "Already-engaged customers chose to watch, so the link may not be causal. B (correlation ≠ causation)."}, {"id": "r85", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "Text describes a table of a school's average SAT Math scores: 2021, 548; 2022, 561; 2023, 559; 2024, 575. The principal says scores 'rose every year.'", "stem": "Which choice best evaluates the principal's statement?", "choices": ["It is accurate, since 2024 was the highest.", "It is inaccurate, since the average fell slightly from 2022 to 2023.", "It is accurate, since scores rose 27 points overall.", "It is inaccurate, since 2021 was the lowest."], "ans": 1, "exp": "561 → 559 is a decrease, so 'every year' is wrong. B."}, {"id": "r86", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "hard", "type": "mc", "passage": "Nineteenth-century critics often dismissed quilts as household crafts. Today, museums display quilts by artists such as the women of Gee's Bend, Alabama, recognizing their bold geometry and improvisation as comparable to modern abstract painting.", "stem": "Which choice best states the main idea of the text?", "choices": ["Quilts were never appreciated in the nineteenth century because they were poorly made.", "The way quilts are valued has shifted from viewing them as crafts to recognizing them as art.", "Modern abstract painters copied Gee's Bend quilts.", "Museums have stopped displaying paintings."], "ans": 1, "exp": "Then (craft) vs. now (art). B. C claims copying, which isn't stated."}, {"id": "r87", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "The new manager's approach was ______: instead of announcing sweeping changes, she adjusted one process at a time and measured the results.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["reckless", "incremental", "theatrical", "indifferent"], "ans": 1, "exp": "One step at a time = incremental."}, {"id": "r88", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Although the author's early essays were ______, filled with digressions and personal asides, her later work is notably spare and direct.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["concise", "discursive", "factual", "unpublished"], "ans": 1, "exp": "'Although' contrasts with 'spare and direct'; 'digressions' signals discursive (rambling). 'Concise' is the opposite."}, {"id": "r89", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Rather than ______ the rival theory outright, the researcher acknowledged its strengths before explaining where her own data departed from it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["dismiss", "embrace", "fabricate", "memorize"], "ans": 0, "exp": "'Rather than' contrasts with acknowledging strengths; the opposite is to dismiss it."}, {"id": "r90", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "The museum's new exhibit is ______; visitors can touch replicas, solve puzzles, and record their own stories.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["static", "interactive", "exclusive", "outdated"], "ans": 1, "exp": "Touching, solving, recording = interactive."}, {"id": "r91", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The committee's report was deliberately ______, avoiding any specific recommendation that might upset either faction.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["noncommittal", "decisive", "inflammatory", "exhaustive"], "ans": 0, "exp": "Avoiding specific recommendations = noncommittal. 'Decisive' is the opposite."}, {"id": "r92", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Scientists were initially ______ about the claim, since it relied on a single small experiment that no other lab had repeated.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["skeptical", "credulous", "jubilant", "indifferent"], "ans": 0, "exp": "Limited, unreplicated evidence leads to doubt: skeptical. 'Credulous' means too ready to believe."}, {"id": "r93", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "As used in the text, what does the word \"sound\" most nearly mean? The engineer assured the city that the bridge was structurally sound and could safely carry heavy trucks.", "stem": "Which choice best answers the question?", "choices": ["noisy", "stable", "musical", "asleep"], "ans": 1, "exp": "Structurally sound and safe = stable."}, {"id": "r94", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Ortiz's argument is ______: each claim builds directly on evidence presented in the previous chapter, leaving few gaps for critics to exploit.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["tenuous", "cogent", "whimsical", "redundant"], "ans": 1, "exp": "Well-supported, logically connected = cogent. 'Tenuous' means weak."}, {"id": "r95", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The historian cautions that the diary is a ______ source: it was written decades after the events, by someone who wanted to look heroic.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["reliable", "problematic", "primary", "neutral"], "ans": 1, "exp": "Late writing plus self-serving motive makes it problematic. 'Reliable' and 'neutral' contradict the text."}, {"id": "r96", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "Most people assume that hibernating bears simply sleep through winter. In fact, bears' body temperatures drop only a few degrees, and they can wake quickly if disturbed. Some researchers therefore prefer the term 'torpor' to describe their state.", "stem": "Which choice best describes the overall structure of the text?", "choices": ["It describes a misconception, presents evidence against it, and notes a resulting change in terminology.", "It argues that bears should not hibernate.", "It lists animals that hibernate.", "It tells a story about a researcher's encounter with a bear."], "ans": 0, "exp": "Assumption → 'In fact' evidence → new term. A."}, {"id": "r97", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "The following text is from a short story. Grandpa's workshop smelled of sawdust and oil. Every tool hung on the wall in its painted outline, and nothing was ever out of place—except, that day, the hammer, which lay on the floor.", "stem": "What is the main purpose of the final part of the text (beginning with 'except')?", "choices": ["To create a sense that something unusual has happened", "To describe how hammers are made", "To show that Grandpa was careless", "To list the tools in the workshop"], "ans": 0, "exp": "After establishing perfect order, the out-of-place hammer signals something unusual. B and D don't fit; C contradicts the order described."}, {"id": "r98", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "Critics praised the novel's first half for its tension. The second half, they argued, loses momentum as the author shifts from the mystery to lengthy descriptions of the town's history. Still, several reviewers noted that these chapters deepen the reader's understanding of the characters' motives.", "stem": "What is the function of the last sentence?", "choices": ["It offers a qualification to the criticism of the second half.", "It repeats the praise of the first half.", "It argues that the novel should be shortened.", "It introduces a new character."], "ans": 0, "exp": "'Still' introduces a partial defense of the criticized section—a qualification."}, {"id": "r99", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "Honeybees perform a 'waggle dance' to tell other bees where flowers are. The angle of the dance shows direction relative to the sun, and the length of the waggle shows distance.", "stem": "What is the main purpose of the text?", "choices": ["To explain how honeybees communicate the location of food", "To argue that bees are smarter than ants", "To describe bee anatomy", "To warn about declining bee populations"], "ans": 0, "exp": "The text explains the dance's meaning. A."}, {"id": "r100", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "Some economists favor congestion pricing—charging drivers to enter busy downtown areas. Supporters note that London's program reduced traffic by about 30% in its first years. Opponents worry that such fees burden lower-income commuters who have few transit options.", "stem": "Which choice best describes the function of the third sentence?", "choices": ["It presents a concern raised against the policy described.", "It provides evidence for London's success.", "It defines congestion pricing.", "It concludes that the policy should be rejected."], "ans": 0, "exp": "The third sentence gives opponents' concern. It doesn't conclude rejection."}, {"id": "r101", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "The narrator describes the city at dawn: 'Streetlights blinked off one by one, as if the city were closing its eyes to rest just as its people opened theirs.'", "stem": "What is the main effect of the comparison in the sentence?", "choices": ["It contrasts the city's quieting with its residents' waking.", "It explains how streetlights work.", "It shows the narrator dislikes mornings.", "It suggests the city is dangerous at night."], "ans": 0, "exp": "The simile sets the city 'closing its eyes' against people 'opening theirs'—a contrast."}, {"id": "r102", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: Many nutritionists recommend eating breakfast daily, citing studies where breakfast eaters had healthier weights. Text 2: A recent controlled trial randomly assigned adults to eat or skip breakfast and found no meaningful difference in weight after 16 weeks. The researchers suggest earlier studies may reflect other habits of breakfast eaters.", "stem": "Based on the texts, how would the researchers in Text 2 most likely respond to the nutritionists in Text 1?", "choices": ["They would agree breakfast causes healthy weight.", "They would argue that the earlier studies may show a correlation rather than a cause.", "They would recommend skipping breakfast.", "They would say weight cannot be measured accurately."], "ans": 1, "exp": "Text 2 suggests other habits explain the link—correlation, not causation. C overreaches."}, {"id": "r103", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "medium", "type": "mc", "passage": "Text 1: A city council member argues that a new library branch is the best use of the budget because it would serve all ages. Text 2: A parks director argues that the same money should repair aging playgrounds, which are used daily by young children.", "stem": "Which choice best describes how the two texts relate?", "choices": ["Both propose different uses for the same funds, each emphasizing who would benefit.", "Text 2 supports building the library.", "Text 1 argues against all public spending.", "Both agree playgrounds are unsafe."], "ans": 0, "exp": "Two competing proposals for the same budget, each citing beneficiaries. A."}, {"id": "r104", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: Art historian Lena Park argues that photography freed painters from the need to depict reality precisely, encouraging movements like Impressionism. Text 2: Historian Omar Reyes agrees that photography influenced painters but notes that early Impressionists were also responding to new paint tubes, which made painting outdoors easier.", "stem": "How would Reyes most likely respond to Park's argument?", "choices": ["He would reject any link between photography and painting.", "He would accept it but add that other factors also shaped Impressionism.", "He would argue that Impressionism came before photography.", "He would say paint tubes were unimportant."], "ans": 1, "exp": "Reyes 'agrees... but notes' another factor. B."}, {"id": "r105", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: Some educators argue that homework in high school builds discipline and improves achievement. Text 2: A review of studies found that homework's benefits for high schoolers level off after about two hours per night, and additional time is linked to higher stress without better grades.", "stem": "How would the author of Text 2 most likely respond to Text 1?", "choices": ["Homework has no benefit at all.", "Homework may help, but only up to a point, beyond which costs may outweigh benefits.", "Educators should assign more homework.", "Stress improves achievement."], "ans": 1, "exp": "Text 2 shows benefits up to ~2 hours, then diminishing returns. B. A contradicts the benefits found."}, {"id": "r106", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "The scientist's notes were ______, recording every temperature reading, the time of each measurement, and even the weather outside the lab.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["meticulous", "sloppy", "brief", "imaginary"], "ans": 0, "exp": "Detailed, careful records = meticulous."}, {"id": "r107", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Though widely ______ during her lifetime, the poet gained a large following only after her letters were published decades after her death.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["celebrated", "overlooked", "translated", "imitated"], "ans": 1, "exp": "'Though' contrasts with gaining a following later, so she was overlooked during life."}, {"id": "r108", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "Coral reefs cover less than 1% of the ocean floor. Yet they support about a quarter of all known marine species.", "stem": "What is the function of the second sentence?", "choices": ["It contrasts the reefs' small area with their large ecological importance.", "It explains how coral reefs form.", "It gives a reason reefs are declining.", "It repeats the information in the first sentence."], "ans": 0, "exp": "'Yet' introduces a contrast between small size and large biodiversity."}, {"id": "r109", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "medium", "type": "mc", "passage": "Text 1: A food critic calls the new restaurant's menu 'adventurous,' praising its unusual flavor combinations. Text 2: A diner review complains that the menu is 'confusing,' with few familiar options for children.", "stem": "Which choice best describes a difference between the texts?", "choices": ["Text 1 views the menu's unusual dishes positively, while Text 2 sees them as a drawback.", "Both texts dislike the menu.", "Text 2 praises the prices.", "Text 1 complains about service."], "ans": 0, "exp": "Same feature, opposite evaluations."}, {"id": "r110", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The treaty's language was so ______ that both nations later claimed it supported their opposing positions.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["ambiguous", "precise", "brief", "formal"], "ans": 0, "exp": "If both sides can read it their way, it's ambiguous."}, {"id": "r111", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "The author begins the essay by describing her grandmother's handwritten recipe cards, stained and annotated over fifty years. She then argues that digital recipe apps, though convenient, erase the personal history that such cards preserve.", "stem": "Which choice best describes the function of the description of the recipe cards?", "choices": ["It provides a concrete example that sets up the author's argument.", "It argues that handwriting should be taught in schools.", "It criticizes the grandmother's cooking.", "It explains how recipe apps work."], "ans": 0, "exp": "The cards illustrate 'personal history' before the argument about apps. A."}, {"id": "r112", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Many people think tomatoes are vegetables. ______, botanists classify them as fruits because they develop from a flower and contain seeds.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Similarly", "However", "For example", "Therefore"], "ans": 1, "exp": "Common belief vs. scientific classification: contrast → 'However.'"}, {"id": "r113", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The river's water level dropped sharply during the drought. ______, barges that normally carried grain downstream were forced to carry half loads.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["As a result", "In contrast", "Nevertheless", "For instance"], "ans": 0, "exp": "Low water caused lighter loads: cause → effect."}, {"id": "r114", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The first edition of the dictionary contained about 40,000 words. The latest edition, ______, includes more than 470,000 entries.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["likewise", "by comparison", "as a result", "in other words"], "ans": 1, "exp": "Comparing two editions' sizes: 'by comparison.' 'As a result' implies causation not stated."}, {"id": "r115", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "To prepare for the robotics competition, the team first sketched designs. ______, they built a cardboard model to test the size.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Next", "However", "In conclusion", "For example"], "ans": 0, "exp": "Sequence: 'Next.'"}, {"id": "r116", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Octopuses have no bones. ______, they can squeeze through any opening larger than their beak, the only hard part of their body.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Consequently", "Nonetheless", "Similarly", "Previously"], "ans": 0, "exp": "No bones → can squeeze through openings: cause-effect."}, {"id": "r117", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The author's first novel sold only a few hundred copies. ______, her second novel became a bestseller and was translated into 30 languages.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Accordingly", "By contrast", "Similarly", "In addition"], "ans": 1, "exp": "Few sales vs. bestseller: contrast."}, {"id": "r118", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Penguins cannot fly. ______, they are excellent swimmers, reaching speeds of up to 22 miles per hour underwater.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Therefore", "However", "For example", "Likewise"], "ans": 1, "exp": "Limitation vs. strength: contrast."}, {"id": "r119", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Studies show that exercise improves mood. ______, a 2019 study found that just 15 minutes of running per day reduced the risk of depression by about 26%.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["For instance", "Instead", "Even so", "Meanwhile"], "ans": 0, "exp": "A specific study illustrating the general claim: example."}, {"id": "r120", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The city's population doubled between 2000 and 2020. Its public transit system, ______, added only two new bus routes in that time.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["moreover", "meanwhile", "for example", "thus"], "ans": 1, "exp": "Two simultaneous but contrasting developments: 'meanwhile.' 'Thus' implies cause."}, {"id": "r121", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Water expands when it freezes. ______, a sealed glass bottle full of water may crack in the freezer.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["For this reason", "On the other hand", "Similarly", "In the past"], "ans": 0, "exp": "Expansion is why the bottle cracks."}, {"id": "r122", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "The proposal had strong support from teachers. ______, it failed because the district could not afford the extra staff it required.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Ultimately, though", "Specifically", "Likewise", "As a result of this support"], "ans": 0, "exp": "Support, yet it failed: contrast with a final outcome: 'Ultimately, though.'"}, {"id": "r123", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "Some birds migrate thousands of miles each year. The Arctic tern, ______, travels roughly 44,000 miles annually between the Arctic and Antarctica.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["for example", "however", "instead", "nevertheless"], "ans": 0, "exp": "The tern is an example of a long-distance migrant."}, {"id": "r124", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Bessie Coleman was the first African American woman to earn a pilot's license (1921). • U.S. flight schools refused to admit her. • She learned French and trained in France. • She performed in air shows across the U.S.", "stem": "The student wants to emphasize the obstacle Coleman overcame to become a pilot. Which choice most effectively accomplishes this goal?", "choices": ["Bessie Coleman performed in air shows across the United States.", "After U.S. flight schools refused to admit her, Bessie Coleman learned French and trained in France, earning her pilot's license in 1921.", "Bessie Coleman earned a pilot's license in 1921.", "Bessie Coleman learned French."], "ans": 1, "exp": "Only B includes the obstacle (refusal) and how she overcame it."}, {"id": "r125", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Lake Texoma lies on the Texas–Oklahoma border. • It was created by Denison Dam, completed in 1944. • It is one of the largest reservoirs in the U.S. • It is popular for striped bass fishing.", "stem": "The student wants to explain how Lake Texoma was formed. Which choice most effectively accomplishes this goal?", "choices": ["Lake Texoma, on the Texas–Oklahoma border, is popular for fishing.", "Lake Texoma is a reservoir formed by Denison Dam, which was completed in 1944.", "Lake Texoma is one of the largest U.S. reservoirs.", "Striped bass live in Lake Texoma."], "ans": 1, "exp": "Formation = the dam. B."}, {"id": "r126", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • Venus is the second planet from the Sun. • Mercury is closer to the Sun. • Venus is hotter than Mercury (about 465°C). • Venus's thick carbon dioxide atmosphere traps heat.", "stem": "The student wants to explain why Venus is hotter than Mercury. Which choice most effectively accomplishes this goal?", "choices": ["Venus is the second planet from the Sun.", "Mercury is closer to the Sun than Venus.", "Although Mercury is closer to the Sun, Venus is hotter because its thick carbon dioxide atmosphere traps heat.", "Venus reaches about 465°C."], "ans": 2, "exp": "C gives the explanation (atmosphere traps heat) and addresses the surprise."}, {"id": "r127", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Study A: 30 students, used flashcards, average vocab score 78. • Study B: 30 students, used spaced-repetition app, average score 89. • Both studies lasted 6 weeks.", "stem": "The student wants to compare the results of the two studies. Which choice most effectively accomplishes this goal?", "choices": ["Study A lasted six weeks.", "Students using a spaced-repetition app averaged 89 on a vocabulary test, 11 points higher than students using flashcards (78), over the same six-week period.", "Study B used an app.", "Flashcards are a common study tool."], "ans": 1, "exp": "B compares both results with numbers and notes equal duration."}, {"id": "r128", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • The Mayan civilization developed a calendar. • It used a base-20 number system. • Mayan mathematicians used a symbol for zero. • Few ancient civilizations had a concept of zero.", "stem": "The student wants to emphasize the significance of a Mayan achievement. Which choice most effectively accomplishes this goal?", "choices": ["The Maya used a base-20 number system.", "The Maya developed a calendar.", "The Maya used a symbol for zero, a concept few ancient civilizations had.", "Mayan mathematicians wrote numbers."], "ans": 2, "exp": "Significance comes from rarity of the concept: C."}, {"id": "r129", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • The Texas State Fair is held in Dallas. • It runs for about 24 days each fall. • Big Tex, a 55-foot cowboy statue, greets visitors.", "stem": "The student wants to describe a famous landmark of the fair. Which choice most effectively accomplishes this goal?", "choices": ["The Texas State Fair is held in Dallas.", "The fair runs for about 24 days.", "Visitors to the Texas State Fair are greeted by Big Tex, a 55-foot cowboy statue.", "The fair happens in the fall."], "ans": 2, "exp": "The landmark is Big Tex: C."}, {"id": "r130", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Wind turbines can harm birds. • Painting one turbine blade black reduced bird deaths by about 70% in a Norwegian study. • The study involved four turbines over several years.", "stem": "The student wants to present a possible solution to a problem and note a limitation of the evidence. Which choice most effectively accomplishes this goal?", "choices": ["Wind turbines can harm birds.", "Painting one blade black cut bird deaths by about 70% in a Norwegian study, though the study involved only four turbines.", "A Norwegian study lasted several years.", "Bird deaths are a serious problem."], "ans": 1, "exp": "B gives the solution, the result, and the small-sample limitation."}, {"id": "r131", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • Chess originated in India around the 6th century. • It spread to Persia and then Europe. • Modern rules were standardized in the 15th century.", "stem": "The student wants to describe how chess spread. Which choice most effectively accomplishes this goal?", "choices": ["Chess originated in India.", "After originating in India around the 6th century, chess spread to Persia and then to Europe.", "Chess rules were standardized in the 15th century.", "Chess is a strategy game."], "ans": 1, "exp": "B traces the spread."}, {"id": "r132", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • Dorothy Vaughan was a mathematician at NASA. • She taught herself and her team the programming language FORTRAN. • This prepared them when NASA adopted electronic computers. • She became NASA's first Black supervisor.", "stem": "The student wants to emphasize Vaughan's foresight. Which choice most effectively accomplishes this goal?", "choices": ["Dorothy Vaughan was NASA's first Black supervisor.", "Anticipating NASA's shift to electronic computers, Dorothy Vaughan taught herself and her team FORTRAN.", "Dorothy Vaughan was a mathematician.", "NASA adopted electronic computers."], "ans": 1, "exp": "Foresight = preparing in advance. B."}, {"id": "r133", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "hard", "type": "mc", "passage": "Most metals are solid at room temperature. Mercury, ______, is a liquid.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["by contrast", "similarly", "as a result", "for example"], "ans": 0, "exp": "Mercury is the exception: contrast."}, {"id": "r134", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "medium", "type": "mc", "passage": "A student's notes: • Mount Everest is 29,032 feet tall. • K2 is 28,251 feet tall. • K2 is considered more dangerous to climb.", "stem": "The student wants to contrast the two mountains. Which choice most effectively accomplishes this goal?", "choices": ["Mount Everest is 29,032 feet tall.", "Although K2 is shorter than Mount Everest, it is considered more dangerous to climb.", "K2 is in Asia.", "Both are tall mountains."], "ans": 1, "exp": "B states a contrast between them."}, {"id": "r135", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "medium", "type": "mc", "passage": "The class planted 30 trees in the spring. ______, by fall, all but two were still growing strongly.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Encouragingly", "However", "For example", "Instead"], "ans": 0, "exp": "Positive outcome following the planting: 'Encouragingly.'"}, {"id": "r136", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "hard", "type": "mc", "passage": "A student's notes: • A 'food desert' is an area with limited access to affordable, healthy food. • In 2019, about 19 million Americans lived in food deserts. • Some cities offer tax breaks to grocery stores that open in these areas.", "stem": "The student wants to define the term and present a policy response. Which choice most effectively accomplishes this goal?", "choices": ["About 19 million Americans lived in food deserts in 2019.", "Food deserts—areas with limited access to affordable, healthy food—have led some cities to offer tax breaks to grocery stores that open there.", "Grocery stores pay taxes.", "Healthy food is important."], "ans": 1, "exp": "B defines the term and gives the response."}, {"id": "r137", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "The hikers reached the summit at ______ they watched the sun rise over the valley.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["dawn,", "dawn;", "dawn", "dawn, and,"], "ans": 1, "exp": "Two independent clauses: semicolon. A is a comma splice."}, {"id": "r138", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "Marine iguanas are found only in one ______ the Galápagos Islands.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["place:", "place;", "place,", "place, and"], "ans": 0, "exp": "A colon introduces an explanation/specification after a complete clause. A semicolon needs an independent clause after it."}, {"id": "r139", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The novel's protagonist, a retired ______ returns to her hometown to solve a decades-old mystery.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["detective", "detective,", "detective;", "detective—"], "ans": 1, "exp": "'A retired detective' is a nonessential appositive opened by a comma, so it must close with a comma."}, {"id": "r140", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "Before the concert ______ the orchestra rehearsed for six hours.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["began,", "began;", "began:", "began."], "ans": 0, "exp": "Introductory dependent clause → comma."}, {"id": "r141", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The experiment produced surprising ______ the plants grown in darkness were taller than those grown in light.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["results,", "results:", "results", "results, and"], "ans": 1, "exp": "A colon after an independent clause introduces the explanation of 'surprising results.' A creates a comma splice."}, {"id": "r142", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "Scientists have studied the deep ocean for ______ however, more than 80% of it remains unmapped in detail.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["decades,", "decades;", "decades", "decades:"], "ans": 1, "exp": "'However' joining two independent clauses needs a semicolon before it."}, {"id": "r143", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "The coach announced the starting lineup ______ then she explained the game plan.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["lineup,", "lineup, and", "lineup and,", "lineup"], "ans": 1, "exp": "Two independent clauses joined with comma + 'and.' A is a comma splice."}, {"id": "r144", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The package contained three items: a compass, which was ______ a map of the trail; and a flashlight.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["brass,", "brass;", "brass", "brass:"], "ans": 1, "exp": "In a list whose items contain commas, items are separated by semicolons."}, {"id": "r145", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "Researchers ______ studied the coral reef found that water temperature was the strongest predictor of bleaching.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["who", "who,", "who;", "—who"], "ans": 0, "exp": "'Who studied the coral reef' is essential to identify the researchers: no punctuation."}, {"id": "r146", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "medium", "type": "mc", "passage": "My sister's favorite ______ which she reads every summer, is Pride and Prejudice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["book,", "book", "book;", "book:"], "ans": 0, "exp": "Nonessential clause 'which she reads every summer' needs commas on both sides."}, {"id": "r147", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "The team had trained hard all ______ nevertheless, they lost the final match by a single point.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["season,", "season;", "season", "season, and"], "ans": 1, "exp": "Conjunctive adverb 'nevertheless' between independent clauses: semicolon before."}, {"id": "r148", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "hard", "type": "mc", "passage": "Astronaut Mae ______ the first African American woman in space, flew aboard Endeavour in 1992.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["Jemison,", "Jemison", "Jemison;", "Jemison—"], "ans": 0, "exp": "Appositive 'the first African American woman in space' set off by commas (matching the comma after 'space')."}, {"id": "r149", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "Each of the students ______ responsible for bringing a calculator.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["are", "is", "were", "have been"], "ans": 1, "exp": "'Each' is singular: 'is.'"}, {"id": "r150", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "The flock of geese ______ south every October.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["migrate", "migrates", "are migrating", "have migrated"], "ans": 1, "exp": "'Flock' is a singular collective noun: 'migrates.'"}, {"id": "r151", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "The results of the survey, which included responses from more than 2,000 teens, ______ that most prefer texting to calling.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["shows", "show", "is showing", "has shown"], "ans": 1, "exp": "Subject is 'results' (plural), not 'survey' or 'teens': 'show.'"}, {"id": "r152", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "When the band finished ______ final song, the crowd cheered for ten minutes.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["their", "its", "it's", "there"], "ans": 1, "exp": "'Band' is singular: 'its.'"}, {"id": "r153", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Having studied the map carefully, ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["the route seemed obvious to Jordan.", "Jordan chose the shortest route.", "the shortest route was chosen.", "it was easy to find the route."], "ans": 1, "exp": "The modifier describes who studied the map; Jordan must follow the comma."}, {"id": "r154", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "By next June, Maria ______ piano for ten years.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["studies", "will have studied", "studied", "has studied"], "ans": 1, "exp": "An action completed by a future point: future perfect 'will have studied.'"}, {"id": "r155", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "The three ______ hats were left on the bus.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["childrens'", "children's", "childrens", "childs'"], "ans": 1, "exp": "'Children' is already plural; possessive: 'children's.'"}, {"id": "r156", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Neither the manager nor the employees ______ aware of the change.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["was", "were", "is", "has been"], "ans": 1, "exp": "Agrees with the nearer subject 'employees' (plural): 'were.'"}, {"id": "r157", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "The scientist, along with her two assistants, ______ the results at tomorrow's conference.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["present", "will present", "are presenting", "have presented"], "ans": 1, "exp": "'Along with...' doesn't make the subject plural. 'The scientist... will present' (singular-compatible and future for 'tomorrow')."}, {"id": "r158", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "The goal of the program is to help students read more widely, think more critically, and ______", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["writing more clearly.", "to write more clearly.", "write more clearly.", "clear writing."], "ans": 2, "exp": "Parallel verbs after 'to': read, think, and write."}, {"id": "r159", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "medium", "type": "mc", "passage": "The cat licked ______ paw and curled up by the fire.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["it's", "its", "its'", "their"], "ans": 1, "exp": "Possessive 'its' (no apostrophe). 'It's' = it is."}, {"id": "r160", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "In 1969, the Apollo 11 crew ______ on the Moon, and millions watched on television.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["lands", "landed", "has landed", "will land"], "ans": 1, "exp": "Past event, parallel with 'watched': 'landed.'"}, {"id": "r161", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "hard", "type": "mc", "passage": "Some of the cake ______ missing, but all of the cookies ______ still on the plate.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["was / were", "were / was", "was / was", "were / were"], "ans": 0, "exp": "'Some'/'all' take the number of their object: 'of the cake' (singular) → was; 'of the cookies' (plural) → were."}, {"id": "r162", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "easy", "type": "mc", "passage": "Lena planted sunflower seeds in May. By August, the plants were taller than the fence, and bees visited the flowers every morning.", "stem": "According to the text, what happened by August?", "choices": ["The seeds had not sprouted.", "The sunflowers had grown taller than the fence.", "Lena removed the fence.", "Bees stopped visiting."], "ans": 1, "exp": "The text says the plants were taller than the fence by August."}, {"id": "r163", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "easy", "type": "mc", "passage": "The school library now opens at 7:00 a.m. instead of 7:30 a.m. so that students who arrive early on the bus have a quiet place to study.", "stem": "Why did the library change its opening time?", "choices": ["To save electricity", "To give early bus riders a place to study", "To host more events", "To close earlier"], "ans": 1, "exp": "Stated directly: 'so that students who arrive early... have a quiet place to study.'"}, {"id": "r164", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "easy", "type": "mc", "passage": "Every time Mia's dog hears keys jingle, he runs to the front door and wags his tail.", "stem": "What can most reasonably be inferred about the dog?", "choices": ["He is afraid of keys.", "He connects the sound of keys with going outside.", "He dislikes the front door.", "He cannot hear well."], "ans": 1, "exp": "Running to the door at the sound of keys suggests he expects to go out."}, {"id": "r165", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "easy", "type": "mc", "passage": "A class recorded pets owned: dogs, 12; cats, 8; fish, 5; none, 3.", "stem": "Which pet was owned by the most students?", "choices": ["Cats", "Dogs", "Fish", "None"], "ans": 1, "exp": "12 is the largest number."}, {"id": "r166", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "easy", "type": "mc", "passage": "The puppy was so ______ that it fell asleep in the middle of playing.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["energetic", "exhausted", "curious", "loud"], "ans": 1, "exp": "Falling asleep mid-play suggests exhaustion."}, {"id": "r167", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "easy", "type": "mc", "passage": "Because the instructions were ______, everyone assembled the shelf correctly on the first try.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["confusing", "clear", "missing", "long"], "ans": 1, "exp": "Success on the first try implies clear instructions."}, {"id": "r168", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "easy", "type": "mc", "passage": "Recycling one aluminum can saves enough energy to run a TV for about three hours. That's why many schools place recycling bins next to every trash can.", "stem": "What is the main purpose of the text?", "choices": ["To explain a reason schools encourage recycling", "To describe how TVs work", "To argue that cans are dangerous", "To list types of trash"], "ans": 0, "exp": "Benefit of recycling → why schools place bins."}, {"id": "r169", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "easy", "type": "mc", "passage": "The hikers were ______ when they finally reached the top and saw the view.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["thrilled", "bored", "lost", "angry"], "ans": 0, "exp": "Reaching the top and seeing the view fits 'thrilled.'"}, {"id": "r170", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "easy", "type": "mc", "passage": "It rained all morning. ______, the soccer game was moved indoors.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Therefore", "However", "For example", "Similarly"], "ans": 0, "exp": "Rain caused the move: 'Therefore.'"}, {"id": "r171", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "easy", "type": "mc", "passage": "Jaden loves math. ______, he enjoys science and coding.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["In addition", "However", "Instead", "In contrast"], "ans": 0, "exp": "Adding more interests: 'In addition.'"}, {"id": "r172", "sec": "rw", "dom": "Expression of Ideas", "skill": "Transitions", "diff": "easy", "type": "mc", "passage": "First, preheat the oven. ______, mix the flour and sugar.", "stem": "Which choice completes the text with the most logical transition?", "choices": ["Next", "However", "Therefore", "Instead"], "ans": 0, "exp": "Sequence: 'Next.'"}, {"id": "r173", "sec": "rw", "dom": "Expression of Ideas", "skill": "Rhetorical Synthesis", "diff": "easy", "type": "mc", "passage": "A student's notes: • The cheetah is the fastest land animal. • It can run about 70 miles per hour.", "stem": "The student wants to state the cheetah's top speed. Which choice accomplishes this goal?", "choices": ["The cheetah is an animal.", "The cheetah, the fastest land animal, can run about 70 miles per hour.", "Cheetahs live in Africa.", "Cheetahs have spots."], "ans": 1, "exp": "Only B gives the speed."}, {"id": "r174", "sec": "rw", "dom": "Standard English Conventions", "skill": "Boundaries", "diff": "easy", "type": "mc", "passage": "Maria finished her homework ______ then she went to practice.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["homework,", "homework, and", "homework", "homework and,"], "ans": 1, "exp": "Two independent clauses: comma + 'and.'"}, {"id": "r175", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "easy", "type": "mc", "passage": "The dogs ______ barking at the mail carrier.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["is", "are", "was", "has been"], "ans": 1, "exp": "'Dogs' is plural: 'are.'"}, {"id": "r176", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "easy", "type": "mc", "passage": "Yesterday, we ______ to the science museum.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["go", "went", "will go", "going"], "ans": 1, "exp": "'Yesterday' → past tense 'went.'"}, {"id": "r177", "sec": "rw", "dom": "Standard English Conventions", "skill": "Form, Structure, and Sense", "diff": "easy", "type": "mc", "passage": "The bird built ______ nest in the oak tree.", "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["it's", "its", "their", "its'"], "ans": 1, "exp": "Possessive 'its.'"}, {"id": "r178", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "hard", "type": "mc", "passage": "Volcanologist Teresa Lund notes that most eruptions are preceded by swarms of small earthquakes. However, she cautions that many swarms end without any eruption, so seismic activity alone cannot reliably predict when a volcano will erupt.", "stem": "Which choice best states the main idea of the text?", "choices": ["Small earthquakes always lead to eruptions.", "Earthquake swarms often precede eruptions but are not sufficient on their own for reliable prediction.", "Volcanoes cannot be studied.", "Lund has predicted every recent eruption."], "ans": 1, "exp": "'However... cannot reliably predict' — B states the nuance."}, {"id": "r179", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "medium", "type": "mc", "passage": "In the 1930s, the Works Progress Administration hired out-of-work writers to interview elderly Americans, including formerly enslaved people. Historians now treat these interviews as rare first-person sources, though they note that interviewers' biases sometimes shaped the questions.", "stem": "Which choice best describes the historians' view of the interviews?", "choices": ["They are worthless.", "They are valuable sources that must be read with awareness of interviewer bias.", "They were written by the elderly people themselves.", "They are fictional."], "ans": 1, "exp": "Valued as rare sources, with a caution about bias. B."}, {"id": "r180", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "A student claims that in the novel Iron Valley, the town's attitude toward the new factory shifts from hope to resentment.", "stem": "Which pair of quotations best supports the claim?", "choices": ["\"Crowds cheered as the ribbon was cut\" and \"By winter, people spat when the factory whistle blew.\"", "\"The factory was built of brick\" and \"The whistle blew at noon.\"", "\"Many jobs were created\" and \"Wages were paid weekly.\"", "\"The mayor gave a speech\" and \"The river ran nearby.\""], "ans": 0, "exp": "A shows both hope (cheering) and later resentment (spitting)."}, {"id": "r181", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "Researchers propose that crows can plan for future needs, not just respond to immediate hunger.", "stem": "Which finding would most directly support this proposal?", "choices": ["Crows ate more when hungry.", "Crows selected and saved a tool they would need only the next day to reach food, even when not hungry.", "Crows flew in flocks.", "Crows ate insects and seeds."], "ans": 1, "exp": "Saving a tool for tomorrow while not hungry shows future planning."}, {"id": "r182", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "medium", "type": "mc", "passage": "An economist argues that remote work has increased demand for housing in small towns.", "stem": "Which finding would best support the argument?", "choices": ["Home prices in small towns rose faster than in big cities after remote work spread, and buyers often cited remote jobs.", "Big cities have tall buildings.", "Many people commute by car.", "Some offices closed on weekends."], "ans": 0, "exp": "A links small-town housing demand to remote work."}, {"id": "r183", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "hard", "type": "mc", "passage": "A critic claims that the poet uses images of water to represent memory throughout the collection.", "stem": "Which quotation would best support the claim?", "choices": ["\"The kettle whistled at dawn.\"", "\"My childhood rises like a tide, then pulls away, leaving shells of names on the sand.\"", "\"The garden was dry all summer.\"", "\"I walked to the station alone.\""], "ans": 1, "exp": "The tide image explicitly represents childhood memories."}, {"id": "r184", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "A table lists median home prices in a county: 2020, $310,000; 2021, $355,000; 2022, $402,000; 2023, $398,000. A reporter claims prices rose more from 2021 to 2022 than from 2020 to 2021.", "stem": "Which choice supports the claim?", "choices": ["Prices rose $47,000 from 2021 to 2022, compared with $45,000 from 2020 to 2021.", "Prices fell in 2023.", "Prices were highest in 2022.", "Prices were $310,000 in 2020."], "ans": 0, "exp": "Compare increases: 47,000 > 45,000. A."}, {"id": "r185", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "Researchers counted monarch butterflies at a site: 2018, 2,400; 2019, 1,900; 2020, 1,100; 2021, 1,500. They claim the population declined for two straight years before partially recovering.", "stem": "Which choice best supports the claim using the data?", "choices": ["Counts fell from 2,400 to 1,900 to 1,100, then rose to 1,500.", "The highest count was 2,400.", "The count in 2021 was 1,500.", "Counts were taken every year."], "ans": 0, "exp": "A covers both the two-year decline and the partial recovery."}, {"id": "r186", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "medium", "type": "mc", "passage": "A survey asked students their favorite lunch: pizza 38%, tacos 27%, salad 15%, sandwiches 20%. A student claims that tacos and sandwiches together were more popular than pizza.", "stem": "Is the claim supported?", "choices": ["Yes: 27% + 20% = 47%, which is greater than 38%.", "No: pizza was the single most popular.", "Yes: salad was least popular.", "No: 27% is less than 38%."], "ans": 0, "exp": "Combined 47% > 38%. A. B is true but doesn't address the combined claim."}, {"id": "r187", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "hard", "type": "mc", "passage": "An experiment tested battery life (hours) at different screen brightness: 25%, 14 h; 50%, 11 h; 75%, 8 h; 100%, 5 h. The researcher claims each 25-point brightness increase reduced battery life by the same amount.", "stem": "Which choice best supports the claim?", "choices": ["Battery life dropped by 3 hours for each 25-point increase.", "Battery life was 14 hours at 25%.", "Battery life was lowest at 100%.", "The phone was tested four times."], "ans": 0, "exp": "Differences: 3, 3, 3. A."}, {"id": "r188", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Ancient Roman concrete has survived 2,000 years in seawater, while modern concrete often cracks within decades in similar conditions. Analysis shows Roman concrete contains volcanic ash that reacts with seawater to form new minerals that fill cracks. This suggests that ______", "stem": "Which choice most logically completes the text?", "choices": ["modern concrete contains too much volcanic ash.", "Roman concrete's durability may partly result from a chemical reaction that repairs damage over time.", "seawater always strengthens concrete.", "the Romans did not build near the sea."], "ans": 1, "exp": "Ash + seawater → minerals filling cracks → self-repair. B."}, {"id": "r189", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "medium", "type": "mc", "passage": "A coffee shop began offering a 10% discount to customers who bring reusable cups. Within a month, disposable cup use fell by 30%, although total sales stayed steady. This suggests that ______", "stem": "Which choice most logically completes the text?", "choices": ["customers stopped buying coffee.", "the discount encouraged many customers to switch to reusable cups.", "disposable cups became more expensive.", "reusable cups are unpopular."], "ans": 1, "exp": "Steady sales + fewer disposable cups → switching. B."}, {"id": "r190", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Children in a study were shown two puppets: one that told the truth about where a toy was hidden and one that lied. Later, when both puppets gave advice about a new toy, most children followed the truthful puppet. The results suggest that young children ______", "stem": "Which choice most logically completes the text?", "choices": ["cannot tell puppets apart.", "track the past reliability of sources when deciding whom to trust.", "prefer toys to puppets.", "always distrust adults."], "ans": 1, "exp": "They used past truthfulness to choose. B."}, {"id": "r191", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "Some deep-sea fish have lost the ability to see color, but they retain highly sensitive vision for detecting faint blue light. Since sunlight barely reaches their depths, the main light source there is bioluminescence, which is mostly blue. Therefore, these fishes' vision is likely ______", "stem": "Which choice most logically completes the text?", "choices": ["useless.", "specialized for detecting light produced by other organisms.", "better than human color vision.", "used mainly at the surface."], "ans": 1, "exp": "Blue-sensitive vision matches blue bioluminescence. B."}, {"id": "r192", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "medium", "type": "mc", "passage": "After a town added bike lanes on Main Street, the number of cyclists on that street tripled. Meanwhile, the number of cyclists on nearby streets without lanes fell slightly. One explanation is that ______", "stem": "Which choice most logically completes the text?", "choices": ["some existing cyclists shifted routes to use the new lanes.", "people stopped owning bikes.", "bike lanes increase car traffic.", "Main Street was closed."], "ans": 0, "exp": "More on Main, fewer on nearby streets → route shifting (at least partly)."}, {"id": "r193", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "hard", "type": "mc", "passage": "Composer Florence Price was the first Black woman to have a symphony performed by a major American orchestra, in 1933. Yet much of her music was nearly lost; in 2009, dozens of her manuscripts were discovered in an abandoned house, sparking renewed interest in her work.", "stem": "Which choice best states the main idea of the text?", "choices": ["Price's music was always widely performed.", "Despite an early landmark achievement, Price's work was long neglected until a rediscovery revived interest.", "Price wrote only one symphony.", "The abandoned house belonged to an orchestra."], "ans": 1, "exp": "Achievement → neglect → rediscovery. B."}, {"id": "r194", "sec": "rw", "dom": "Information and Ideas", "skill": "Central Ideas and Details", "diff": "medium", "type": "mc", "passage": "The axolotl, a salamander native to lakes near Mexico City, can regrow lost limbs, parts of its heart, and even portions of its brain. Scientists study it hoping to learn how tissue regeneration might someday be encouraged in humans.", "stem": "Why do scientists study the axolotl, according to the text?", "choices": ["Because it is endangered", "To learn about regeneration that might apply to humans", "Because it lives in Mexico City", "To breed it as a pet"], "ans": 1, "exp": "Stated directly."}, {"id": "r195", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Textual)", "diff": "medium", "type": "mc", "passage": "A historian argues that the printing press made books far more affordable in fifteenth-century Europe.", "stem": "Which evidence would most directly support the argument?", "choices": ["Records show that the price of a book fell by roughly 80% within decades of the press's arrival.", "Printers worked long hours.", "Many books were religious.", "Gutenberg lived in Mainz."], "ans": 0, "exp": "Price data directly shows affordability."}, {"id": "r196", "sec": "rw", "dom": "Information and Ideas", "skill": "Inferences", "diff": "hard", "type": "mc", "passage": "The novel's narrator says she 'never cared' about winning the spelling bee. Yet she describes, in precise detail, the word she misspelled, the judge's expression, and the color of the winner's ribbon—twenty years later. The details suggest that the narrator ______", "stem": "Which choice most logically completes the text?", "choices": ["has a poor memory.", "cared about the competition more than she claims.", "won the spelling bee.", "was a judge."], "ans": 1, "exp": "Vivid, lasting memory contradicts 'never cared.'"}, {"id": "r197", "sec": "rw", "dom": "Information and Ideas", "skill": "Command of Evidence (Quantitative)", "diff": "medium", "type": "mc", "passage": "A table of average monthly temperatures (°F) in Dallas: Jan 47, Apr 66, Jul 86, Oct 68. A student says July is about 40 degrees warmer than January.", "stem": "Is the student's statement accurate?", "choices": ["Yes: 86 − 47 = 39, about 40 degrees.", "No: the difference is 20 degrees.", "No: April is warmer than July.", "Yes: October is warmest."], "ans": 0, "exp": "86 − 47 = 39 ≈ 40."}, {"id": "r198", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The city's plan to revive downtown was ______: it combined new housing, transit, parks, and small-business grants rather than relying on a single fix.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["multifaceted", "perfunctory", "unilateral", "provisional"], "ans": 0, "exp": "Many components = multifaceted."}, {"id": "r199", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Though her tone was ______, the reviewer's critique was devastating: she calmly listed every factual error in the book.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["measured", "furious", "playful", "confused"], "ans": 0, "exp": "'Though... devastating' and 'calmly' point to a measured tone."}, {"id": "r200", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "The scientist's hypothesis was ______ by the new data, which matched her predictions closely.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["undermined", "corroborated", "ignored", "postponed"], "ans": 1, "exp": "Data matching predictions supports (corroborates) it."}, {"id": "r201", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "Rather than ______ the town's history, the museum's new exhibit confronts its painful chapters directly, including the 1918 fire and the labor strikes.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["sanitize", "document", "examine", "exhibit"], "ans": 0, "exp": "Contrast with 'confronts... painful chapters' → sanitize (clean up, hide unpleasant parts)."}, {"id": "r202", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The athlete's comeback seemed ______ to fans who had watched her struggle with injuries for two years; few expected her to compete again.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["inevitable", "improbable", "routine", "trivial"], "ans": 1, "exp": "Few expected it → improbable."}, {"id": "r203", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "medium", "type": "mc", "passage": "Because the bridge was ______ during the storm, officials closed it until engineers could inspect it.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["compromised", "celebrated", "renovated", "illuminated"], "ans": 0, "exp": "Closing for inspection implies possible damage: compromised."}, {"id": "r204", "sec": "rw", "dom": "Craft and Structure", "skill": "Words in Context", "diff": "hard", "type": "mc", "passage": "The memoir is notable for its ______: the author admits to mistakes, jealousies, and failures that most writers would leave out.", "stem": "Which choice completes the text with the most logical and precise word or phrase?", "choices": ["candor", "brevity", "pretension", "obscurity"], "ans": 0, "exp": "Admitting flaws openly = candor."}, {"id": "r205", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "Many assume that the Great Wall of China is visible from space with the naked eye. Astronauts, however, report that it is very difficult to see because it is narrow and similar in color to the surrounding land. The claim persists largely because it has been repeated in textbooks for decades.", "stem": "Which choice best describes the function of the final sentence?", "choices": ["It offers an explanation for why a false belief continues.", "It provides evidence that the wall is visible.", "It describes how the wall was built.", "It criticizes astronauts."], "ans": 0, "exp": "Final sentence explains the persistence of the myth."}, {"id": "r206", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "The essay opens with a scene of a family arguing over a crowded dinner table, then shifts to statistics on rising housing costs, and closes by proposing new zoning rules.", "stem": "Which choice best describes the structure of the essay?", "choices": ["It moves from a personal illustration to broader data to a proposed solution.", "It lists zoning rules in order.", "It argues that families should eat separately.", "It compares two cities."], "ans": 0, "exp": "Scene → data → proposal. A."}, {"id": "r207", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "In the poem, the speaker describes an old oak 'holding the sky on its shoulders' through storm after storm. In the final stanza, the speaker's grandmother is described as standing 'the same way.'", "stem": "What is the main effect of the final stanza?", "choices": ["It links the grandmother to the tree's strength and endurance.", "It suggests the grandmother is afraid of storms.", "It describes how oaks grow.", "It shifts the poem's setting to a city."], "ans": 0, "exp": "'The same way' connects her to the enduring oak."}, {"id": "r208", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "medium", "type": "mc", "passage": "Electric cars produce no tailpipe emissions. Still, their overall environmental impact depends on how the electricity that charges them is generated.", "stem": "What is the function of the second sentence?", "choices": ["It qualifies the benefit described in the first sentence.", "It repeats the first sentence.", "It argues electric cars should be banned.", "It describes how batteries work."], "ans": 0, "exp": "'Still' introduces a qualification."}, {"id": "r209", "sec": "rw", "dom": "Craft and Structure", "skill": "Text Structure and Purpose", "diff": "hard", "type": "mc", "passage": "A scientist writes: 'Our model correctly predicted rainfall in 9 of 10 test regions. The tenth, a mountainous area, behaved differently, and we suspect our model does not yet account for how mountains force air upward.'", "stem": "What is the main purpose of the second sentence?", "choices": ["To acknowledge a limitation and propose a possible reason for it", "To claim the model is perfect", "To describe mountain climbing", "To dismiss the first sentence"], "ans": 0, "exp": "It notes the exception and suggests why."}, {"id": "r210", "sec": "rw", "dom": "Craft and Structure", "skill": "Cross-Text Connections", "diff": "hard", "type": "mc", "passage": "Text 1: Some biologists argue that zoos mainly entertain and should be phased out. Text 2: A conservationist notes that zoo breeding programs helped save species like the California condor from extinct
